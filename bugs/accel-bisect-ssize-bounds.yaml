id: accel-bisect-ssize-bounds
title: "bisect: lo/hi outside Py_ssize_t raise OverflowError in C but return lo / raise ValueError or IndexError in bisect.py"
priority: P4
kind: twin-mismatch
module: accel
files: [Modules/_bisectmodule.c, Modules/clinic/_bisectmodule.c.h, Lib/bisect.py]
functions: ["bisect_left", "bisect_right", "insort_left", "insort_right"]
summary: |
  `_bisect` converts lo and hi to Py_ssize_t during argument parsing, so any int outside
  [-2**63, 2**63 - 1] raises OverflowError before the search. The pure-Python twin works on
  Python ints: bisect_left(a, x, 2**63) returns 2**63 (the loop never runs), a lo below -2**63
  raises ValueError('lo must be non-negative'), and a hi of 2**63 or more raises IndexError when
  a[mid] is probed. For lo/hi inside Py_ssize_t (and hi != -1) the twins agree exactly, message
  included (Lean: accel-bisect-twins-agree-nonneg-lo), for lo >= 0; the message of a negative lo
  differs since 3.15, which is accel-bisect-negative-lo-message. insort_* agree for a huge lo,
  because list.insert() then raises the same OverflowError in Python.
likelihood: |
  The 2**63 cases need absurd bounds and are only of theoretical interest.
maybe_intended: |
  The Py_ssize_t boundary is a normal C-accelerator limitation; a maintainer would not change it.
reproducer: |
  from test.support.import_helper import import_fresh_module
  cb = import_fresh_module('bisect', fresh=['_bisect'])
  pb = import_fresh_module('bisect', blocked=['_bisect'])
  a = [1, 2, 3, 4, 5]
  def run(f, *args):
      try:
          return f(a, 3, *args)
      except Exception as e:
          return f'{type(e).__name__}: {e}'
  rows = [(args, run(cb.bisect_left, *args), run(pb.bisect_left, *args))
          for args in [(2**63,), (-2**63 - 1,), (0, 2**63), (-1,)]]
  for args, c, p in rows:
      print('bisect_left(a, 3, *%r): C %r | Python %r' % (args, c, p))
  if rows[0][1].startswith('OverflowError') and rows[0][2] == 2**63:
      print('REPRODUCED accel-bisect-ssize-bounds')
expected: |
  Both twins raise the same exception class (or return the same value) for every int lo and hi.
observed: |
  python3 3.15.2: lo=2**63 -> C OverflowError / Python 2**63; lo=-2**63-1 -> OverflowError /
  ValueError; hi=2**63 -> OverflowError("cannot fit 'int' into an index-sized integer") /
  IndexError("list index out of range"). REPRODUCED.
  main (python.exe 3.16.0a1+dev heads/main:ef1fce0): identical. REPRODUCED.
promised_by: |
  No documentation; the invariant is that `_bisect` is a drop-in replacement for bisect.py
  (Modules/_bisectmodule.c:1 "Drop in replacement for bisect.py").
cause: |
  Modules/clinic/_bisectmodule.c.h: lo goes through _PyNumber_Index + PyLong_AsSsize_t and hi
  through _Py_convert_optional_to_ssize_t (Python/modsupport.c:15-35, PyNumber_AsSsize_t with
  OverflowError). Lib/bisect.py:34-46 uses unbounded ints and only fails when a[mid] is
  converted (IndexError from list_subscript).
possible_fix: |
  None needed for the 2**63 boundary.
duplicates:
  issues:
    - {number: 57705, state: closed, relation: related (mid overflow, fixed in 2011)}
  queries: ["bisect OverflowError", "bisect lo maxsize", "bisect lo hi overflow", "bisect lo cannot be negative",
            "allow_negative", "Py_ssize_t allow_negative", "bisect in:title"]
lean:
  property: PyLean.Accel.BisectTwinsAgreeHiNotMinusOne
  theorem: PyLean.Accel.bisectTwinsAgreeHiNotMinusOne_refuted
