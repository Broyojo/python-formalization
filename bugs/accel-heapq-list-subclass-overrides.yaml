id: accel-heapq-list-subclass-overrides
title: "heapq: _heapq ignores a list subclass's overridden methods and rejects non-lists, while heapq.py honours and accepts them"
priority: P5
kind: twin-divergence
module: accel
files: [Modules/_heapqmodule.c, Modules/clinic/_heapqmodule.c.h, Lib/heapq.py]
functions: ["_heapq_heappush_impl", "_heapq_heapify_impl", "heappush", "heapify"]
summary: |
  The C functions take any object passing PyList_Check (a list or any subclass) and then work on
  the raw list storage (_PyList_AppendTakeRef, _PyList_ITEMS, PyList_SetSlice), so a subclass's
  append, __getitem__, __setitem__, __len__ or pop overrides are never called. Lib/heapq.py is
  duck-typed: it calls heap.append, heap[i], heap[i] = v, len(heap), heap.pop() and bool(heap),
  which dispatch to the overrides, and it accepts objects that are not lists at all.
  heappush(LoggedList([1, 2, 3]), 0) for a subclass logging append and __getitem__ leaves
  [0, 1, 3, 2] in both, but C calls none of the overrides and Python calls append once and
  __getitem__ three times. heapify(()) raises TypeError('heapify() argument must be list, not
  tuple') in C and returns None in Python.

  Lean states every C/Python agreement over an exact list (listSeq); this record is the
  refutation of the statement without that scope (accel-heap-twins-agree-any-seq).
likelihood: |
  Only code that subclasses list and overrides these methods (to log, to keep an index of
  positions, ...) or that passes a non-list, and that runs the pure-Python module.
maybe_intended: |
  Almost certainly. The C accelerators throughout the stdlib use the concrete list API, and the
  docs say the heap functions take a list.
reproducer: |
  from test.support.import_helper import import_fresh_module
  ch = import_fresh_module('heapq', fresh=['_heapq'])
  ph = import_fresh_module('heapq', blocked=['_heapq'])

  calls = []

  class LoggedList(list):
      def append(self, x):
          calls.append('append')
          super().append(x)
      def __getitem__(self, i):
          calls.append('getitem')
          return super().__getitem__(i)

  seen = {}
  for name, mod in (('C', ch), ('Python', ph)):
      calls.clear()
      h = LoggedList([1, 2, 3])
      mod.heappush(h, 0)
      seen[name] = (list(h), list(calls))
      print(f'{name:6s} heappush(LoggedList([1, 2, 3]), 0): list {list(h)}, overrides called {calls}')

  tup = {}
  for name, mod in (('C', ch), ('Python', ph)):
      try:
          tup[name] = repr(mod.heapify(()))
      except Exception as e:
          tup[name] = f'{type(e).__name__}: {e}'
      print(f'{name:6s} heapify(()): {tup[name]}')

  if (seen['C'][1] == [] and 'append' in seen['Python'][1] and seen['C'][0] == seen['Python'][0]
          and tup['C'].startswith('TypeError') and tup['Python'] == 'None'):
      print('REPRODUCED accel-heapq-list-subclass-overrides')
expected: |
  A drop-in replacement would call the same methods and accept the same arguments.
observed: |
  python3 3.15.2: C calls no override, Python calls append and __getitem__ x3; heapify(()):
  C TypeError, Python None. REPRODUCED.
  main (python.exe 3.16.0a1+dev ef1fce0): identical. REPRODUCED.
promised_by: |
  Modules/_heapqmodule.c:1 ("Drop in replacement for heapq.py"); Doc/library/heapq.rst speaks
  of lists.
cause: |
  Modules/clinic/_heapqmodule.c.h:30-33 (and the other wrappers) check PyList_Check; the impls
  use _PyList_AppendTakeRef (Modules/_heapqmodule.c:142), _PyList_ITEMS (:41, :86) and
  PyList_SetSlice (:167). Lib/heapq.py:133-215 use the object's own methods.
possible_fix: |
  None needed; document that the heap functions use the list storage directly.
duplicates:
  issues: []
  related: ["python/cpython#55186 (open): Concrete object C API considered harmful to subclasses of builtin types, the general pattern"]
  queries: ["heapq list subclass", "heapq subclass append", "heapq duck typing", "heappush list subclass override", "heapq pure python C version difference", "heapq python version C version difference"]
