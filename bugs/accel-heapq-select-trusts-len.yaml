  queries: ["heapq nsmallest slice sorted redundant", "nsmallest __len__", "nsmallest",
            "heapq remove slice", "heapq.nsmallest more than n __len__", "nlargest len iterable sorted slice"]
  bugforge: "#158718 concerns nsmallest and equality, not len(): no match"
  cause_pr: "#139087, merged 2025-09-18"
