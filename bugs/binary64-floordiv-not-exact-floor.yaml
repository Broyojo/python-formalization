id: binary64-floordiv-not-exact-floor
title: "float // and divmod miss the exact floor for quotients above about 2**51, in both directions"
priority: P4
kind: accuracy
module: binary64
files: [Objects/floatobject.c]
functions: ["_float_div_mod", "float_floor_div", "float_divmod"]
summary: |
  _float_div_mod computes the remainder exactly with fmod, then gets the quotient by
  rounding (vx - mod) / wx in floating point. For quotients above about 2**51 the two
  roundings can move it past the nearest integer, and the "snap" step keeps the wrong one.
  574432016605032.2 // 0.24012708848409187 returns 2392199981398964.0, but the exact floor
  is 2392199981398965, which is below 2**52 and exactly representable. The documentation of
  divmod says q is usually math.floor(a / b) "but may be 1 less"; q can also be one more,
  and for quotients above 2**52 two less. Since x % y is the exact remainder, the pair from
  divmod can miss the identity q * y + r == x by a whole y in exact arithmetic.
likelihood: |
  Needs a quotient above 2**51, where the operands differ by 15 or more decimal digits and
  float results are already coarse. Random operands at that scale hit it a few percent of the time.
maybe_intended: |
  Largely yes. The comment at floatobject.c:629-634 says the division is an approximation
  and the code snaps to the nearest integer, and the docs hedge. A maintainer could fairly
  close this as working as documented; the one solid point is that the hedge in the divmod
  docs is too narrow, so a docs change may be all that is wanted.
reproducer: |
  import math
  from fractions import Fraction as F
  x, y = 574432016605032.2, 0.24012708848409187
  q, r = divmod(x, y)
  exact = math.floor(F(x) / F(y))
  print('x // y =', x // y, ' exact floor =', exact)
  a = float.fromhex('-0x1.765b303d50491p+51')
  b = float.fromhex('0x1.b92103f617877p-2')
  print('a // b =', a // b, ' floor(a / b) =', math.floor(a / b))
  c = float.fromhex('0x1.4e16a2c34ecadp+53')
  d = float.fromhex('0x1.5e87688daf401p+0')
  print('c // d =', c // d, ' floor(c / d) =', math.floor(c / d))
  if (exact < 2 ** 52 and q != float(exact) and x // y == float(exact) - 1
          and a // b == float(math.floor(a / b)) + 1
          and c // d == float(math.floor(c / d)) - 2):
      print('REPRODUCED binary64-floordiv-not-exact-floor')
expected: |
  x // y == float(math.floor(Fraction(x) / Fraction(y))) when the floor fits in 53 bits, or
  failing that a divmod doc sentence that allows what happens.
promised_by: |
  Doc/library/functions.rst, divmod: "q is usually math.floor(a / b) but may be 1 less than
  that". Doc/library/stdtypes.rst: x // y is the floored quotient.
cause: |
  Objects/floatobject.c:635 `div = (vx - *mod) / wx` rounds twice (once in the subtraction,
  once in the division). :651-654 can only snap to an integer next to that inexact div.
possible_fix: |
  Compute the quotient with fma so vx - mod does not round twice, or when |div| >= 2**50
  correct it with one exact residual check. Or leave the code and widen the hedge in the
  divmod documentation to "may differ from it for very large quotients".
tested: |
  python3 3.14.7: REPRODUCED. main: REPRODUCED.
