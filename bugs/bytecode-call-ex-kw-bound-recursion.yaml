    - {number: 155405, state: closed, relation: related, reason: "earlier gh-155151 PR, closed unmerged"}
    - {number: 155272, state: closed, relation: related, reason: "earlier gh-155151 PR, closed unmerged"}
  bugforge: "none: vendor/bugforge-results/README.md has no recursion-limit or CALL_EX_PY entry"
  queries: ["gh search prs --repo python/cpython _CHECK_RECURSION_REMAINING (156346, 155405, 155272, 144394, 137887)",
            "gh search prs --repo python/cpython 155151 (156346, 155405, 155272)",
            "gh issue view 155151 (open)", "gh pr view 156346; gh pr diff 156346"]
