  property: PyLean.Bytecode.CallExPyRefines
  theorem: PyLean.Bytecode.callExPyRefines_refuted
  also: [PyLean.Bytecode.CallKwBoundMethodRefines, PyLean.Bytecode.callKwBoundMethodRefines_refuted]
