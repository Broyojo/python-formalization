id: bytecode-flineno-null-on-stack
title: "f_lineno jump analysis treats a NULL slot (LOAD_SPECIAL/PUSH_NULL self_or_null) as an object, so a jump into a `with` body leaves NULL where an object is read (segfault)"
priority: P2
kind: crash
module: bytecode
files: [Objects/frameobject.c, Python/bytecodes.c]
functions: ["mark_stacks", "compatible_stack", "frame_lineno_set_impl"]
summary: |
  `mark_stacks` (Objects/frameobject.c:1308-1519) assigns a `Kind` to each stack slot; `Null` marks
  a `NULL` placeholder such as the `self_or_null` that `LOAD_SPECIAL` / `_INSERT_NULL` push for a
  `with` statement's `__enter__`/`__exit__` lookup (Python/bytecodes.c:3496-3521). `compatible_kind`
  (lines 1175-1187) allows anything to flow *to* a `Null` slot but, crucially, `mark_stacks`
  records the slot that a bound method / `__exit__` is loaded into via the `default:` case as
  `Object` (line 1480), not `Null`. The jump-target analysis in `frame_lineno_set_impl` then
  approves a `frame.f_lineno = n` jump that lands just after a `with`'s setup, where the eval
  stack actually holds a `NULL`. The warning/`None`-assignment pass at lines 1788-1812 only fixes
  NULL *locals*, not NULL values already on the eval stack, so the interpreter resumes and reads a
  `NULL` as a live object, segfaulting on both 3.14.7 and main.
likelihood: |
  Low. It needs a trace function that sets `f_lineno` to jump across a `with` setup. But it is a
  hard interpreter crash reachable from pure Python, and the `None`-to-unbound-locals mitigation
  gives a false sense that NULLs are handled.
maybe_intended: |
  No. gh-94438 ("frame.setlineno has serious flaws") explicitly listed "does not account for NULLs
  on the stack" as a flaw to fix and marked it done; this reproduces a NULL-on-stack crash on
  current 3.14.7 and main, so either the fix was incomplete or it regressed.
reproducer: |
  import subprocess, sys, textwrap
  prog = textwrap.dedent('''
      import sys
      class CM:
          __enter__ = staticmethod(lambda: None)
          __exit__ = staticmethod(lambda *a: None)
      def victim(a, b, c):
          with CM():
              x = 1
              pass
          y = (a, b,
               c)
          return y
      first = victim.__code__.co_firstlineno
      LINE_A = first + 2
      LINE_B = first + 5
      done = [False]
      def tr(frame, event, arg):
          if frame.f_code is victim.__code__ and event == "line" and not done[0] and frame.f_lineno == LINE_A:
              done[0] = True
              try:
                  frame.f_lineno = LINE_B
              except ValueError:
                  print("rejected"); sys.exit(7)
          return tr
      sys.settrace(tr)
      victim(1, 2, 3)
      sys.settrace(None)
      print("no crash")
  ''')
  r = subprocess.run([sys.executable, "-c", prog], capture_output=True, text=True)
  # A clean reject (exit 7) is correct; a crash (negative return code) is the bug.
  if r.returncode < 0:
      print("returncode", r.returncode)
      print("REPRODUCED bytecode-flineno-null-on-stack")
expected: |
  The jump is either performed safely or rejected with `ValueError`; it must never leave a `NULL`
  on the evaluation stack to be used as an object.
observed: |
  python3 3.14.7: segmentation fault (core dumped). REPRODUCED.
  main (vendor/cpython-main/python.exe, 3.15.0a0): segmentation fault (core dumped). REPRODUCED.
promised_by: |
  invariant: `frame.f_lineno = n` from a trace function must not corrupt the interpreter.
cause: |
  Objects/frameobject.c:1471-1484 (the `default:` arm of `mark_stacks`) records pushed slots as
  `Object`, so the `NULL` slot of a `with`/`LOAD_SPECIAL` sequence is analysed as `Object` and
  `compatible_stack` (1521-1540) approves a jump into it; the NULL-fixup at 1788-1812 covers only
  locals.
possible_fix: |
  Mark the `self_or_null`/`PUSH_NULL` slots as `Null` in `mark_stacks` (as `PUSH_NULL` already
  does at line 1426), or extend the resume-time fixup to replace NULLs on the eval stack, or reject
  jumps whose target stack has an `Object` slot where the source has `Null`.
duplicates:
  issues:
    - {number: 94438, state: closed, relation: related, reason: "listed NULL-on-stack among setlineno flaws and marked fixed; still crashes here"}
    - {number: 132771, state: open, relation: related, reason: "a different mark_stacks integer-overflow issue"}
  queries: ["f_lineno NULL stack crash", "f_lineno jump with statement NULL", "settrace jump crash with statement",
            "f_lineno segfault"]
lean:
  property: PyLean.Bytecode.FrameObj.JumpKeepsObjects
  theorem: PyLean.Bytecode.FrameObj.jumpKeepsObjects_refuted
