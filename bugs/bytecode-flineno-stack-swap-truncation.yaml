id: bytecode-flineno-stack-swap-truncation
title: "f_lineno jump analysis: stack_swap() truncates the modelled stack to 32 bits, so a jump into a deeply nested block corrupts the stack (crash on main)"
priority: P2
kind: crash
module: bytecode
files: [Objects/frameobject.c]
functions: ["stack_swap", "mark_stacks", "compatible_stack", "frame_lineno_set_impl"]
summary: |
  `mark_stacks` models the evaluation stack of each offset as an `int64_t`, three bits per entry
  (Objects/frameobject.c:1169-1531). `stack_swap` (lines 1231-1241) computes the swapped stack in
  `int64_t` but is declared to return `Kind` (an enum, 32-bit on the usual ABI), so its result is
  truncated to 32 bits -- it is assigned straight to `next_stack` at line 1455. For a function
  nested deeply enough that the stack at a `SWAP` needs more than ~10 entries (> 32 bits), the
  truncation drops the high entries, `mark_stacks` records a wrong stack for every later offset,
  and `compatible_stack` then approves a `frame.f_lineno = n` jump that is in fact incompatible.
  The interpreter resumes with a malformed stack. With ~9 nested `for` loops plus a comprehension
  (which the 3.14 compiler inlines with `SWAP`), jumping one line within the innermost body raises
  `TypeError: 'NoneType' object is not an iterator` on 3.14.7 and segfaults on main.
likelihood: |
  Low. It needs a trace function that sets `f_lineno`, plus enough nesting that the modelled stack
  at a `SWAP` exceeds 32 bits. That is unusual in real code, but the consequence -- a wrong
  verdict from the jump-safety analysis leading to stack corruption and an interpreter crash -- is
  serious because it is reachable from pure Python with only `sys.settrace`.
maybe_intended: |
  No. `stack_swap` is meant to compute a 64-bit stack like `push_value`/`pop_value` (which return
  `int64_t`); returning `Kind` and truncating is almost certainly an oversight. The companion
  `Overflowed`/`compatible_stack` machinery exists precisely to be conservative about stacks it
  cannot analyse, and the truncation defeats it.
reproducer: |
  import subprocess, sys, textwrap
  prog = textwrap.dedent('''
      import sys
      DEPTH = 9
      src = "def victim():\\n    n = 0\\n"
      ind = "    "
      for i in range(DEPTH):
          src += ind + f"for i{i} in [1]:\\n"
          ind += "    "
      src += ind + "w = [j for j in [1]]\\n"
      src += ind + "n += 1\\n"
      src += ind + "n += 2\\n"
      src += "    return n\\n"
      ns = {}
      exec(compile(src, "<v>", "exec"), ns)
      victim = ns["victim"]
      first = victim.__code__.co_firstlineno
      LINE_FROM = first + 2 + DEPTH
      LINE_TO = LINE_FROM + 1
      done = [False]
      def tr(frame, event, arg):
          if frame.f_code is victim.__code__ and event == "line" and frame.f_lineno == LINE_FROM and not done[0]:
              done[0] = True
              try:
                  frame.f_lineno = LINE_TO
              except ValueError:
                  print("rejected"); sys.exit(7)
          return tr
      sys.settrace(tr)
      victim()
      sys.settrace(None)
      print("no error")
  ''')
  r = subprocess.run([sys.executable, "-I", "-c", prog], capture_output=True, text=True)
  # A clean reject (exit 7) would be correct; a crash or a TypeError is the bug.
  crashed = r.returncode < 0
  typeerr = "TypeError" in r.stderr and "not an iterator" in r.stderr
  if crashed or typeerr:
      print("returncode", r.returncode, "stderr-tail", r.stderr.strip().splitlines()[-1:] )
      print("REPRODUCED bytecode-flineno-stack-swap-truncation")
expected: |
  The jump is either safely performed with a correctly-analysed stack, or rejected with a
  `ValueError`. It must never resume with a corrupted stack (TypeError from a `None` iterator, or
  a segfault).
observed: |
  python3 3.14.7: `TypeError: 'NoneType' object is not an iterator` from the jumped-to code.
  REPRODUCED.
  main (vendor/cpython-main/python.exe, 3.16.0a1+dev): segmentation fault (core dumped). REPRODUCED
  (the harness runs it in a child and detects the negative return code).
promised_by: |
  invariant: `frame.f_lineno = n` from a trace function must not corrupt the interpreter;
  `compatible_stack`/`mark_stacks` (Objects/frameobject.c:1169-1552) exist to guarantee it.
cause: |
  Objects/frameobject.c:1239 declares `static Kind stack_swap(int64_t stack, int n)`; the body
  (1232-1240) builds an `int64_t` but the `Kind` return type narrows it to 32 bits. Line 1455
  assigns that to `next_stack`. For stacks over ~32 bits the recorded stack is wrong, so
  `compatible_stack` (1521-1540) is consulted with bad data.
possible_fix: |
  Change `stack_swap`'s return type to `int64_t`.
duplicates:
