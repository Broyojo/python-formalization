    - {number: 132771, state: open, relation: related, reason: "a different integer overflow in mark_stacks (the i/len loop, not stack_swap)"}
  queries: ["stack_swap frameobject Kind truncation", "f_lineno deep nesting segfault",
            "setlineno nested loops crash", "mark_stacks"]
