id: bytecode-gen-athrow-awaitable-reusable
title: "A finished athrow() awaitable that went through an await stays reusable: send() resumes the generator with ag_running False"
priority: P3
kind: state-corruption
module: bytecode
files: [Objects/genobject.c]
functions: ["async_gen_athrow_send", "async_gen_athrow_iternext", "async_gen_unwrap_value"]
summary: |
  async_gen_athrow_send closes the awaitable on the first step (check_error, :2404-2407), but later
  steps in athrow() mode end at :2379-2380:
      if (o->agt_typ) { return async_gen_unwrap_value(o->agt_gen, retval); }
  That clears ag_running_async and raises StopIteration(value), and returns without setting
  agt_state = AWAITABLE_STATE_CLOSED. asend (:2003-2005), athrow's own throw (:2459-2462) and aclose
  mode (check_error) all do. So once a body handles the thrown exception by awaiting something and
  then yields, the athrow() awaitable has finished but stays in AWAITABLE_STATE_ITER. Sending to it
  again does not raise "cannot reuse already awaited aclose()/athrow()": it resumes the generator
  through :2378, with ag_running False, because only the INIT path sets the flag. While it sits at
  its next await, a concurrent __anext__() is not detected as running.
likelihood: |
  Low: a finished awaitable has to be driven again, which normal `await` never does. Hand-written
  event-loop or trampoline code that retries an awaitable can do it. The missing flag defeats the
  protection of python/cpython#74956 in that case.
maybe_intended: |
  No: fixed on main, whose do_send path sets AWAITABLE_STATE_CLOSED and clears ag_running_async when
  retval is NULL. The fix did not reach 3.14 or 3.15.
reproducer: |
  import types
  @types.coroutine
  def sus(v):
      yield v
  async def ag():
      try:
          yield 1
      except ValueError:
          await sus("handling")
          yield 2
      await sus("resumed by a finished awaitable")
      yield 3
  a = ag()
  try:
      a.__anext__().send(None)
  except StopIteration:
      pass
  t = a.athrow(ValueError)
  print(t.send(None))
  try:
      t.send(None)
  except StopIteration as e:
      print("awaitable finished with", e.value, "ag_running", a.ag_running)
  try:
      v = t.send(None)
      print("reused:", v, "ag_running", a.ag_running)
      if v == "resumed by a finished awaitable" and not a.ag_running:
          print('REPRODUCED bytecode-gen-athrow-awaitable-reusable')
  except RuntimeError as e:
      print("rejected:", e)
expected: |
  RuntimeError: cannot reuse already awaited aclose()/athrow(), as for asend and for aclose().
observed: |
  python3 3.15.2: the third send returns "resumed by a finished awaitable" with ag_running False.
  REPRODUCED. Same on 3.14.7.
  main (python.exe 3.16.0a1+dev ef1fce0): RuntimeError: cannot reuse already awaited
  aclose()/athrow(). NOT REPRODUCED.
  3.14 branch tip on 2026-11-01 (gh api contents, ref=3.14): this code was unchanged from 3.14.7.
promised_by: |
  The error message itself, and the sibling paths at :2003-2005 and :2459-2462.
cause: |
  Objects/genobject.c:2379-2380 return without the two lines the throw path has at :2459-2462.
possible_fix: |
  Same as main:
      retval = async_gen_unwrap_value(o->agt_gen, retval);
      if (retval == NULL) { o->agt_state = AWAITABLE_STATE_CLOSED; o->agt_gen->ag_running_async = 0; }
      return retval;
