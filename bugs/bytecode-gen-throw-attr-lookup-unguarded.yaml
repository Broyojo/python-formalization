  bugforge: "no generator entries in vendor/bugforge-results/README.md"
  queries: ["generator.throw property segfault", "yield from throw attribute crash", "_gen_throw"]
lean:
  property: PyLean.Bytecode.GenObj.GenThrowLookupSeesExecuting
  theorem: PyLean.Bytecode.GenObj.genThrowLookupSeesExecuting_refuted
