            "gh search prs --repo python/cpython qualname free-threading function",
            "gh search issues --repo python/cpython str subclass __eq__ keyword argument crash",
            "gh search prs --repo python/cpython initialize_locals",
            "gh search prs --repo python/cpython FT_ATOMIC_LOAD_PTR_ACQUIRE func_qualname",
            "gh issue view 153297, gh issue view 154821, gh pr view 153335/154826/154829 (funcobject.c only)"]
  note: "Fixed on main by a change to ceval.c that the searches did not identify (the 3.15 backport of gh-154821 touches only funcobject.c). bugforge-results/README.md has no positional_only or qualname entry."
reproduces:
  python3 (3.15.2): REPRODUCED (corrupted name with PYTHONMALLOC=debug)
  main (vendor/cpython-main/python.exe): NOT REPRODUCED (fixed)
lean:
  model: "lean/PyLean/Bytecode/Ceval.lean bindKeywords: posonlyPassedAsKeyword gets the qualname read before its comparisons, as 3.15.2 does, and PosonlyKeywordRules runs PyObject_RichCompareBool through KwHooks.eq. The model holds values, not reference counts, so it shows the stale name, not the freed memory; no registry entry refutes it."
