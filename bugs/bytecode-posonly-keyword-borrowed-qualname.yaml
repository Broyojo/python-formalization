           "python/cpython#153297 and #154821 (free-threading races on func_set_qualname; not this single-threaded path)"]
  queries: ["gh search issues --repo python/cpython positional_only_passed_as_keyword",
            "gh search issues --repo python/cpython func_qualname use after free",
