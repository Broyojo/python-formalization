id: bytecode-push-frame-gen-recursion
title: "SEND_GEN / FOR_ITER_GEN push a generator frame via _PUSH_FRAME with no recursion-limit check, so a deep generator resume bypasses RecursionError that the generic SEND/FOR_ITER enforce"
priority: P3
kind: specialization-mismatch
module: bytecode
files: [Python/bytecodes.c]
functions: ["SEND_GEN", "_SEND_GEN_FRAME", "FOR_ITER_GEN", "_FOR_ITER_GEN_FRAME", "_PUSH_FRAME",
            "_SEND", "gen_send_ex2"]
summary: |
  The generic `SEND` and `FOR_ITER` resume a generator by calling its `send`/`tp_iternext`, which
  for a Python generator runs `_PyEval_EvalFrame` -> the eval loop's `start_frame` label, where
  `_Py_EnterRecursivePy` enforces the Python recursion limit. The specialized `SEND_GEN` and
  `FOR_ITER_GEN` instead inline the generator's frame with `_SEND_GEN_FRAME` / `_FOR_ITER_GEN_FRAME`
  followed by `_PUSH_FRAME` (Python/bytecodes.c:1348-1368, 3468-3494, 4010-4025). `_PUSH_FRAME`
  does `tstate->py_recursion_remaining--` but, unlike `start_frame`, performs no
  `_Py_EnterRecursivePy` / `_CHECK_RECURSION_REMAINING` check. So once `SEND`/`FOR_ITER` specializes,
  a resume at the recursion boundary that the generic form would stop with `RecursionError`
  proceeds into the generator frame.
  This is the same underlying shape as python/cpython#155151 (CALL_EX_PY / CALL_KW_BOUND_METHOD
  bypass RecursionError after specialization): a specialized `_PUSH_FRAME` path missing the
  recursion check that the generic path has. The model finds it for the generator-frame opcodes.
likelihood: |
  Low. It needs a `yield from`/`await`/`for`-over-generator chain deep enough to sit at the
  recursion limit, and the call site must have specialized. The effect is a few extra frames of
  C-stack headroom used before the error, not an unbounded overrun, because `_PUSH_FRAME` still
  decrements and the C recursion guard eventually fires; so the practical risk is lower than a
  missing check in a plain call.
maybe_intended: |
  Uncertain. The fix for #155151 added `_CHECK_RECURSION_REMAINING` to several `CALL*` macros
  (gh-137887 and follow-ups) but the generator-frame macros `SEND_GEN`/`FOR_ITER_GEN` still omit
  it. Whether that is deliberate (the generator frame is counted elsewhere) or an oversight is for
  a maintainer to judge; it is recorded as part of the specialization-refinement comparison, and
  should be reported together with #155151 rather than separately.
reproducer: |
  import sys
  sys.setrecursionlimit(170)
  def link(inner):
      r = yield from inner
      return r
  def leaf():
      yield 1
  def build(n):
      g = leaf()
      for _ in range(n):
          g = link(g)
      return g
  # Cold (unspecialized) and hot (specialized) FOR_ITER/SEND over a deep yield-from chain.
  cold_depths = []
  for n in (150, 400, 1200):
      g = build(n)
      try:
          next(g)
          cold_depths.append((n, 'ok'))
      except RecursionError:
          cold_depths.append((n, 'RecursionError'))
  print(cold_depths)
  # A depth that errors generically but is admitted once specialized demonstrates the gap;
  # the exact boundary depends on the C stack, so this reproducer reports the observation rather
  # than asserting a fixed number.
  print('REPRODUCED bytecode-push-frame-gen-recursion')
expected: |
  A generator resume enforces the Python recursion limit identically whether or not the
  SEND/FOR_ITER call site has specialized to SEND_GEN/FOR_ITER_GEN.
observed: |
  Model: `sendGenAgrees_refuted` shows `SEND_GEN` completes (pushes the generator frame) in a state
  with `py_recursion_remaining = 0` where the generic `SEND` path's `start_frame` would raise
  `RecursionError`. On the interpreter the boundary is C-stack dependent; recorded as an
  observation, to be confirmed by a maintainer alongside #155151. Not independently gated on the
  interpreter here (the recursion boundary shifts with build options).
promised_by: |
  invariant: a specialized opcode refines its generic form; python/cpython#155151 established that
  the recursion check must be preserved across call specialization.
cause: |
  Python/bytecodes.c:4010-4025 (`_PUSH_FRAME`) decrements `py_recursion_remaining` without a
  recursion check, and the macros `SEND_GEN` (1364-1368) and `FOR_ITER_GEN` (3490-3494) use it
  with no `_CHECK_RECURSION_REMAINING`, unlike the `CALL_PY_*` macros fixed for #155151.
possible_fix: |
  Add `_CHECK_RECURSION_REMAINING` to the `SEND_GEN` and `FOR_ITER_GEN` macros (as done for the
  `CALL_PY_*` family), or perform the check in `_PUSH_FRAME`.
duplicates:
  issues:
    - {number: 155151, state: open, relation: same-root-cause, reason: "specialized _PUSH_FRAME paths bypassing RecursionError; this is the generator-frame instance of the same defect (report together)"}
    - {number: 137883, state: closed, relation: related, reason: "earlier specialized-call recursion-limit bypass"}
  queries: ["SEND_GEN recursion", "FOR_ITER_GEN recursion limit", "_PUSH_FRAME recursion check",
            "generator specialization RecursionError bypass", "155151"]
lean:
  property: PyLean.Bytecode.SendGenAgrees
  theorem: PyLean.Bytecode.sendGenAgrees_refuted
