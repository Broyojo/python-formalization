id: bytesobj-bytearray-alloc-failure-exports
title: "PyByteArray_FromStringAndSize reads ob_exports uninitialized on MemoryError and prints a spurious SystemError"
priority: P4
kind: wrong-error-contract
module: bytesobj
files: [Objects/bytearrayobject.c]
functions: ["PyByteArray_FromStringAndSize", "bytearray_dealloc"]
summary: |
  PyByteArray_FromStringAndSize calls PyObject_New, then PyMem_Malloc for the data, and only then sets
  new->ob_exports = 0. When the malloc fails, Py_DECREF(new) runs bytearray_dealloc on an object whose
  ob_exports is whatever the block held before. If that is positive, dealloc prints
  "SystemError: deallocated bytearray object has exported buffers" on stderr, on top of the MemoryError
  the caller gets. bytearray(b'a') * 2**62 does this every time when the previous occupant of the
  pymalloc block was a 23-byte bytes object full of non-zero bytes. The difftest found it from
  `bytearray(fmt) % (2**47, ...)`, which printed the message in passing.
  Lean: AllocFailureSilent is refuted.
likelihood: |
  Low: it needs a failed allocation of a bytearray. It also reads an uninitialized field, which is what a
  memory sanitizer would report.
maybe_intended: |
  No. main sets ob_exports first, with a comment about the intermittent test failures this caused
  (Objects/bytearrayobject.c:188-194 there).
reproducer: |
  import io, sys
  buf = io.StringIO()
  real = sys.stderr
  sys.stderr = buf
  b = bytearray(b'a')
  for i in range(50):
      x = bytes([1]) * 23
      del x
      try:
          b * (2 ** 62)
      except MemoryError:
          pass
  sys.stderr = real
  n = buf.getvalue().count('deallocated bytearray object has exported buffers')
  print('spurious messages:', n)
  if n:
      print('REPRODUCED bytesobj-bytearray-alloc-failure-exports')
expected: |
  MemoryError and nothing on stderr.
observed: |
  python3 3.14.7: the message on each of the 50 attempts. REPRODUCED.
  main (python.exe 3.16.0a1+dev heads/main:ef1fce0): none. NOT REPRODUCED: fixed on main.
promised_by: |
  Invariant: no read of uninitialized memory; a failed allocation reports MemoryError only.
cause: |
  Objects/bytearrayobject.c:162-184 (3.14.7): `new->ob_exports = 0` at :184 comes after the `Py_DECREF(new)`
  on the failure path at :174; bytearray_dealloc tests it at :1261.
possible_fix: |
  Set ob_exports (and ob_bytes) right after PyObject_New, as main does. The 3.14 branch still has
  the old order (read with `gh api`), so this is a candidate for a small 3.14 fix.
duplicates:
  issues: []
  fixed_by: "the gh-139871 rewrite of bytearray on top of a bytes object, main and 3.15 only; no issue names this path"
  queries: ["ob_exports uninitialized", "deallocated bytearray object has exported buffers", "PyByteArray_FromStringAndSize",
            "bytearray memory error dealloc", "bugforge README: no match"]
lean:
  property: PyLean.BytesObj.Bytes.AllocFailureSilent
  theorem: PyLean.BytesObj.Bytes.allocFailureSilent_refuted
