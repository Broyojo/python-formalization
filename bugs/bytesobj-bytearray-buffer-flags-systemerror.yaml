  prs:
    - {number: 114802, state: merged, relation: "'PyBuffer_FillInfo now raises on PyBUF_{READ,WRITE}' (2024-02-04): introduced the SystemError this record reaches from Python via __buffer__"}
  queries: ["__buffer__ SystemError", "PyBUF_READ PyBuffer_FillInfo", "BufferFlags READ bad argument internal function",
    "__buffer__ flags", "PyBuffer_FillInfo SystemError", "bad argument to internal function buffer"]
  bugforge: "no entry (vendor/bugforge-results/README.md has no PyBUF_READ, BufferFlags or 'bad argument to internal function' finding)"
