id: bytesobj-bytearray-init-iterator-ignores-start
title: "bytearray.__init__ from an iterator tests capacity without ob_start: an iterator that shrinks the front gets a heap write past the buffer"
priority: P2
kind: duplicate-open-upstream
module: bytesobj
files: [Objects/bytearrayobject.c]
functions: ["bytearray___init___impl"]
summary: |
  The slow path of bytearray.__init__ appends in place when `Py_SIZE(self) + 1 < self->ob_alloc`.
  ob_alloc counts from ob_bytes, but the bytes start at ob_start, so after a front deletion
  (`b[:k] = b''` advances ob_start) the free space is ob_alloc - offset. An iterator can do that while
  __init__ runs, because self is reachable. Every later item then grows the object past the end of the
  allocation.
  Lean: InitLoopKeepsLayout (one append of this loop keeps a valid buffer layout) is refuted, by the same
  BA.WF invariant that ResizeWF proves bytearray_resize_lock_held keeps. InitLoopFreshLayout, the same
  statement for offset 0, is proven, so the offset is the whole cause.
likelihood: |
  Low: the iterator has to mutate the object being initialised. Severity is high: this is a heap write
  of attacker-chosen bytes from pure Python.
maybe_intended: |
  No. Every other path goes through PyByteArray_Resize, which accounts for the offset.
reproducer: |
  b = bytearray()
  N, K = 400, 150
  class It:
      def __iter__(self):
          return self
      def __next__(self):
          if not hasattr(self, 'alloc'):
              b.extend(b'x' * N)
              b[0:K] = b''
              self.alloc = b.__alloc__() - 33     # ob_alloc: __alloc__ adds the bytes header
              return 0x41
          if K + len(b) > self.alloc:
              raise StopIteration
          return 0x41
  it = It()
  b.__init__(it)
  print('len', len(b), 'alloc', it.alloc, 'now', b.__alloc__() - 33, 'offset', K)
  # The terminator of the last append lands at offset + len. The loop stops one byte past the bytes
  # object's own terminator, inside the allocator's rounding, so this reproducer does not corrupt the
  # heap. If the allocation did not change, nothing moved the data, and that byte was written out of
  # bounds.
  if K + len(b) > it.alloc and b.__alloc__() - 33 == it.alloc:
      print('REPRODUCED bytesobj-bytearray-init-iterator-ignores-start')
expected: |
  The append goes through PyByteArray_Resize and stays inside the allocation.
observed: |
  python3 3.15.2: len 251, ob_alloc 400, offset 150: the object reaches offset + len = 401 > ob_alloc with
  the allocation unchanged. REPRODUCED.
  main (python.exe 3.16.0a1+dev heads/main:ef1fce0): the same. REPRODUCED.
promised_by: |
  Invariant: no write outside an allocation.
cause: |
  Objects/bytearrayobject.c:1165-1168: the test ignores `ob_start - ob_bytes`.
possible_fix: |
  Compare with PyByteArray_AS_STRING/ob_alloc offset, or always call PyByteArray_Resize, which has the
  right test.
duplicates:
  issues:
    - {number: 158928, state: open, relation: "same bug, with a crashing PoC; gh-158947 is an open PR"}
  queries: ["bytearray init"]
lean:
  property: PyLean.BytesObj.Bytes.InitLoopKeepsLayout
  theorem: PyLean.BytesObj.Bytes.initLoopKeepsLayout_refuted
stronger_reproducer: |
  Found by the bytearray review (2026-11-03): the overflow does reach outside the allocation. Under
  PYTHONMALLOC=debug the following aborts on 3.15.2 and main (rc -6, "Debug memory block at address
  ... API 'o'"; the reviewer saw "_PyMem_DebugRawFree: bad trailing pad byte", the pad bytes holding the
  written 0x41s; with 8 trailing items it aborts in _PyMem_DebugRawRealloc instead):
      b = bytearray()
      def g():
          for _ in range(15): yield 0
          del b[:7]
          for _ in range(7): yield 0x41
      b.__init__(g())
      b.clear()
  The upstream report (gh-158928) should quote this, since it shows a real heap write past the buffer.
