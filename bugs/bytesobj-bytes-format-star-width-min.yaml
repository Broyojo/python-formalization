id: bytesobj-bytes-format-star-width-min
title: "b'%*d' % (-2**63, 1) negates PY_SSIZE_T_MIN: the width silently disappears"
priority: P4
kind: duplicate-already-fixed
module: bytesobj
files: [Objects/bytesobject.c, Objects/unicodeobject.c]
functions: ["_PyBytes_FormatEx"]
summary: |
  A negative `*` width means left-justify with width -w. `width = -width` overflows for
  w == PY_SSIZE_T_MIN (undefined in C; with -fwrapv it stays negative). The later `if (width < len)`
  then treats it as no width, so b'%*d' % (-2**63, 1) returns b'1', while -2**63 + 1 raises MemoryError
  and 2**63 raises OverflowError. str has the same code.
  Lean: NegStarWidth is refuted; NegWrapExact (every other negative width is negated exactly) is proven.
likelihood: |
  Very low. It takes the one value that does not fit, and the only effect is a missing width.
maybe_intended: |
  No, but harmless in practice. Worth fixing because it is signed overflow, which sanitizers report.
reproducer: |
  r = b'%*d' % (-2 ** 63, 1)
  print(r)
  if r == b'1':
      print('REPRODUCED bytesobj-bytes-format-star-width-min')
expected: |
  OverflowError, as for a width that does not fit Py_ssize_t.
observed: |
  python3 3.14.7: b'1'. REPRODUCED.
  main (python.exe 3.16.0a1+dev heads/main:ef1fce0): OverflowError: format argument 1: too big for width.
  NOT REPRODUCED: fixed on main.
promised_by: |
  Invariant: no signed overflow in C; a width has the meaning the printf table gives it.
cause: |
  Objects/bytesobject.c:750-753 (3.14.7).
possible_fix: |
  Already done upstream: the 3.14 branch rejects PY_SSIZE_T_MIN with OverflowError("width too big")
  before negating (read with `gh api`). Nothing to file.
duplicates:
  issues: []
  queries: ["bytes format width overflow", "bugforge README: no match"]
lean:
  property: PyLean.BytesObj.Bytes.NegStarWidth
  theorem: PyLean.BytesObj.Bytes.negStarWidth_refuted
