  queries: ["listreviter", "reversed iterator exhausted", "list_reverseiterator", "listreviter_next (PRs)",
            "bugforge README: grep for reversed/reviter/reverse iter: no match",
            "Lib/test/test_list.py: grep for exhaust/it_seq/reversed: pickling only"]
  note: |
    Multi-word GitHub searches require every term and can miss a real duplicate: "list del shrink
    memory" returned nothing although gh-158592 is exactly that kind of report. Treat "none found" here
    as weak evidence; a human should search again before filing. The attribution to the free-threading
    work is inferred from the tags and is not confirmed by a bisect.
