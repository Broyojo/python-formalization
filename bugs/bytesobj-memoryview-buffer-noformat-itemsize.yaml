id: bytesobj-memoryview-buffer-noformat-itemsize
title: "m.__buffer__(flags) without PyBUF_FORMAT gives a view with format 'B' and the old itemsize, whose items are wrong"
priority: P3
kind: invariant-violation
module: bytesobj
files: [Objects/memoryobject.c]
functions: ["memory_getbuf", "init_shared_values", "_PyMemoryView_FromBufferProc", "PyMemoryView_FromObjectAndFlags"]
summary: |
  memory_getbuf without PyBUF_FORMAT sets view->format = NULL and keeps view->itemsize (its comment
  says the equality calcsize(format) = itemsize does not hold from there on). That is fine for a
  consumer that treats the buffer as bytes. But _PyMemoryView_FromBufferProc then builds a new
  memoryview from it, and init_shared_values fills in format "B" next to the old itemsize:
      a = array('i', [256, 2, 3])
      y = memoryview(a).__buffer__(0)
      y.format, y.itemsize, y.shape, y.nbytes     # 'B', 4, (3,), 12
      y.tolist()                                  # [0, 2, 3]
      struct.calcsize(y.format) == y.itemsize     # False
  The view reads one byte every four, so 256 comes back as 0, and y != memoryview(a).
  memoryview._from_flags(a, 0) (the private route, used for buffer flags in PEP 688) does the same.
  Lean: BufferKeepsItemsize is refuted on a 1-item 'i' view.
likelihood: |
  Low: __buffer__ with flags lacking PyBUF_FORMAT is rare in Python code, and mostly appears in
  __buffer__ wrappers that forward their flags to another object's __buffer__.
maybe_intended: |
  Partly. The comment in memory_getbuf knows the invariant breaks for C consumers. The result of
  turning such a Py_buffer back into a memoryview looks unconsidered: a maintainer might set
  itemsize to 1 and rebuild shape, or say that __buffer__(0) has no format promise.
reproducer: |
  import struct
  from array import array
  a = array('i', [256, 2, 3])
  y = memoryview(a).__buffer__(0)
  print(y.format, y.itemsize, y.shape, y.nbytes, y.tolist())
  print(memoryview._from_flags(a, 0).tolist())
  if y.format == 'B' and y.itemsize == 4 and struct.calcsize(y.format) != y.itemsize and y.tolist() == [0, 2, 3]:
      print('REPRODUCED bytesobj-memoryview-buffer-noformat-itemsize')
expected: |
  A view whose elements are what its format says: format 'B', itemsize 1, shape (12,), or the
  original format.
observed: |
  python3 3.14.7: B 4 (3,) 12 [0, 2, 3]. REPRODUCED.
  main (python.exe 3.16.0a1+dev): identical. REPRODUCED.
promised_by: |
  Doc/library/stdtypes.rst:5016, memoryview.itemsize (the example struct.calcsize('H') ==
  m.itemsize); PEP 3118 and Doc/c-api/buffer.rst, itemsize.
cause: |
  Objects/memoryobject.c:1547-1554 (memory_getbuf drops the format, keeps itemsize), :550
  (init_shared_values substitutes "B"), :566-567 (init_shape_strides divides len by the old
  itemsize). _PyMemoryView_FromBufferProc at :831-848 joins them; PyMemoryView_FromObjectAndFlags at
  :811-819 does so for other exporters.
possible_fix: |
  In init_shared_values, when src->format == NULL, set dest->itemsize = 1 (and derive shape and
  strides from len), as a consumer of an unformatted buffer must.
duplicates:
  issues: []
  queries: ["memoryview __buffer__ itemsize format B", "memoryview _from_flags", "PEP 688 memoryview __buffer__ flags",
            "memoryview format itemsize mismatch", "bugforge README: no memoryview entries"]
lean:
  property: PyLean.BytesObj.Mem.BufferKeepsItemsize
  theorem: PyLean.BytesObj.Mem.bufferKeepsItemsize_refuted
