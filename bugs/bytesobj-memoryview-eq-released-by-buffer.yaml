    - {number: 142664, state: closed, relation: "same class, __hash__; its fix is the model for this one"}
    - {number: 143195, state: closed, relation: "same class, hex"}
  queries: ["memoryview comparison __buffer__ release", "memoryview richcompare use after free",
            "memoryview use after free", "memoryview crash segfault release",
            "gh search prs: memoryview released", "bugforge README: no memoryview entries"]
lean:
