id: calstat-statistics-sqrtprod-partial-underflow
title: "statistics._sqrtprod loses accuracy when x*y is subnormal, so correlation() of exactly linear data is far from 1"
priority: P3
kind: wrong-result
module: corelibs
files: [Lib/statistics.py]
functions: ["_sqrtprod", "correlation"]
summary: |
  `_sqrtprod(x, y)` promises sqrt(x * y) "with improved accuracy and without overflow/underflow".
  It rescales only when `sqrt(x * y)` overflows to inf or underflows to exactly 0.0. When the
  product lands in the subnormal range it keeps as few as one or two significant bits, and the
  differential correction cannot recover them, because `sumprod((x, h), (y, -h))` underflows the
  same way. `_sqrtprod(10 * 2**-540, 10 * 2**-538)` returns 9.79... * 2**-539 instead of the exact
  10 * 2**-539 (2% low); in a scan, the relative error reaches 41%.

  `correlation()` divides by `_sqrtprod(sxx, syy)`, so for exactly proportional data whose sums of
  squares are ordinary normal floats it returns values far from 1:
  `correlation([1e-100, 2e-100, 3e-100], [1e-62, 2e-62, 3e-62])` is 0.8997827589086393, and
  `correlation(x, 2*x)` for `x = [1, ..., 5] * 2**-270` is 1.0206207261596576, outside [-1, 1].
  No input and no intermediate sum is subnormal; only the internal product `sxx * syy` is.
likelihood: |
  Low. It needs data whose two sums of squares multiply to below 2**-1022 (about 2.2e-308), for
  example values near 1e-80 in both inputs, or 1e-100 against 1e-62. Physical quantities in SI units
  can be that small. The result is silently wrong, not an error.
maybe_intended: |
  Possibly regarded as an accepted float limitation; a maintainer has rejected subnormal-input
  reports before (python/cpython#158786). Here the inputs are normal floats, and the function exists to
  handle underflow: it already rescales by 2**537 when the product underflows to zero, it just does not
  do so when the product is merely subnormal. The rescaling came with PR #107855 ("Extend _sqrtprod() to
  cover the full range of inputs"); in its review Serhiy Storchaka doubted it was worth going so far,
  since under/overflow can occur outside _sqrtprod in computing its inputs, and Raymond Hettinger
  answered that the module's ethos is "to aim for perfection almost regardless of cost". The
  differential correction came with PR #107781 ("Minor accuracy improvement for
  statistics.correlation()"). The tests added with #107855 (Lib/test/test_statistics.py:2768-2772)
  check only `sys.float_info.min * sys.float_info.epsilon`, whose product underflows to exactly zero,
  and `sys.float_info.max`; no subnormal non-zero product is tested.
upstream_with: [corelibs-statistics-correlation-out-of-range]
upstream_note: |
  File together with corelibs-statistics-correlation-out-of-range: both are correlation() results the
  documentation rules out (outside [-1, 1]), that one by one ulp, this one by far more.
reproducer: |
  import statistics, math
  x = [math.ldexp(i, -270) for i in range(1, 6)]   # 1..5 times 2**-270, all normal floats
  y = [2 * v for v in x]                            # exactly proportional
  r = statistics.correlation(x, y)
  s = statistics._sqrtprod(10 * 2.0**-540, 10 * 2.0**-538)
  print(r, s, s == 10 * 2.0**-539)
  print(statistics.correlation([1e-100, 2e-100, 3e-100], [1e-62, 2e-62, 3e-62]))
  if abs(r - 1.0) > 1e-12 and s != 10 * 2.0**-539:
      print('REPRODUCED calstat-statistics-sqrtprod-partial-underflow')
expected: |
  `_sqrtprod(10 * 2**-540, 10 * 2**-538) == 10 * 2**-539` (the root is exact), and correlation of
  exactly proportional data equal to 1.0 up to rounding.
observed: |
  python3 3.15.2: 1.0206207261596576 5.444624757545261e-162 False, then 0.8997827589086393. REPRODUCED.
  main (python.exe 3.16.0a1+dev ef1fce0): the same. REPRODUCED.
promised_by: |
  Lib/statistics.py:1773, the docstring of _sqrtprod: "Return sqrt(x * y) computed with improved
  accuracy and without overflow/underflow." Lib/statistics.py:691-692 for correlation: "Pearson's
  correlation coefficient r takes values between -1 and +1."
cause: |
  Lib/statistics.py:1784-1790 rescales only when `h = sqrt(x * y)` is exactly zero (`if not h:`). A
  subnormal `x * y` gives a non-zero `h` with few significant bits, and the correction at :1794-1795
  computes `x*y - h*h` with `sumprod`, whose products underflow as well, so `d` is 0 or one subnormal
  step and `h` is returned nearly unchanged.
possible_fix: |
  Rescale whenever the correction term would leave the normal range, not only when the product
  underflows to 0: replace `if not h:` by `if h < 2.0 ** -485:` (sqrt(sys.float_info.min /
  sys.float_info.epsilon)), keeping the inner `if x and y:` and the same 2**537 scale.
  The weaker bound 2**-511 (sqrt of the smallest normal) fixes the subnormal-product case but still
  misrounds when x*y is normal and x*y - h*h is subnormal. Measured on 3.15.2 (2026-11-03), counting
  results that differ from the correctly rounded sqrt(x*y) (exact product, 80-digit Decimal sqrt):
    h < 2**-511 (10455 cases):            current 9357 wrong, 2**-511 0, 2**-485 0
    2**-511 <= h < 2**-485 (31211 cases): current 170 wrong,  2**-511 170, 2**-485 0
    h >= 2**-485 (18334 cases):           all 0
  With the 2**-485 patch, test_statistics passes on 3.15.2 (400 run, 5 skipped) and the reproducer's
  correlation returns 1.0. Diff (against 3.15.2 Lib/statistics.py):
    -    if not h:
    +    if h < 2.0 ** -485:  # sqrt(sys.float_info.min / sys.float_info.epsilon)
             if x and y:
  An upstream PR should add a test for a subnormal (not zero) product.
