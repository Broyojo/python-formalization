    - {number: 102615, state: closed, relation: "repr of ParamSpec in Callable", reason: "different defect"}
  queries: ["gh search issues --repo python/cpython _CallableGenericAlias reduce",
    "gh search issues --repo python/cpython collections.abc.Callable pickle",
    "gh search issues --repo python/cpython Callable nested list args",
    "gh search issues --repo python/cpython _is_param_expr",
