id: corelibs-copy-reduce-six-tuple
title: "copy.copy and copy.deepcopy raise TypeError on a __reduce__ result with a state_setter, which pickle accepts"
priority: P4
kind: logic-error
module: corelibs
files: [Lib/copy.py]
functions: ["_reconstruct", "copy", "deepcopy"]
summary: |
  DUPLICATE of the closed python/cpython#90494, which is why this stays a record and is not to be
  filed. There serhiy-storchaka made the old `deepcopy` parameter keyword-only and said support for the
  sixth item is a new feature that needs its own issue. No such issue turned up. Since 3.8 __reduce__ may return a sixth item, a state_setter callable, and pickle honours it. The
  copy module unpacks the same result into _reconstruct(x, None, *rv), whose signature takes five
  items, so a class using that form pickles fine and fails in copy.copy and copy.deepcopy with
  "_reconstruct() takes from 4 to 7 positional arguments but 8 were given", even when the sixth
  item is None.
likelihood: |
  Low. The sixth item is rarely used; a class that uses it and is also copied will fail loudly.
maybe_intended: |
  Known. The closing comments in #90494 treat it as a missing feature, not a bug. The remaining
  defect is that the docs do not mention the limit and the error names a private function.
reproducer: |
  import copy, pickle
  def build():
      return Thing()
  def setter(obj, state):
      obj.state = state
  class Thing:
      def __reduce__(self):
          return (build, (), 5, None, None, setter)
  outcome = {}
  pickled = pickle.loads(pickle.dumps(Thing(), protocol=4))
  outcome['pickle'] = pickled.state
  for f in (copy.copy, copy.deepcopy):
      try:
          outcome[f.__name__] = f(Thing()).state
      except TypeError as e:
          outcome[f.__name__] = type(e).__name__
  print(outcome)
  if outcome == {'pickle': 5, 'copy': 'TypeError', 'deepcopy': 'TypeError'}:
      print('REPRODUCED corelibs-copy-reduce-six-tuple')
expected: |
  Both copies built through build() and setter(), with state 5.
observed: |
  python3 3.14.7: pickle gives state 5, copy.copy and copy.deepcopy raise TypeError. REPRODUCED.
  main (python.exe 3.16.0a1+dev): same, REPRODUCED.
  python3 3.15.2: REPRODUCED. main (3.16.0a1+dev): REPRODUCED.
promised_by: |
  Doc/library/copy.rst:85: "Classes can use the same interfaces to control copying that they use to
  control pickling."
cause: |
  Lib/copy.py:242-244, the signature of _reconstruct, called at :100 and :156 with *rv.
possible_fix: |
  Add a state_setter parameter to _reconstruct, called with (y, state) in place of the
  __setstate__ path, as pickle does.
duplicates:
  issues:
    - {number: 90494, state: closed, relation: "same defect, 'Sixth element of tuple from __reduce__(), inconsistency between pickle and copy'", reason: "duplicate; support deferred to a new feature issue"}
  queries: ["copy state_setter", "bugforge README: no match for copy or __reduce__"]
lean:
  property: PyLean.CoreLibs.Operator.CopyAcceptsPickleReduce
  theorem: PyLean.CoreLibs.Operator.copyAcceptsPickleReduce_refuted
