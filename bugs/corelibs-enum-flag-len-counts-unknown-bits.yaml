id: corelibs-enum-flag-len-counts-unknown-bits
title: "len(flag) counts bits outside the class, so it disagrees with iteration under KEEP and for IntFlag"
priority: P4
kind: doc-mismatch
module: corelibs
files: [Lib/enum.py, Doc/library/enum.rst]
functions: ["Flag.__len__", "Flag.__iter__"]
summary: |
  Flag.__len__ returns self._value_.bit_count(), while __iter__ goes through _iter_member_ on
  value & _flag_mask_. With the KEEP boundary, the default for IntFlag, a value can hold bits outside the
  class: Perm(8) of a three-bit IntFlag has len 1 and no members.
likelihood: |
  Low to moderate for IntFlag values read from an external source with extra bits, where len is then
  off by the unknown bits.
maybe_intended: |
  Possibly: bit_count is a speed choice, and unknown bits are unusual. The docs say "Returns number of
  members in flag", which is what the code does not do here.
reproducer: |
  from enum import IntFlag
  class Perm(IntFlag):
      R = 4
      W = 2
      X = 1
  p = Perm(8 | 4)
  print(repr(p), len(p), list(p))
  if len(p) == 2 and list(p) == [Perm.R]:
      print('REPRODUCED corelibs-enum-flag-len-counts-unknown-bits')
expected: |
  len(p) == len(list(p)) == 1.
observed: |
  python3 3.14.7: len(Perm(12)) is 2 and list(Perm(12)) is [Perm.R]. REPRODUCED.
  main (python.exe 3.16.0a1+dev): same, REPRODUCED.
promised_by: |
  Doc/library/enum.rst:645, "Returns number of members in flag".
cause: |
  Lib/enum.py:1587-1588, against the mask at :1460.
possible_fix: |
  `return (self._value_ & self._flag_mask_).bit_count()`, or a documentation note.
duplicates:
  issues:
    - {number: 99304, state: closed, relation: "same area, 'The iteration behavior of IntFlag has changed backwards-incompatibly'", reason: "title only; it is about iteration, not len"}
  queries: ["enum Flag len IntFlag bit_count", "bugforge README: no match for enum.Flag"]
lean:
  property: PyLean.CoreLibs.EnumDC.LenMatchesIter
  theorem: PyLean.CoreLibs.EnumDC.lenMatchesIter_refuted
