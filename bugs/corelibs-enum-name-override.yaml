id: corelibs-enum-name-override
title: "enum.unique and verify(UNIQUE) report every member as a duplicate when the class defines its own name"
priority: P3
kind: logic-error
module: corelibs
files: [Lib/enum.py]
functions: ["unique", "verify.__call__", "Enum._add_value_alias_", "Enum.__new__"]
summary: |
  unique and the UNIQUE check of verify look for aliases by comparing each key of __members__ with member.name.
  member.name is a public attribute that a class may redefine, and a property such as `def name(self): return
  self._name_.lower()` is accepted: the rest of enum reads _name_ and works. With such a class there is no alias,
  and yet @unique raises "duplicate values found in <enum 'Color'>: RED -> red, GREEN -> green". verify(CONTINUOUS)
  has the same shape with e.value. _add_value_alias_ files an unhashable value under self.name at
  Lib/enum.py:1262, and Enum.__new__ then does cls[name] at :1193, so Color([1]) raises KeyError 'red' from a lookup
  that should end in the member.
likelihood: |
  Modest. A name property on an enum is unusual but not rare, and @unique on the same class is ordinary. The
  message is misleading, since it names no aliases. The _add_value_alias_ path also needs an unhashable value.
maybe_intended: |
  Not intended: the code means "this key is not the member's own name", which is `_name_`, the attribute the rest of
  the module uses. A maintainer could answer that redefining name is unsupported, but nothing says so, and the
  class otherwise works.
reproducer: |
  from enum import Enum, unique, verify, UNIQUE
  class Color(Enum):
      RED = 1
      GREEN = 2
      @property
      def name(self):
          return self._name_.lower()
  def attempt(f):
      try:
          return f()
      except Exception as e:
          return type(e).__name__
  a = attempt(lambda: unique(Color))
  b = attempt(lambda: verify(UNIQUE)(Color))
  Color.RED._add_value_alias_([1])
  c = attempt(lambda: Color([1]))
  print(a, b, c)
  if a == 'ValueError' and b == 'ValueError' and c == 'KeyError':
      print('REPRODUCED corelibs-enum-name-override')
expected: |
  unique(Color) and verify(UNIQUE)(Color) return Color, and Color([1]) is Color.RED.
observed: |
  python3 3.14.7: ValueError, ValueError, KeyError. REPRODUCED.
  main (3.16.0a1+dev): same, REPRODUCED.
promised_by: |
  The docstring of unique, "Class decorator for enumerations ensuring unique member values", and the docs: it searches
  __members__ "gathering any aliases it finds". The docs example of _add_value_alias_ for the lookup.
cause: |
  Lib/enum.py:1682-1683 and :1982-1983 compare with member.name; :1262 uses self.name as the key of
  _unhashable_values_map_, which :1193 reads with cls[name]. :1990 and :2015 read e.value and m.value.
possible_fix: |
  Read member._name_ and self._name_ in those places, and _value_ in verify.
duplicates:
  issues:
    - {number: 75768, state: closed, relation: "search hit, 'Enum doesn't allow name'", reason: "different: a member called name, not an attribute that overrides Enum.name"}
    - {number: 67939, state: closed, relation: "search hit, reverse lookup for unique enums", reason: "different"}
  queries: ["gh search issues enum unique name property", "gh search issues enum verify UNIQUE overridden name",
            "bugforge README: no match for enum"]
lean:
  property: PyLean.CoreLibs.EnumDC.UniqueOnlyOnAliases
  theorem: PyLean.CoreLibs.EnumDC.uniqueOnlyOnAliases_refuted
