    - {number: 144989, state: open, relation: "proposal to expose the C special-method lookup to Python, from the review of gh-144420", reason: "feature request; does not mention the metaclass"}
    - {number: 144420, state: merged, relation: "PR that added _lookup_special", reason: "review comments discuss the cost of getattr_static, not the metaclass"}
  queries: ["ExitStack metaclass", "_lookup_special contextlib", "contextlib getattr_static",
            "enter_context descriptor", "ExitStack special method lookup", "getattr_static metaclass",
            "bugforge README: no contextlib entries"]
