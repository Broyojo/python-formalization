    - {number: 135312, state: open, relation: "search hit, makes abstract and dunder methods positional-only", reason: "unrelated"}
  queries: ["ItemsView contains", "ItemsView __contains__", "bugforge README: only sortedcontainers.SortedItemsView, a different library"]
