  related: []
  queries: ["gh search issues --repo python/cpython lru_cache maxsize exceeded currsize", "gh search issues --repo python/cpython lru_cache reentrant __eq__ cache size", "gh search issues --repo python/cpython lru_cache grows beyond maxsize", "bugforge README: no match for lru_cache or functools"]
