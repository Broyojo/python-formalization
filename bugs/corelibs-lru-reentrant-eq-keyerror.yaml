id: corelibs-lru-reentrant-eq-keyerror
title: "With a re-entrant __eq__, the pure Python lru_cache raises KeyError from its own del, where C keeps going"
priority: P4
kind: twin-divergence
module: corelibs
files: [Lib/functools.py, Modules/_functoolsmodule.c]
functions: ["_lru_cache_wrapper", "bounded_lru_cache_update_lock_held"]
summary: |
  When the __eq__ of a colliding key calls the cached function again with the same key during the store, the ring gets two
  links for one dict entry. The comment at Modules/_functoolsmodule.c:1494-1498 describes this orphan, and the C wrapper has a
  branch for it at :1542-1550. Python has none: the second eviction of that key reaches `del cache[oldkey]` at
  Lib/functools.py:699 with the key already gone, so the KeyError escapes from a call to the cached function, for a key that
  has nothing to do with the collision. The ring stays out of step, and a later call raises KeyError again.
likelihood: |
  Very low: it needs a colliding key whose __eq__ re-enters the cached function, and the pure Python twin, which CPython uses
  only when _functools is missing.
maybe_intended: |
  Probably tolerated. The Python comment at :701-703 shows the re-entrancy was considered for the last store, not for this
  path. A maintainer may well say that a re-entrant __eq__ gets what it gets; the C twin shows the intended behaviour.
reproducer: |
  from test.support import import_helper
  py = import_helper.import_fresh_module('functools', blocked=['_functools'])
  c = import_helper.import_fresh_module('functools', fresh=['_functools'])
  box = {'left': None, 'hook': None}
  class K:
      def __init__(self, n):
          self.n = n
      def __hash__(self):
          return 1000 if self.n in (0, 2) else self.n
      def __eq__(self, o):
          if box['left'] is not None:
              box['left'] -= 1
              if box['left'] == 0:
                  box['left'] = None
                  box['hook']()
          return self.n == o.n
  def run(m):
      keys = [K(i) for i in range(7)]
      f = m.lru_cache(maxsize=3)(lambda k: k.n * 10)
      box['hook'] = lambda: f(keys[0])
      f(keys[2])
      box['left'] = 3          # the lookup, the check after the call, then the store of key 0
      out = []
      for k in (0, 3, 4, 5, 6):
          try:
              out.append(f(keys[k]))
          except KeyError:
              out.append('KeyError')
      return out
  x, y = run(c), run(py)
  print(x, y)
  if x == [0, 30, 40, 50, 60] and y == [0, 30, 40, 50, 'KeyError']:
      print('REPRODUCED corelibs-lru-reentrant-eq-keyerror')
expected: |
  The same results from both twins, and no KeyError from a call whose key and function are fine.
observed: |
  python3 3.14.7: [0, 30, 40, 50, 60] and [0, 30, 40, 50, KeyError]. REPRODUCED. main (3.16.0a1+dev): REPRODUCED.
  python3 3.15.2: REPRODUCED. main (3.16.0a1+dev): REPRODUCED.
promised_by: |
  Nothing explicit. The two twins disagreeing, and the C comment that treats this state as one to survive.
cause: |
  Lib/functools.py:699: `del cache[oldkey]` assumes every link has a dict entry. The non-full path at :708-714 links first and
  stores last, so a re-entrant store adds a second link for the key.
possible_fix: |
  `cache.pop(oldkey, None)`, as the C wrapper's handling of a missing key amounts to.
duplicates:
