  queries: ["gh search issues --repo python/cpython lru_cache reentrant KeyError", "gh search issues --repo python/cpython lru_cache __eq__ orphan link", "gh search issues --repo python/cpython lru_cache pure python KeyError del cache", "bugforge README: no match for lru_cache"]
