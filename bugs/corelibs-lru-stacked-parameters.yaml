id: corelibs-lru-stacked-parameters
title: "A cache around a cached function reports the inner cache's cache_parameters, and in pure Python its cache_info too"
priority: P3
kind: logic-error
module: corelibs
files: [Lib/functools.py]
functions: ["lru_cache"]
summary: |
  lru_cache sets wrapper.cache_parameters and only then calls update_wrapper(wrapper, user_function), which copies
  user_function.__dict__ over it. When the user function is a cached function, as with stacked decorators or
  lru_cache(maxsize=5)(some_cached), outer.cache_parameters() reports the inner's maxsize and typed. On the Python
  wrapper, cache_info and cache_clear are entries of the same __dict__, so they are overwritten too: outer.cache_info() reads
  the inner cache, and outer.cache_clear() clears the inner one and leaves the outer full.
likelihood: |
  Modest for the C wrapper: stacking two caches is rare, but wrapping an already cached function from a library is
  not, and the wrong answer is silent. The Python wrapper only runs without _functools.
maybe_intended: |
  No. The two lines at Lib/functools.py:590-591 and :599-600 are in the wrong order for this case; the same applies to any
  attribute the user function has under those names.
reproducer: |
  from functools import lru_cache
  from test.support import import_helper
  py = import_helper.import_fresh_module('functools', blocked=['_functools'])
  def build(m):
      inner = m.lru_cache(maxsize=7)(lambda x: x)
      return m.lru_cache(maxsize=5, typed=True)(inner), inner
  outer, inner = build(__import__('functools'))
  p = outer.cache_parameters()
  pouter, pinner = build(py)
  pouter(1)
  before = pouter.cache_info()
  print(p, before)
  if p == {'maxsize': 7, 'typed': False} and before.maxsize == 7:
      print('REPRODUCED corelibs-lru-stacked-parameters')
expected: |
  {'maxsize': 5, 'typed': True}, and a cache_info with maxsize 5, on both twins.
observed: |
  python3 3.14.7: REPRODUCED. main (3.16.0a1+dev): REPRODUCED.
promised_by: |
  Doc/library/functools.rst: the decorated function has cache_parameters() for viewing the values of maxsize and typed.
cause: |
  Lib/functools.py:590-591 and :599-600: update_wrapper runs after the assignment; Lib/functools.py:600 copies __dict__.
possible_fix: |
  Set cache_parameters after update_wrapper, and in pure Python set cache_info and cache_clear after it as well.
duplicates:
  issues: []
  queries: ["gh search issues lru_cache cache_parameters stacked", "gh search issues lru_cache wrapped update_wrapper cache_info __dict__",
            "bugforge README: no match for lru_cache cache_parameters"]
lean:
  property: PyLean.CoreLibs.Functools.LruOwnParams
  theorem: PyLean.CoreLibs.Functools.lruOwnParams_refuted
