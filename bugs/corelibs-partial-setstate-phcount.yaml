  related: ["#70133 type confusion in partial_setstate (2016, the reason for the conversion)",
            "#157841 and #157099 concurrent __setstate__ crashes, free-threaded only, a different cause",
            "#154189 use-after-free through a re-entrant __setstate__, a different cause"]
  queries: ["gh search issues partial setstate crash", "gh search issues partial Placeholder segfault",
            "gh search issues partial __setstate__ tuple subclass", "gh issue view 157197", "gh issue view 154189",
            "gh issue view 157099", "bugforge README: no match for partial and setstate"]
