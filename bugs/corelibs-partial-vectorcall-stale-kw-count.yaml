  related: ["gh-154189 use-after-free: functools partial, closed: same loop, a reset of pto->args from __hash__, fixed by holding references, which does not cover the size", "gh-155733 non-string keywords in partial, open: another way to reach the keyword paths; different defect", "gh-144475 heap-buffer-overflow in partial.__repr__, closed"]
  queries: ["gh search issues --repo python/cpython partial vectorcall keywords crash", "gh search issues --repo python/cpython partial_vectorcall segfault", "gh search issues --repo python/cpython functools.partial keywords mutated during call use after free", "gh search issues --repo python/cpython partial vectorcall merge keywords", "bugforge README: no match for functools.partial"]
