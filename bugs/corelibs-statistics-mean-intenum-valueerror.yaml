id: corelibs-statistics-mean-intenum-valueerror
title: "statistics.mean and variance raise ValueError for IntEnum data when the result is not a member"
priority: P3
kind: crash
module: corelibs
files: [Lib/statistics.py]
functions: ["_convert", "mean", "variance", "pvariance", "harmonic_mean"]
summary: |
  _convert ends with `T(value)`, where T is the common type of the data. For an int subclass whose
  constructor rejects some ints, that call fails when the mean happens to be a whole number outside
  the class. `mean([Level.LOW, Level.HIGH])` with LOW = 1, HIGH = 3 raises
  `ValueError: Fraction(2, 1) is not a valid Level`, while `mean([Level.LOW, Level.LOW, Level.HIGH])`
  gives 1.666..., and `fmean`, `median`, `stdev` work on the same data. When the whole number happens
  to be a member, the mean silently comes back as that enum member.
likelihood: |
  Low to moderate. IntEnum grades, severities and ratings are a natural thing to average, and the
  failure depends on the data, so it can pass tests and fail later.
maybe_intended: |
  Partly. Keeping the input type is deliberate (_convert, and the CoerceTest cases), and the coercion
  rules are called an implementation detail at statistics.py:1569. The exception is not designed
  behaviour: nothing documents it and it leaks an enum lookup error for valid numeric input.
reproducer: |
  import enum, statistics
  class Level(enum.IntEnum):
      LOW = 1
      HIGH = 3
  print(statistics.fmean([Level.LOW, Level.HIGH]), statistics.median([Level.LOW, Level.HIGH]))
  try:
      print(statistics.mean([Level.LOW, Level.HIGH]))
  except ValueError as e:
      print('ValueError:', e)
      print('REPRODUCED corelibs-statistics-mean-intenum-valueerror')
expected: |
  2 or 2.0, the value `fmean` and `median` give.
observed: |
  python3 3.14.7: ValueError: Fraction(2, 1) is not a valid Level. REPRODUCED.
  main (python.exe 3.16.0a1+dev heads/main:ef1fce0): the same. REPRODUCED.
  python3 3.15.2: REPRODUCED. main (3.16.0a1+dev): REPRODUCED.
promised_by: |
  Doc/library/statistics.rst, mean(): "Return the sample arithmetic mean of data"; the function accepts
  int subclasses and documents no ValueError.
cause: |
  Lib/statistics.py:1631-1636. `issubclass(T, int) and value.denominator != 1` handles non-whole
  values by switching to float; a whole value goes to `T(value)`, and only TypeError is caught.
possible_fix: |
  Catch ValueError around `T(value)` and fall back to the base numeric value, or skip the
  constructor for `int` subclasses whose constructor does not accept the value.
duplicates:
  issues:
    - {number: 64680, state: closed, relation: "same area: 'Clarify type coercion rules in statistics module' (2014), about mixed types", reason: "different bug"}
  queries: ["statistics mean IntEnum", "statistics IntEnum", "statistics.mean enum",
            "statistics mean int subclass _convert", "bugforge README: statistics entries, none on enums or int subclasses"]
lean:
  property: PyLean.CoreLibs.CalStat.MeanIntSubclass
  theorem: PyLean.CoreLibs.CalStat.meanIntSubclass_refuted
