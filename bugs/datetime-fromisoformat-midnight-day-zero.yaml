id: datetime-fromisoformat-midnight-day-zero
title: "datetime.fromisoformat() accepts day 00 and year 0000 when the time is 24:00"
priority: P3
kind: missing-validation
module: datetime
files: [Lib/_pydatetime.py, Modules/_datetimemodule.c]
functions: ["datetime.fromisoformat", "C datetime_fromisoformat"]
summary: |
  The 24:00 ("end of day") rollover in datetime.fromisoformat() moves the date forward
  one day before the date is validated, and the guard in front of it checks
  `1 <= month <= 12 and day <= days_in_month` but not `day >= 1` or the year range.
  So an invalid date becomes a valid one: '2020-01-00T24:00' parses as 2020-01-01 00:00,
  and '0000-12-31T24:00' (year 0) parses as 0001-01-01 00:00, while '2020-01-00',
  '2020-01-00T00:00' and '0000-12-31T00:00' all raise ValueError. Both the C and the
  pure-Python implementation behave this way, on 3.15.2 and on main.
likelihood: |
  Needs a malformed date combined with the rare 24:00 form, e.g. a producer that writes
  day 00 or year 0000 as a sentinel. The result is a plausible, silently wrong timestamp
  instead of the ValueError the same date gets with any other time.
maybe_intended: |
  Unlikely. The guard was written to avoid rolling over invalid dates (gh-151770 added the
  `month >= 1` half of it after a debug-build assertion); the missing `day >= 1` and year
  checks look like the same oversight. ISO 8601 allows 24:00 only as the end of an
  existing calendar day.
reproducer: |
  import datetime, _pydatetime
  def parse(mod, s):
      try:
          v = mod.datetime.fromisoformat(s)
          return (v.year, v.month, v.day, v.hour, v.minute)
      except ValueError as e:
          return 'ValueError: %s' % e
  for s in ['2020-01-00T24:00', '2020-01-00T00:00', '2020-01-00', '0000-12-31T24:00', '0000-12-31T00:00']:
      print(repr(s), 'C:', parse(datetime, s), ' Python:', parse(_pydatetime, s))
  if (parse(datetime, '2020-01-00T24:00') == parse(_pydatetime, '2020-01-00T24:00') == (2020, 1, 1, 0, 0)
          and parse(datetime, '0000-12-31T24:00') == (1, 1, 1, 0, 0)
          and str(parse(datetime, '2020-01-00T00:00')).startswith('ValueError')):
      print('REPRODUCED datetime-fromisoformat-midnight-day-zero')
expected: |
  ValueError for '2020-01-00T24:00' ("day 0 must be in range 1..31 for month 1 in year 2020")
  and for '0000-12-31T24:00' ("year must be in 1..9999, not 0"), as for the same dates with
  any other time.
promised_by: |
  datetime.fromisoformat docs: accepts valid ISO 8601 strings; 24:00 is accepted as the
  ISO 8601 notation for midnight at the end of a day (gh-102450). Day 00 and year 0000 are
  not valid dates for the datetime class (date.fromisoformat and datetime(...) reject them).
cause: |
  Lib/_pydatetime.py:1998-2010 (`# Only wrap day/month when it was previously valid` /
  `if 1 <= month <= 12 and day <= days_in_month`) and Modules/_datetimemodule.c:6154-6172
  (`if ((hour == 24) && (month >= 1 && month <= 12))` then `if (day <= d_in_month)`)
  increment the day before `check_date_args` / `_check_date_fields` run on the result. The
  comment states the intent (only wrap a valid date); the check is incomplete.
possible_fix: |
  Validate the parsed date before the rollover (or require `day >= 1` and
  MINYEAR <= year in the guard), so the 24:00 path is only taken for an existing date.
reproduces:
  python3 (3.15.2): REPRODUCED
  main (3.16.0a1+dev, vendor/cpython-main/python.exe): REPRODUCED
