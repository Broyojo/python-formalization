id: datetime-pydatetime-fromisoformat-int-leniency
title: "Pure-Python fromisoformat() parses fields with int(), accepting signs, spaces and non-ASCII digits"
priority: P4
kind: c-python-divergence
module: datetime
files: [Lib/_pydatetime.py]
functions: ["_parse_isoformat_date", "_parse_hh_mm_ss_ff", "date/time/datetime.fromisoformat"]
summary: |
  In 3.14.7, _parse_isoformat_date and _parse_hh_mm_ss_ff convert fixed-width slices with
  int(), which accepts a leading sign, surrounding white space, underscores between digits
  and any Unicode decimal digit, and they do not check the slice length. So
  _pydatetime.date.fromisoformat('2020-+1-01') == date(2020, 1, 1),
  '2021124' == date(2021, 12, 4), _pydatetime.time.fromisoformat(' 1:00') == time(1, 0),
  datetime.fromisoformat('٢020-01-01') succeeds (datetime and time do not check
  isascii()), and '12:00--1' gets a +01:00 offset. The C implementation rejects all of
  these. DUPLICATE of gh-152204 (closed as completed; fixed on main by gh-152205 with
  backports, after 3.14.7).
likelihood: Low; only for _pydatetime users (PyPy, or when the C module is unavailable).
maybe_intended: No (fixed upstream).
reproducer: |
  import datetime, _pydatetime
  def parse(f, s):
      try:
          return repr(f(s)).replace('_pydatetime.', 'datetime.')
      except ValueError:
          return 'ValueError'
  py = parse(_pydatetime.date.fromisoformat, '2020-+1-01')
  c = parse(datetime.date.fromisoformat, '2020-+1-01')
  print('Python:', py, ' C:', c)
  print('Python time(" 1:00"):', parse(_pydatetime.time.fromisoformat, ' 1:00'))
  if py == 'datetime.date(2020, 1, 1)' and c == 'ValueError':
      print('REPRODUCED datetime-pydatetime-fromisoformat-int-leniency')
expected: ValueError, as from the C implementation.
promised_by: C/Python twin agreement.
cause: Lib/_pydatetime.py:363-390 and :405-408 (`int(dtstr[...])` on unchecked slices).
possible_fix: Require exactly N ASCII digits per field (what main's `_read_isoformat_component` does).
reproduces:
  python3 (3.14.7): REPRODUCED
  main (3.16.0a1+dev, vendor/cpython-main/python.exe): NOT REPRODUCED (fixed by gh-152205)
