id: datetime-pydatetime-none-as-omitted
title: "_pydatetime treats an explicit None as an omitted argument in date.replace"
priority: P4
kind: twin-mismatch
module: datetime
files: [Lib/_pydatetime.py]
functions: ["date.replace"]
summary: |
  _pydatetime uses None as the "not given" default and tests `is None`, so an explicit None
  behaves like an omitted argument; C uses Argument Clinic defaults and treats None as an
  object to convert.
  `date(2020, 1, 1).replace(year=None)` returns date(2020, 1, 1) in Python and raises
  `TypeError: 'NoneType' object cannot be interpreted as an integer` in C (same for month
  and day). (The related pickle test `date(state, None)` is recorded separately, at P5, as
  datetime-date-pickle-test-month-none.)
likelihood: |
  replace(year=None) can come from code that forwards optional fields as None, which then
  works on PyPy and _pydatetime and fails on CPython.
maybe_intended: |
  The None defaults are an implementation device; the documented signature is
  replace(year=self.year, month=self.month, day=self.day) and the C module rejects None.
  gh-89979 is the related, open difference in which parameters are positional-only.
reproducer: |
  import datetime, _pydatetime
  def run(f):
      try:
          return repr(f())
      except TypeError:
          return 'TypeError'
  r = [run(lambda: m.date(2020, 1, 1).replace(year=None)) for m in (datetime, _pydatetime)]
  print('replace C/Python:', r)
  if r[0] == 'TypeError' and r[1].endswith('date(2020, 1, 1)'):
      print('REPRODUCED datetime-pydatetime-none-as-omitted')
expected: |
  The same outcome in both implementations: TypeError for replace(year=None), as in C.
promised_by: |
  PEP 399 equivalence of _pydatetime and _datetime; the documented replace signature has no
  None default.
cause: |
  Lib/_pydatetime.py:1186-1191: `if year is None: year = self._year` (and month, day).
  Modules/clinic/_datetimemodule.c.h:631-653: replace converts every given argument with
  PyLong_AsInt.
possible_fix: |
  Use a private sentinel instead of None for the omitted defaults of date.replace (and of
  time.replace and datetime.replace if they share the pattern), or accept the difference.
reproduces:
  python3 (3.15.2): REPRODUCED
  main (3.16.0a1+dev, vendor/cpython-main/python.exe): REPRODUCED
duplicates:
  issues:
    - {number: 89979, state: open, relation: related (other signature differences of the twins)}
  queries: ["gh api search: date+replace+None", "replace+year+None+pydatetime", "date.replace+None+year",
            "replace+year=None+datetime", "pydatetime+replace+None+TypeError", "_pydatetime+replace+None",
            "date.replace+None+keeps", "date+pickle+state+None+month", "date+constructor+bytes+state+None",
            "bugforge-results/README.md: datetime entries (none related)"]
lean:
  property: PyLean.Datetime.DateReplaceTwins
  theorem: PyLean.Datetime.dateReplaceTwins_refuted
