  queries: ["gh api search: datetime+repr+qualname", "timedelta+repr+qualname+subclass",
            "datetime+repr+__qualname__", "datetime+subclass+repr+tp_name", "repr+nested+subclass+datetime",
            "bugforge-results/README.md: datetime entries (none related)"]
