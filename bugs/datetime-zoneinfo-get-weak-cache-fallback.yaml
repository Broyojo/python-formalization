id: datetime-zoneinfo-get-weak-cache-fallback
title: "zoneinfo: a deleted or replaced Sub._weak_cache makes C Sub(key) raise (AttributeError, RuntimeError) where the pure-Python twin falls back or returns the stored object"
priority: P4
kind: twin-divergence
module: datetime
files: [Modules/_zoneinfo.c]
functions: ["C get_weak_cache", "C zoneinfo_ZoneInfo_impl", "C zoneinfo_ZoneInfo_clear_cache_impl", "ZoneInfo.__new__", "ZoneInfo.clear_cache"]
summary: |
  For a subclass, C `get_weak_cache` reads `PyObject_GetAttrString(type, "_weak_cache")`
  (Modules/_zoneinfo.c:299-301). The C base type keeps its weak cache in module state and has no
  `_weak_cache` attribute, so after `del Sub._weak_cache` the lookup fails and `Sub(key)` and
  `Sub.clear_cache()` raise `AttributeError` (:324-327, :512-515). In Python `cls._weak_cache`
  (Lib/zoneinfo/_zoneinfo.py:41-43, :97-102) finds the class attribute
  `ZoneInfo._weak_cache` through the MRO, so `Sub(key)` works and stores the subclass instance
  in the base class's cache, and `Sub.clear_cache()` clears the base class's weak cache.
  Same family: after `Sub._weak_cache = {'a': 1}`, C's `PyObject_TypeCheck` on the cached value
  (:352-358, added for gh-142781) raises `RuntimeError: Unexpected instance of int in Sub weak
  cache for key 'a'`, while Python's `__new__` (no such check) returns `1`.
likelihood: |
  Very low: deleting a private class attribute.
maybe_intended: |
  Probably acceptable: gh-146076 fixed the segfault on this path by making C raise. The Python
  twin's fallback (subclass instances in the base class's weak cache) is itself questionable.
reproducer: |
  import os, struct, tempfile, warnings
  warnings.simplefilter('ignore')
  from test.support import import_helper
  Cz = import_helper.import_fresh_module('zoneinfo')
  Pz = import_helper.import_fresh_module('zoneinfo', blocked=['_zoneinfo'])
  assert Cz.ZoneInfo is not Pz.ZoneInfo
  h = b'TZif2' + bytes(15) + struct.pack('>6l', 0, 0, 0, 0, 1, 4)
  blob = h + struct.pack('>lBB', 0, 0, 0) + b'UTC\x00'
  T = tempfile.mkdtemp()
  with open(os.path.join(T, 'a'), 'wb') as f:
      f.write(blob + blob + b'\nUTC0\n')
  out = []
  for M in (Cz, Pz):
      M.reset_tzpath([T])
      class Sub(M.ZoneInfo):
          pass
      del Sub._weak_cache
      try:
          out.append(type(Sub('a')).__name__)
      except AttributeError:
          out.append('AttributeError')
      class Sub2(M.ZoneInfo):
          pass
      Sub2._weak_cache = {'a': 1}
      try:
          out.append(repr(Sub2('a')))
      except RuntimeError:
          out.append('RuntimeError')
      M.ZoneInfo.clear_cache()
  print('C', out[:2], 'Py', out[2:])
  if out == ['AttributeError', 'RuntimeError', 'Sub', '1']:
      print('REPRODUCED datetime-zoneinfo-get-weak-cache-fallback')
expected: |
  The twins agree (both raise, or both fall back).
observed: |
  python3 3.15.2: del: C AttributeError, Py Sub; replaced: C RuntimeError, Py 1. REPRODUCED.
promised_by: |
  C/Python twins.
cause: |
  Modules/_zoneinfo.c:292-302: the base class's weak cache is module state, not a class
  attribute, so attribute lookup from a subclass has nothing to fall back to.
possible_fix: |
  None needed beyond documenting; or have get_weak_cache fall back to the module-state cache
  when the subclass has none, as the Python twin's MRO lookup does.
reproduces:
  python3 (3.15.2): REPRODUCED (scripts/check_bugs.py)
  main (vendor/cpython-main/python.exe): REPRODUCED (3.16.0a1+dev)
