id: datetime-zoneinfo-init-subclass
title: "zoneinfo: C ZoneInfo.__init_subclass__ silently accepts class keywords and imports weakref anew; the pure-Python twin rejects keywords and uses its bound weakref"
priority: P4
kind: twin-divergence
module: datetime
files: [Modules/_zoneinfo.c]
functions: ["C zoneinfo_init_subclass", "C new_weak_cache", "ZoneInfo.__init_subclass__"]
summary: |
  C registers `__init_subclass__` as `METH_VARARGS | METH_KEYWORDS | METH_CLASS`
  (Modules/_zoneinfo.c:2654-2656) and `zoneinfo_init_subclass` (:2622-2637) ignores its
  arguments, so `class S(ZoneInfo, foo=1): pass` is accepted and `foo` is silently dropped.
  Python's `def __init_subclass__(cls)` (Lib/zoneinfo/_zoneinfo.py:36-38) takes no keywords,
  so the same class statement raises `TypeError: ZoneInfo.__init_subclass__() got an
  unexpected keyword argument 'foo'`; `object.__init_subclass__` would raise too.
  Second difference in the same function: C's `new_weak_cache` (:2592-2603) imports `weakref`
  at each subclass creation (`PyImport_ImportModuleAttrString`, through `sys.modules`), while
  Python uses the `weakref` module it bound at import. With `sys.modules["weakref"]` replaced by
  a module lacking `WeakValueDictionary`, subclassing raises `AttributeError` in C only.
likelihood: |
  Very low. The keyword case needs a class statement passing keywords to ZoneInfo (a typo, or a
  cooperative `__init_subclass__` hierarchy where a mixin after ZoneInfo expects them: C swallows
  them instead of raising). The sys.modules case needs deliberate module replacement.
maybe_intended: |
  Keywords: probably not; C does not call `super().__init_subclass__(**kwargs)` either, and the
  Python twin rejects them. Import at call time: a side effect of module isolation (no static
  reference to weakref), harmless in practice.
reproducer: |
  import sys, types, warnings
  warnings.simplefilter('ignore')
  from test.support import import_helper
  Cz = import_helper.import_fresh_module('zoneinfo')
  Pz = import_helper.import_fresh_module('zoneinfo', blocked=['_zoneinfo'])
  assert Cz.ZoneInfo is not Pz.ZoneInfo
  def kw(M):
      class S(M.ZoneInfo, foo=1):
          pass
      return 'accepted'
  def swapped(M):
      saved = sys.modules['weakref']
      sys.modules['weakref'] = types.ModuleType('weakref')
      try:
          class S(M.ZoneInfo):
              pass
          return 'accepted'
      finally:
          sys.modules['weakref'] = saved
  out = []
  for f in (kw, swapped):
      for M in (Cz, Pz):
          try:
              out.append(f(M))
          except Exception as e:
              out.append(type(e).__name__)
  print(out)
  if out == ['accepted', 'TypeError', 'AttributeError', 'accepted']:
      print('REPRODUCED datetime-zoneinfo-init-subclass')
expected: |
  The twins agree on both class statements.
observed: |
  python3 3.15.2: keywords C accepted / Py TypeError; swapped weakref C AttributeError / Py
  accepted. REPRODUCED.
promised_by: |
  C/Python twins; the data model (`__init_subclass__` receives the class keywords and the
  default implementation rejects unknown ones).
cause: |
  Modules/_zoneinfo.c:2654-2656 (METH_VARARGS | METH_KEYWORDS, arguments unused at :2623-2637);
  :2595-2596 `PyImport_ImportModuleAttrString("weakref", "WeakValueDictionary")` at call time.
possible_fix: |
  Register `__init_subclass__` as METH_NOARGS | METH_CLASS (or forward the keywords to
  `super().__init_subclass__`), matching the Python twin.
reproduces:
  python3 (3.15.2): REPRODUCED (scripts/check_bugs.py)
  main (vendor/cpython-main/python.exe): REPRODUCED (3.16.0a1+dev)
