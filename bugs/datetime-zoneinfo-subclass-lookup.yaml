id: datetime-zoneinfo-subclass-lookup
title: "zoneinfo: for datetime subclasses C narrows toordinal() to int, so utcoffset()/fromutc() pick a different offset than the pure-Python twin"
priority: P4
kind: twin-divergence
module: datetime
files: [Modules/_zoneinfo.c]
functions: ["C get_local_timestamp", "C find_ttinfo", "C zoneinfo_fromutc", "ZoneInfo._get_local_timestamp", "ZoneInfo._find_trans", "ZoneInfo.fromutc"]
summary: |
  For an exact datetime, C `get_local_timestamp` (Modules/_zoneinfo.c:2291-2298) reads the struct
  fields. For a subclass it calls `toordinal()` and the `hour`/`minute`/`second` attributes
  (:2300-2341), as Python's `_get_local_timestamp` does (Lib/zoneinfo/_zoneinfo.py:189-195), but
  stores `PyLong_AsLong(num)` in `int ord` (:2290, :2307): a `long` result outside `int` is
  silently truncated. A subclass whose `toordinal()` returns its ordinal plus 2**32 gets the
  2021-01-01 timestamp in C and one about 2**32 days later in Python. With a single transition at
  2**40 s (from +00:00 to +07:00), C answers +00:00 and Python +07:00, for `utcoffset()`, `dst()`,
  `tzname()` and `fromutc()`. `hour`, `minute` and `second` are narrowed the same way.
likelihood: |
  Very low: it needs a datetime subclass that overrides toordinal() (or hour/minute/second) to
  return values outside C int. It is a silent wraparound, not a crash.
maybe_intended: |
  Partly: calling the methods for subclasses is deliberate (it matches the Python twin), but the
  narrowing is not; `ord` is declared `int` while PyLong_AsLong returns long, with no range check.
reproducer: |
  import io, struct, datetime as dt, warnings
  warnings.simplefilter('ignore')
  from test.support import import_helper
  Cz = import_helper.import_fresh_module('zoneinfo')
  Pz = import_helper.import_fresh_module('zoneinfo', blocked=['_zoneinfo'])
  assert Cz.ZoneInfo is not Pz.ZoneInfo
  def tzif(trans, idx, types, abbr, footer=b''):
      v1 = b'TZif2' + bytes(15) + struct.pack('>6l', 0, 0, 0, 0, 0, 0)
      h = b'TZif2' + bytes(15) + struct.pack('>6l', 0, 0, 0, len(trans), len(types), len(abbr))
      body = b''.join(struct.pack('>q', t) for t in trans) + bytes(idx)
      body += b''.join(struct.pack('>lBB', *t) for t in types) + abbr
      return v1 + h + body + b'\n' + footer + b'\n'
  data = tzif([2**40], [1], [(0, 0, 0), (25200, 0, 4)], b'AAA\x00BBB\x00')
  class Big(dt.datetime):
      def toordinal(self):
          return super().toordinal() + 2**32
  out = []
  for Z in (Cz.ZoneInfo, Pz.ZoneInfo):
      z = Z.from_file(io.BytesIO(data), key='k')
      d = Big(2021, 1, 1, tzinfo=z)
      out.append((z.utcoffset(d), z.fromutc(d).replace(tzinfo=None) - dt.datetime(2021, 1, 1)))
  print('C', out[0], 'Py', out[1])
  if out[0] == (dt.timedelta(0), dt.timedelta(0)) and out[1] == (dt.timedelta(hours=7), dt.timedelta(hours=7)):
      print('REPRODUCED datetime-zoneinfo-subclass-lookup')
expected: |
  The twins agree: either both use the subclass's toordinal() as a Python int (+07:00), or C
  raises OverflowError for a value outside int.
observed: |
  python3 3.15.2: C (0:00:00, 0:00:00), Py (7:00:00, 7:00:00). REPRODUCED.
promised_by: |
  C/Python twins; no silent wraparound (the Lessons in AGENTS.md: missing range checks after
  PyLong_As* conversions).
cause: |
  Modules/_zoneinfo.c:2290 declares `int ord`, :2307 assigns `PyLong_AsLong(num)` (a long) to it;
  the same for hour/minute/second at :2289, :2317, :2327, :2337. :2344 then widens the truncated
  value to int64_t.
possible_fix: |
  Declare the locals `long` (or use PyLong_AsInt, which raises OverflowError outside int).
reproduces:
  python3 (3.15.2): REPRODUCED (scripts/check_bugs.py)
  main (vendor/cpython-main/python.exe): REPRODUCED (3.16.0a1+dev)
