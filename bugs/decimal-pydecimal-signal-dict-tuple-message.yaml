id: decimal-pydecimal-signal-dict-tuple-message
title: "_pydecimal formats a tuple operand with '%s' % x in its TypeError messages, so Context().plus(()) and Context().traps = () report a format-string error"
priority: P4
kind: wrong-message
module: decimal
files: [Lib/_pydecimal.py]
functions: ["_convert_other", "Context._set_signal_dict", "Context.__setattr__", "Context.add", "Context.subtract",
            "Context.multiply", "Context.divide", "Context.divide_int", "Context.divmod", "Context.remainder"]
summary: |
  Three error messages in _pydecimal format the offending object with a bare `%`:
      _convert_other:      raise TypeError("Unable to convert %s to Decimal" % other)   (:6111)
      Context.add & co.:   raise TypeError("Unable to convert %s to Decimal" % b)       (:4248, ...)
      _set_signal_dict:    raise TypeError("%s must be a signal dict" % d)              (:4021)
  When the object is a tuple, `%` takes it as its argument tuple, so the intended message is
  replaced by a formatting error, or by the wrong text:
      _pydecimal.Context().plus(())                -> TypeError: not enough arguments for format string (got 0)
      _pydecimal.Context().compare_total(1, (1, 2)) -> TypeError: not all arguments converted during string formatting (required 1, got 2)
      _pydecimal.Decimal(1).compare_total(())      -> TypeError: not enough arguments for format string (got 0)
      _pydecimal.Context().traps = ()              -> TypeError: not enough arguments for format string (got 0)
      _pydecimal.Context().traps = (1,)            -> TypeError: 1 must be a signal dict
      _pydecimal.Context().traps = [1]             -> TypeError: [1] must be a signal dict
      _decimal.Context().plus(())                  -> TypeError: conversion from tuple to Decimal is not supported
      _decimal.Context().traps = ()                -> TypeError: argument must be a signal dict
  The exception class is right (TypeError) in every case; only the message is wrong. Every
  Context method that converts an operand with raiseit=True, and every Decimal method that does
  (compare_total, quantize, fma, rotate, ...), is affected.
likelihood: |
  Low. It needs a tuple where a number or a dict is expected, a plausible mistake (Decimal accepts
  a tuple in its constructor, so passing `d.as_tuple()` to a method is an easy slip), and only the
  error text suffers.
maybe_intended: |
  No: for every other type the same lines produce the intended text. It is the classic
  `"%s" % tuple` pitfall. A maintainer may still consider it too small to fix on its own; it
  should go upstream only together with other _pydecimal findings.
reproducer: |
  import _pydecimal as P
  msgs = []
  try:
      P.Context().plus(())
  except TypeError as e:
      msgs.append(str(e))
  c = P.Context()
  try:
      c.traps = ()
  except TypeError as e:
      msgs.append(str(e))
  print('messages:', msgs)
  if len(msgs) == 2 and 'Unable to convert' not in msgs[0] and 'signal dict' not in msgs[1]:
      print('REPRODUCED decimal-pydecimal-signal-dict-tuple-message')
expected: |
  TypeError: Unable to convert () to Decimal, and TypeError: () must be a signal dict (or, as in
  _decimal, "conversion from tuple to Decimal is not supported" and "argument must be a signal dict").
promised_by: |
  The messages the source writes (Lib/_pydecimal.py:4021, :4248, :6111); twin agreement with
  _decimal's messages (Modules/_decimal/_decimal.c convert_op_raise, dict_as_flags).
cause: |
  Lib/_pydecimal.py:6111 `raise TypeError("Unable to convert %s to Decimal" % other)`, the same
  `% b` in Context.add (:4248) and the other Context arithmetic methods, and :4021
  `raise TypeError("%s must be a signal dict" % d)`: a tuple is the argument tuple of `%`. The
  KeyErrors at :4024 and :4027 format a dict, which is safe. Same code on main at the same lines.
possible_fix: |
  Wrap the object: `"... %s ..." % (other,)`, or use f-strings, at the three kinds of site.
tested:
  python3 3.15.2: REPRODUCED
  main (vendor/cpython-main/python.exe, 3.16.0a1+dev): REPRODUCED
duplicates:
  issues: []
  queries: ["_set_signal_dict", "pydecimal signal dict TypeError tuple", "decimal traps tuple format string",
            "must be a signal dict", "pydecimal not enough arguments for format string",
            "Unable to convert to Decimal tuple", "_convert_other tuple", "pydecimal TypeError message tuple"]
  bugforge: "no _set_signal_dict or _convert_other entries in vendor/bugforge-results/README.md"
