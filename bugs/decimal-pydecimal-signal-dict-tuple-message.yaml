id: decimal-pydecimal-signal-dict-tuple-message
title: "_pydecimal formats a tuple operand with '%s' % x in its TypeError messages, so Context().plus(()), Context().traps = (), Context().rounding = () and Decimal.from_number(()) report a format-string error"
priority: P4
kind: wrong-message
module: decimal
files: [Lib/_pydecimal.py]
functions: ["_convert_other", "Context._set_signal_dict", "Context.__setattr__", "Context.add", "Context.subtract",
            "Context.multiply", "Context.divide", "Context.divide_int", "Context.divmod", "Context.remainder",
            "Decimal.from_number"]
summary: |
  Five error messages in _pydecimal format the offending object with a bare `%`:
      _convert_other:      raise TypeError("Unable to convert %s to Decimal" % other)   (:6112)
      Context.add & co.:   raise TypeError("Unable to convert %s to Decimal" % b)       (:4248, :4474,
                           :4497, :4518, :5054, :5300, :5404, :5595)
      _set_signal_dict:    raise TypeError("%s must be a signal dict" % d)              (:4021)
      Context.__setattr__: raise TypeError("%s: invalid rounding mode" % value)         (:4045)
      Decimal.from_number: raise TypeError("Cannot convert %r to Decimal" % number)     (:715)
  When the object is a tuple, `%` takes it as its argument tuple, so the intended message is
  replaced by a formatting error, or by the wrong text:
      _pydecimal.Context().plus(())                -> TypeError: not enough arguments for format string (got 0)
      _pydecimal.Context().compare_total(1, (1, 2)) -> TypeError: not all arguments converted during string formatting (required 1, got 2)
      _pydecimal.Decimal(1).compare_total(())      -> TypeError: not enough arguments for format string (got 0)
      _pydecimal.Context().traps = ()              -> TypeError: not enough arguments for format string (got 0)
      _pydecimal.Context().traps = (1,)            -> TypeError: 1 must be a signal dict
      _pydecimal.Context().traps = [1]             -> TypeError: [1] must be a signal dict
      _pydecimal.Context().rounding = ()           -> TypeError: not enough arguments for format string (got 0)
      _pydecimal.Context().rounding = (1, 2)       -> TypeError: not all arguments converted during string formatting (required 1, got 2)
      _pydecimal.Context().rounding = (1,)         -> TypeError: 1: invalid rounding mode
      _pydecimal.Decimal.from_number(())           -> TypeError: not enough arguments for format string (got 0)
      _decimal.Context().plus(())                  -> TypeError: conversion from tuple to Decimal is not supported
      _decimal.Context().traps = ()                -> TypeError: argument must be a signal dict
      _decimal.Context().rounding = ()             -> TypeError: valid values for rounding are: [ROUND_CEILING, ...]
      _decimal.Decimal.from_number(())             -> TypeError: conversion from tuple to Decimal is not supported
  The exception class is right (TypeError) in every case; only the message is wrong. Every
  Context method that converts an operand with raiseit=True, and every Decimal method that does
  (compare_total, quantize, fma, rotate, ...), is affected, as are the rounding attribute (also
  through Context(rounding=()) and localcontext(rounding=())) and Decimal.from_number.
likelihood: |
  Low. It needs a tuple where a number or a dict is expected, a plausible mistake (Decimal accepts
  a tuple in its constructor, so passing `d.as_tuple()` to a method is an easy slip), and only the
  error text suffers.
maybe_intended: |
  No: for every other type the same lines produce the intended text. It is the classic
  `"%s" % tuple` pitfall. A maintainer may still consider it too small to fix on its own; it
  should go upstream only together with other _pydecimal findings.
reproducer: |
  import _pydecimal as P
  msgs = []
  try:
      P.Context().plus(())
  except TypeError as e:
      msgs.append(str(e))
  c = P.Context()
  try:
      c.traps = ()
  except TypeError as e:
      msgs.append(str(e))
  try:
      c.rounding = ()
  except TypeError as e:
      msgs.append(str(e))
  try:
      P.Decimal.from_number(())
  except TypeError as e:
      msgs.append(str(e))
  print('messages:', msgs)
  if (len(msgs) == 4 and 'Unable to convert' not in msgs[0] and 'signal dict' not in msgs[1]
          and 'invalid rounding mode' not in msgs[2] and 'Cannot convert' not in msgs[3]):
      print('REPRODUCED decimal-pydecimal-signal-dict-tuple-message')
expected: |
  TypeError: Unable to convert () to Decimal, TypeError: () must be a signal dict, TypeError: ():
  invalid rounding mode and TypeError: Cannot convert () to Decimal (or, as in _decimal,
  "conversion from tuple to Decimal is not supported", "argument must be a signal dict" and
  "valid values for rounding are ...").
promised_by: |
  The messages the source writes (Lib/_pydecimal.py:715, :4021, :4045, :4248, :6112); twin
  agreement with _decimal's messages (Modules/_decimal/_decimal.c convert_op_raise, dict_as_flags,
  getround).
cause: |
  Lib/_pydecimal.py:6112 `raise TypeError("Unable to convert %s to Decimal" % other)`, the same
  `% b` in Context.add (:4248) and the other Context arithmetic methods (:4474, :4497, :4518,
  :5054, :5300, :5404, :5595), :4021 `raise TypeError("%s must be a signal dict" % d)`, :4045
  `raise TypeError("%s: invalid rounding mode" % value)` and :715
  `raise TypeError("Cannot convert %r to Decimal" % number)`: a tuple is the argument tuple of `%`.
  The KeyErrors at :4024 and :4027 format a dict, which is safe. Same code on main (:715, :4021,
  :4045; _convert_other's raise is at :6127 there).
possible_fix: |
  Wrap the object: `"... %s ..." % (other,)`, or use f-strings, at the five kinds of site.
tested:
  python3 3.15.2: REPRODUCED
  main (vendor/cpython-main/python.exe, 3.16.0a1+dev): REPRODUCED
