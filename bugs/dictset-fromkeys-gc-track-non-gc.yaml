            "bugforge README: no fromkeys entry"]
  note: |
    `gh search issues --repo python/cpython` with unquoted words, sorted by update; the plain
    "fromkeys" query returns unrelated issues (153229 fast-clone, 158254 reverse iterators), none
    about tracking a non-dict. Related to, but distinct from, dictset-fromkeys-frozendict-rewritten
    (same function, same gh-151722 change, different defect: that one fills a leaked frozendict, this
    one GC-tracks a non-GC object).
