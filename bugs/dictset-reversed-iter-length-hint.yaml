id: dictset-reversed-iter-length-hint
title: "reversed(dict) has no 'keys changed' check, so __length_hint__ wraps to 2**64-1 and list(it) raises OverflowError (duplicate of gh-158254, fixed on main)"
priority: P4
kind: missing-check
module: dictset
files: [Objects/dictobject.c]
functions: ["dictreviter_iter_lock_held", "dictreviter_iternext", "dictiter_len", "dictiter_new"]
summary: |
  ALREADY KNOWN: this is gh-158254, closed and fixed on main; 3.14.7 does not have the fix. It is
  recorded because the Lean model of 3.14.7 refutes the property, and a refutation needs a record.

  A forward dict iterator raises "dictionary keys changed during iteration" when it finds an item
  with di->len == 0. The reverse iterator has no such check, so if the table is compacted between
  steps at the same size it can yield more items than it started with. di->len goes negative and
  dictiter_len passes it to PyLong_FromSize_t.
likelihood: |
  Low. It needs a deletion before iterating, then a delete and insert during reverse iteration
  that force a resize.
maybe_intended: |
  No: fixed upstream.
reproducer: |
  d = {i: i for i in range(5)}
  del d[1]
  r = reversed(d)
  next(r)
  del d[4]
  d['x'] = 1
  seen = []
  try:
      for _ in range(4):
          seen.append(next(r))
      hint = r.__length_hint__()
  except RuntimeError as e:
      print('RuntimeError', e)
      hint = None
  print(seen, hint)
  if hint == 2 ** 64 - 1:
      try:
          list(r)
      except OverflowError as e:
          print('OverflowError', e)
          print('REPRODUCED dictset-reversed-iter-length-hint')
expected: |
  RuntimeError: dictionary keys changed during iteration, as the forward iterator does.
observed: |
  python3 3.14.7: __length_hint__() -> 18446744073709551615, list(r) -> OverflowError.
  main: RuntimeError: dictionary keys changed during iteration. NOT REPRODUCED, as expected.
promised_by: |
  Internal consistency with dictiter_iternextkey_lock_held (:5278-5283), and __length_hint__ being
  a non-negative estimate.
cause: |
  Objects/dictobject.c:5831-5832 (3.14.7) decrements di->len with no test; :5279 is the forward
  check. :5198-5200 `PyLong_FromSize_t(len)` wraps a negative Py_ssize_t.
possible_fix: |
  Done on main: the same `if (di->len == 0)` check in dictreviter_iter_lock_held. Whether it
  should be backported to 3.14 is the only open question.
duplicates:
  issues:
    - {number: 158254, state: closed, relation: "DUPLICATE: same bug, same OverflowError, fixed on main"}
    - {number: 154709, state: closed, relation: "reversed(dict) out-of-bounds read, same function, a different defect"}
  queries: ["reversed dict iterator keys changed", "length_hint dict iterator"]
lean:
  property: PyLean.DictSet.RevIterLenNonneg
  theorem: PyLean.DictSet.revIterLenNonneg_refuted
