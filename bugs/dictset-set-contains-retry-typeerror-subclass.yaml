id: dictset-set-contains-retry-typeerror-subclass
title: "NOT FOR FILING: `in` retries a set key's failed hash for a TypeError subclass too, while set_unhashable_type tests the exact type"
priority: P5
kind: documented-limitation
module: dictset
files: [Objects/setobject.c]
functions: ["_PySet_Contains", "frozenset___contains___impl", "set_unhashable_type"]
summary: |
  This records why the withdrawn claim SetContainsRetryExact (the third conjunct of the old
  set-contains-retry: "a failed hash that is not exactly TypeError is never retried") is false; it
  is not a defect report. _PySet_Contains and frozenset.__contains__ retry a failed hash of a set key
  when PyErr_ExceptionMatches(PyExc_TypeError) holds (:2551, :2611), which matches subclasses, and
  then look the key up by the hash of the equal frozenset. So for `class TE(TypeError)` and a set
  subclass SS whose __hash__ raises TE, `SS([1]) in {frozenset([1])}` and
  `frozenset([frozenset([1])]).__contains__(SS([1]))` are True. set_unhashable_type, by contrast,
  rewrites only an exception whose type is exactly TypeError (Py_IS_TYPE, :350), so `{1}.add(SS([1]))`
  raises TE("te") unchanged. Both tests are deliberate and consistent with how `except TypeError` and
  the error-message rewriting are meant to work.
likelihood: |
  Not applicable.
maybe_intended: |
  Yes.
reproducer: |
  class TE(TypeError):
      pass
  class SS(set):
      def __hash__(self):
          raise TE("te")
  x = SS([1])
  a = x in {frozenset([1])}
  b = frozenset([frozenset([1])]).__contains__(x)
  try:
      {1}.add(x)
      c = None
  except TypeError as e:
      c = (type(e).__name__, str(e))
  print(a, b, c)
  if a and b and c == ("TE", "te"):
      print('REPRODUCED dictset-set-contains-retry-typeerror-subclass')
expected: |
  What is observed.
observed: |
  python3 3.15.2: True True ('TE', 'te'). REPRODUCED.
  main (python.exe 3.16.0a1+dev ef1fce0): the same. REPRODUCED.
promised_by: |
  Nothing; the withdrawn model claim retried only an exact TypeError.
cause: |
  Objects/setobject.c:2551 and :2611 use PyErr_ExceptionMatches (a subclass test); :350 uses
  Py_IS_TYPE (an exact test).
possible_fix: |
  None needed.
duplicates:
  issues: []
  queries: ["not searched: not a defect"]
