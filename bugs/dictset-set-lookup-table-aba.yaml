lean:
  property: PyLean.DictSet.SetLookupRestartsOnResize
  theorem: PyLean.DictSet.setLookupRestartsOnResize_refuted
  also: "PyLean.DictSet.SetProbeFailureUnguarded / setProbeFailureUnguarded_refuted and SetAddRestartsOnResize / setAddRestartsOnResize_refuted; witness PyLean.DictSet.aba_probe, in the reproducer's sizes (1024-slot table, e at entry 700, refilled to 128 slots at the same address). The allocator is an oracle (SetBody.reuse) that can hand back a freed block with its bytes; an entry past the end of the table reads those stale bytes (SetObj.mem), so the re-check passes, the discard writes past the end and drops used to 39 for 40 keys (the reference whose Py_DECREF frees e), and the add stores past the end with used 41 for 40 keys."
