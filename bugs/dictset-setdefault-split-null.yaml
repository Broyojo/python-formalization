id: dictset-setdefault-split-null
title: "dict.setdefault segfaults on an instance __dict__ when a str-subclass key names a shared key this instance has no value for"
priority: P1
kind: null-dereference
module: dictset
files: [Objects/dictobject.c]
functions: ["dict_setdefault_ref_lock_held", "dict_setdefault_impl", "PyDict_SetDefaultRef", "PyDict_SetDefault", "merge_from_seq2_lock_held"]
summary: |
  Plain Python crashes the interpreter with SIGSEGV. An instance __dict__ is a split table: its
  keys are shared by every instance of the class, so a key can be present in the shared keys
  with no value in this dict. _Py_dict_lookup then returns ix >= 0 with *value_addr == NULL.
  Every other caller allows for that (`ix == DKIX_EMPTY || value == NULL`). The generic branch
  of dict_setdefault_ref_lock_held does not: it tests `ix == DKIX_EMPTY` only, falls through
  with value == NULL, and `Py_NewRef(value)` dereferences NULL.

  The exact-str path is safe because it takes the insert_split_key branch; only a key that is
  not an exact str reaches the generic lookup, so the trigger is a str subclass, such as an
  enum.StrEnum member, equal to a key some other instance set.
likelihood: |
  Low to moderate. Nothing about it is exotic: enum.StrEnum members hash and compare like their
  str value, so vars(obj).setdefault(E.FOO, 5) crashes when another instance of the class has set
  obj's attribute `foo` and this one has not. This was run, not inferred. It needs no reentrancy,
  threads or ctypes. It does need setdefault on an instance __dict__, with a non-exact-str key
  naming an attribute that this instance lacks.
maybe_intended: |
  No. `assert(value != NULL)` at :4865 states the opposite of what happens, and it is compiled
  out of release builds. A debug build should abort there instead.
reproducer: |
  import resource, subprocess, sys
  code = r"""
  import resource
  resource.setrlimit(resource.RLIMIT_CORE, (0, 0))
  class C:
      pass
  a = C()
  a.x = 1            # 'x' is now in the shared keys
  b = C()
  b.y = 2
  d = b.__dict__     # split table; 'x' has no value here
  class S(str):
      pass
  print('get', d.get(S('x'), 'default'), flush=True)
  print('setdefault', d.setdefault(S('x'), 5), flush=True)
  """
  r = subprocess.run([sys.executable, '-I', '-c', code], capture_output=True, text=True)
  print(r.stdout, 'returncode', r.returncode)
  if r.returncode == -11 and 'setdefault' not in r.stdout:
      print('REPRODUCED dictset-setdefault-split-null')
expected: |
  d.setdefault(S('x'), 5) returns 5 and d gains the key, as for any key that dict.get reports
  absent.
observed: |
  python3 3.15.2: `d.get(S('x'), 'default')` -> 'default', then SIGSEGV in setdefault, exit -11.
  REPRODUCED.
  main (3.16.0a1+dev, ef1fce0): identical. REPRODUCED by check_bugs.py.

  Audit of the other entry points, rerun on 3.15.2 and main. 47 operations on such a dict, each in
  a forked child, with a plain str subclass and with one that overrides __eq__: the mapping methods,
  update in all its forms, |, |=, ==, the keys and items views and their set operations, getattr,
  setattr, delattr, and the constructors of dict, OrderedDict, defaultdict and Counter. setdefault
  is the only one that crashes, so the defect is this one branch. It is not tied to a live instance:
  d.copy() of the split dict gives a plain dict that crashes the same way, and it survives
  d.clear(), and a pop or delete of other keys, before the call.
promised_by: |
  Doc/library/stdtypes.rst, dict.setdefault: "If key is in the dictionary, return its value.
  If not, insert key with a value of default and return default." Invariant: no crash.
cause: |
  Objects/dictobject.c:4817-4841: the split branch is taken only for exact str keys;
  otherwise :4834 calls _Py_dict_lookup, which on a split table sets
  *value_addr = mp->ma_values->values[ix] (:1367), possibly NULL.
  :4843 `if (ix == DKIX_EMPTY)` misses that case, and :4865-4869 runs
  `*result = incref_result ? Py_NewRef(value) : value`. Compare :2961, :3002, :3256, :3765,
  :4765, which all test `ix == DKIX_EMPTY || value == NULL`. With incref_result == 0
  (PyDict_SetDefault) NULL is returned with no exception, and merge_from_seq2_lock_held
  (override == 0) silently drops the pair.
possible_fix: |
  Treat a NULL value as absent: `if (ix == DKIX_EMPTY || value == NULL)` at :4843.
  insert_combined_dict already converts a split table when the key is not an exact str, so the
  insertion that follows is correct (insertdict relies on this at :2025-2035).
duplicates:
  issues:
    - {number: 143189, state: closed, relation: "nearby, not this bug: assertion in insertdict with a str subclass on a split table, under threads"}
  queries: ["setdefault segfault", "setdefault split dict", "split table NULL value setdefault",
            "dict str subclass split table crash", "PRs: dict_setdefault_ref_lock_held",
            "bugforge README: no dict.setdefault entry"]
  note: |
    `gh search issues "two words"` searches an exact phrase and silently returns nothing; every
    query above was run as separate terms.
lean:
  property: PyLean.DictSet.SetdefaultNoCrash
  theorem: PyLean.DictSet.setdefaultNoCrash_refuted
