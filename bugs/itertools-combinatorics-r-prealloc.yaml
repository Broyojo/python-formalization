    - {number: 81852, state: closed, relation: "combinations consumes its input eagerly", reason: "rejected; different"}
    - {number: 49066, state: closed, relation: "made r > n return an empty iterator instead of ValueError", reason: "the empty result is the deliberate design; allocation not discussed"}
    - {number: 67553, state: closed, relation: "integer overflow in product", reason: "fixed; same overflow-check family"}
  queries: ["combinations MemoryError",
            "combinations large r",
            "permutations MemoryError",
            "permutations large r",
            "combinations_with_replacement MemoryError",
            "combinations r greater n",
