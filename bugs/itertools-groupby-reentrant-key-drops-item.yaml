  note: |
    Not the same as itertools-groupby-eq-reentry-null-currkey: that one is the comparison
    (__eq__) re-entering groupby_next and a NULL dereference; this one is the key function or
    input re-entering groupby_step from _grouper_next, and nothing crashes. A guard against
    re-entry would fix both.
