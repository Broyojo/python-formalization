id: itertools-islice-step-overflow
title: "itertools.islice with stop=None yields an extra item when start + step overflows Py_ssize_t"
priority: P3
kind: silent-wrong-result
module: itertools
files: [Modules/itertoolsmodule.c]
functions: ["islice_next"]
summary: |
  islice_next computes the index of the next item to return with
  `lz->next += (size_t)lz->step` and handles overflow with
  `if (lz->next < oldnext || (stop != -1 && lz->next > stop)) lz->next = stop;`.
  When stop is None, `stop` is the sentinel -1, so an overflow sets `lz->next = -1`. The next
  call then skips nothing (`cnt < -1` is false), does not check a stop, and returns the very
  next input item; `next` then becomes `-1 + step` and the iterator resumes skipping. So
  islice(range(10), 1, None, sys.maxsize) yields [1, 2] instead of [1], and
  islice(range(10), 5, None, sys.maxsize - 2) yields [5, 6] instead of [5]. Every argument is
  inside the documented range 0 <= x <= sys.maxsize, no error is raised, and the result is
  silently wrong. With an int stop the same overflow is harmless (next is set to stop), and
  range(10)[1::sys.maxsize] / the documented pure-Python equivalent give [1].
  Lean: the C model and the doc equivalent agree on items, consumption and when they raise for
  every Py_ssize_t start/stop/step with stop given, or with len + step <= sys.maxsize + 1
  (itertools-islice-doc-agree-nowrap, proven); itertools-islice-doc-agree-ssize, without that
  hypothesis, is refuted by this reproducer.
likelihood: |
  Low. It needs start >= 1 and start + step > sys.maxsize, i.e. a step within `start` of
  sys.maxsize, together with stop=None. A step of sys.maxsize is a natural way to say "take
  only the item at index start" (e.g. computing a step from a size bound, or code written
  generically as islice(it, k, None, huge)), but most people write islice(it, k, k + 1).
  When it does happen the result is silently wrong (one extra item), not an exception.
maybe_intended: |
  No. The (size_t) cast and the `lz->next < oldnext` test were added precisely to handle this
  overflow (comment at :1724-1725: "avoids the danger of undefined behaviour from signed
  integer overflow"); the handling is only wrong for the stop=None sentinel. The documented
  equivalent (rst:478-496) and sequence slicing both give one item.
reproducer: |
  import sys
  from itertools import islice
  M = sys.maxsize
  r1 = list(islice(range(10), 1, None, M))
  r2 = list(islice(range(10), 5, None, M - 2))
  r3 = list(islice(range(10), 1, 10, M))
  print('islice(range(10), 1, None, sys.maxsize)     ->', r1, '; range(10)[1::sys.maxsize] =', list(range(10))[1::M])
  print('islice(range(10), 5, None, sys.maxsize - 2) ->', r2, '; range(10)[5::sys.maxsize-2] =', list(range(10))[5::M - 2])
  print('islice(range(10), 1, 10, sys.maxsize)       ->', r3, '(an int stop is fine)')
  if r1 == [1, 2] and r2 == [5, 6] and r3 == [1]:
      print('REPRODUCED itertools-islice-step-overflow')
expected: |
  [1] and [5] (the item at index start only; start + step is past any possible input).
observed: |
  python3 3.15.2 (Linux build pod): [1, 2] and [5, 6]; with stop=10 the result is [1]. REPRODUCED.
  main (python.exe 3.16.0a1+dev heads/main:ef1fce0): identical (islice_next is unchanged on
  main). REPRODUCED.
promised_by: |
  Doc/library/itertools.rst:464-501: islice "works like sequence slicing", the "Roughly
  equivalent to" code yields only indices start, start+step, ...; the C error messages accept
  0 <= x <= sys.maxsize for every argument.
cause: |
  Modules/itertoolsmodule.c:1723-1728 (islice_next):
      oldnext = lz->next;
      lz->next += (size_t)lz->step;
      if (lz->next < oldnext || (stop != -1 && lz->next > stop))
          lz->next = stop;
  On overflow with stop == -1 (None) this stores the "no stop" sentinel into `next`.
possible_fix: |
  Clamp to PY_SSIZE_T_MAX instead of the sentinel when there is no stop, e.g.
      if (lz->next < oldnext)
          lz->next = (stop == -1) ? PY_SSIZE_T_MAX : stop;
      else if (stop != -1 && lz->next > stop)
          lz->next = stop;
  (cnt can never exceed PY_SSIZE_T_MAX, so no further item is returned.)
