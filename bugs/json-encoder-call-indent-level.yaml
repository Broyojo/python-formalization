id: json-encoder-call-indent-level
title: "json: c_make_encoder(...)(o, level) builds the indent for `level` before encoding, so a scalar fails at a huge level where _make_iterencode returns"
priority: P5
kind: twin-mismatch
module: json
files: [Modules/_json.c, Lib/json/encoder.py, Objects/unicodeobject.c]
functions: ["C encoder_call", "C create_indent_cache", "_make_iterencode"]
summary: |
  The second argument of the C encoder object (`_current_indent_level`) starts the indent cache:
  `encoder_call` calls `create_indent_cache(s, indent_level)` (Modules/_json.c:1465-1471), which
  computes `'\n' + indent * indent_level` with `PySequence_Repeat` before anything is encoded.
  The pure-Python twin `_make_iterencode(...)(o, _current_indent_level)` repeats the indent only
  when it opens a list or a dict (Lib/json/encoder.py:281, :340). So with indent='  ':
  `c_make_encoder(...)(1, 2**62)` raises OverflowError('repeated string is too long')
  (`unicode_repeat`, Objects/unicodeobject.c:12573-12576), and at 2**62 - 1 MemoryError
  (`PyUnicode_New`'s size check, :1325-1326), while `_make_iterencode(...)(1, 2**62)` returns '1'.
  A second difference at negative levels: C's cache starts from '\n' (the repeat gives ''), so
  level -1 indents like level 0 ('[\n  1\n]'), while Python computes `indent * (level + 1)` and
  gives '[\n1\n]'.
  Lean: json-encoder-call-twins (EncoderCallTwins) is refuted with the first witness;
  json-encoder-call (EncoderCallX) is proven once the cache is built, and json-indent-cache
  (IndentCacheSpec) gives every outcome of create_indent_cache. The negative-level difference is
  not refuted in Lean: the Python model takes a Nat level.
likelihood: |
  Very low. Both callables are private: JSONEncoder.iterencode always passes level 0, and only
  code that calls c_make_encoder or _make_iterencode itself can pass another level.
maybe_intended: |
  Probably tolerated: the argument is private and huge or negative levels are meaningless. The
  difference is in when the indent is built, not in what is written for sensible levels.
reproducer: |
  import json.encoder as E
  from _json import make_encoder as c_make_encoder
  def dflt(o):
      raise TypeError('x')
  def c(level, o):
      enc = c_make_encoder(None, dflt, E.encode_basestring_ascii, '  ', ': ', ', ', False, False, True)
      try:
          return enc(o, level)[0]
      except Exception as e:
          return f'{type(e).__name__}: {e}'
  def py(level, o):
      it = E._make_iterencode({}, dflt, E.encode_basestring_ascii, '  ', float.__repr__, ': ', ', ',
                              False, False, True)
      try:
          return ''.join(it(o, level))
      except Exception as e:
          return f'{type(e).__name__}: {e}'
  rows = [(2**62, 1), (2**62 - 1, 1), (-1, [1])]
  out = [(lv, o, c(lv, o), py(lv, o)) for lv, o in rows]
  for lv, o, a, b in out:
      print(f'level {lv} {o!r}: C {a!r}  Python {b!r}')
  if (out[0][2] == 'OverflowError: repeated string is too long' and out[0][3] == '1'
          and out[1][2].startswith('MemoryError') and out[1][3] == '1'
          and out[2][2] == '[\n  1\n]' and out[2][3] == '[\n1\n]'):
      print('REPRODUCED json-encoder-call-indent-level')
expected: |
  The same result from both twins for the same level, or at least for a scalar, which needs no
  indent at all.
observed: |
  python3 3.15.2: REPRODUCED. level 2**62, 1: C OverflowError('repeated string is too long'),
  Python '1'; level 2**62 - 1: C MemoryError, Python '1'; level -1, [1]: C '[\n  1\n]', Python
  '[\n1\n]'.
promised_by: |
  C/Python twin agreement (encoder.py:254-262 picks c_make_encoder when it is available and
  _make_iterencode otherwise, with the same arguments).
cause: |
  Modules/_json.c:1373-1390 (create_indent_cache repeats the indent `indent_level` times) called
  from encoder_call at :1465-1471, before encoder_listencode_obj; Lib/json/encoder.py:281, :340
  (the indent is repeated only inside _iterencode_list and _iterencode_dict, at level + 1).
possible_fix: |
  None needed for public use. If wanted, encoder_call could build the cache lazily (on the first
  container), or clamp a negative level to 0 in Python as C does.
reproduces:
  python3 (3.15.2): REPRODUCED
  main (3.16.0a1+dev, vendor/cpython-main/python.exe): REPRODUCED
duplicates:
  issues:
    - {number: 143196, state: closed, relation: "related (create_indent_cache's PySequence_Repeat runs a str subclass's __mul__; heap overflow, fixed)", reason: completed}
  queries: ["json _current_indent_level", "json indent level overflow repeated string", "c_make_encoder indent_level",
            "json encoder indent cache create_indent_cache", "json indent MemoryError", "json encoder level", "make_encoder",
            "json iterencode indent level", "gh issue view 143196", "bugforge-results/README.md: no indent-level entry"]
