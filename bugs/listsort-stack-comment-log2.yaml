id: listsort-stack-comment-log2
title: "listobject.c: the MAX_MERGE_PENDING comment understates the stack depth powersort can need"
priority: P4
kind: doc-mismatch
module: listsort
files: [Objects/listobject.c]
functions: ["found_new_run", "powerloop"]
summary: |
  The comment above MAX_MERGE_PENDING says "For a list with n elements, this needs at most
  floor(log2(n)) + 1 entries even if we didn't force runs to a minimal length. So the number of
  bits in a Py_ssize_t is plenty large enough for all cases." With runs not forced to a minimal
  length, the bound is false: n = 3 with runs [1, 1, 1] keeps 3 entries pending, and
  floor(log2(3)) + 1 = 2. Runs [2, 2, 1, 1] for n = 6 reach 4 entries (the comment allows 3). In
  general [2**k, 2**k, 2**(k-1), ..., 2, 1, 1] sums to n = 3 * 2**k and reached k + 3 entries, one more
  than the comment allows, at every k checked (0 to 61). An exhaustive search over all run structures
  for n <= 18 exceeds the comment exactly at n = 3, 6, 7 and 12 to 15.
  The Lean proof gives the correct bound for arbitrary run lengths: after each push the stack holds
  s entries with 2**s < 4n, so s <= ceil(log2(n)) + 1 (listsort-stack-bound). That bound is attained:
  n = 3 * 2**61 <= PY_SSIZE_T_MAX with runs [2**61, 2**61, 2**60, ..., 2, 1, 1] fills all 64 slots
  (listsort-stack-bound-tight). So the conclusion of the comment holds, but with no slack for
  arbitrary runs rather than "plenty".
  This concerns a comment only. The code is correct: assert(ms.n < MAX_MERGE_PENDING) is proven to
  hold for every list length up to PY_SSIZE_T_MAX, every comparison function and every run structure
  (listsort-sort-push-assert).
likelihood: |
  No runtime effect, on any input. Real runs are at least minrun >= 32 long except the last, and real
  lists have fewer than 2**60 items on 64-bit builds, so real stacks are far below both the comment's
  bound and MAX_MERGE_PENDING. The sentence is wrong only about the hypothetical it explicitly
  mentions ("even if we didn't force runs to a minimal length"). A reader could rely on it when
  reasoning about the stack size, for instance when changing minrun, as main already has.
maybe_intended: |
  Likely a slip rather than a choice. floor(log2(n)) + 1 is the natural guess from "the powers are
  distinct and bounded by log2(n)". The off-by-one comes from the topmost run, which has no stored
  power yet. A maintainer might reasonably treat the comment as close enough; it only matters if it
  is touched for another reason.
reproducer: |
  # Pending-stack depth cannot be observed from Python, so this is a line-for-line transcription of
  # powerloop() and found_new_run() (Objects/listobject.c:2602-2667); it does not run list.sort.
  import math
  def powerloop(s1, n1, n2, n):
      result = 0
      a = 2 * s1 + n1
      b = a + n1 + n2
      while True:
          result += 1
          if a >= n:
              a -= n
              b -= n
          elif b >= n:
              break
          a <<= 1
          b <<= 1
      return result
  def max_depth(lens):
      n = sum(lens)
      stack, pos, depth = [], 0, 0  # entries are [start, length, power]
      for n2 in lens:
          if stack:
              power = powerloop(stack[-1][0], stack[-1][1], n2, n)
              while len(stack) > 1 and stack[-2][2] > power:
                  stack[-2][1] += stack[-1][1]
                  stack.pop()
              stack[-1][2] = power
          stack.append([pos, n2, 0])
          pos += n2
          depth = max(depth, len(stack))
      return depth
  for lens in ([1, 1, 1], [2, 2, 1, 1]):
      n = sum(lens)
      print(lens, 'n =', n, 'depth', max_depth(lens), 'comment allows', math.floor(math.log2(n)) + 1)
  tight = [2**61] + [2**i for i in range(61, -1, -1)] + [1]
  print('n = 3 * 2**61, sum ok:', sum(tight) == 3 * 2**61, 'depth', max_depth(tight))
  if max_depth([1, 1, 1]) == 3 and max_depth([2, 2, 1, 1]) == 4 and max_depth(tight) == 64:
      print('REPRODUCED listsort-stack-comment-log2')
expected: |
  The comment states a correct bound, such as "at most ceil(log2(n)) + 1 entries", and says that 64 is
  exactly enough for arbitrary run lengths, and plenty only because runs are forced to minrun.
observed: |
  python3 3.14.7: depth 3 for [1, 1, 1] (comment allows 2), depth 4 for [2, 2, 1, 1] (comment allows
  3), depth 64 for the n = 3 * 2**61 structure. REPRODUCED.
  main: REPRODUCED with the same output. The transcription does not depend on the interpreter;
  what matters is that main keeps the same comment (Objects/listobject.c:1772-1776), the same
  powerloop and the same found_new_run. Only minrun changed on main (minrun_next, Pochmann's scheme),
  and the bound for arbitrary runs covers that too.
promised_by: |
  Objects/listobject.c:1673-1677 (comment on MAX_MERGE_PENDING). Added with the powersort change,
  GH-28108 (bpo-34561), which also replaced MAX_MERGE_PENDING 85 by SIZEOF_SIZE_T * 8.
cause: |
  Objects/listobject.c:1674: the bound counts the distinct stored powers but not the top run, which has
  no stored power. Stored powers are distinct, >= 1 and satisfy 2**L < 2n, because the last run pair
  (n1 + n2 >= 2) has b - a >= 2 in powerloop (:2618-2619); that gives ceil(log2(n)) stored entries
  plus the top one.
possible_fix: |
  Replace "at most floor(log2(n)) + 1" by "at most ceil(log2(n)) + 1", and "plenty large enough" by
  something like "large enough: the bound is reached only by run structures far shorter than
  minrun allows".
