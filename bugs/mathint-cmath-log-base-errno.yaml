  queries: ["cmath log base errno", "cmath.log zero base", "cmath log errno",
            "cmath log(0, 2)", "cmath log base domain error"]
  notes: "No matching issue. Related but different: python/cpython#156145 (open feature request to stop relying on platform errno) and #153144 (atan2 errno). Not in vendor/bugforge-results."
