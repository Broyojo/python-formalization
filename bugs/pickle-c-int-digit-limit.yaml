  queries: ["pickle int_max_str_digits", "pickle 4300", "int_max_str_digits strtol", "pickle max_str_digits",
            "max str digits pickle protocol 0", "pickle leading zeros", "int_max_str_digits",
            "Exceeds the limit (4300 digits)", "integer string conversion limit"]
  bugforge: "no pickle entries in vendor/bugforge-results/README.md"
lean:
