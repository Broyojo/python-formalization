id: pygrammar-check-none-in-list-segfault
title: "compile() segfaults on a hand-built AST with None in any of 11 list fields: handlers, patterns, keys, kwd_attrs, type_params, Global.names"
priority: P2
kind: crash
module: pygrammar
files: [Python/ast.c, Python/Python-ast.c]
functions: ["validate_stmt", "validate_patterns", "validate_pattern", "validate_type_params"]
summary: |
  obj2ast for a sum type turns None into NULL, so a list element None becomes a NULL entry. The
  validator guards this for expressions and statements ("None disallowed in expression list") but
  not for the other sum-typed lists. compile(ast.Module([ast.Try([ast.Pass()], [None], [], [])], []),
  ...) reaches VALIDATE_POSITIONS(handler) with handler NULL and the interpreter dies with SIGSEGV.
  MatchSequence([None]) does the same through validate_patterns and validate_pattern.
  TypeAlias(type_params=[None]) passes validation, since validate_type_params skips NULL, and
  crashes later in the compiler. Product types are not affected, because their obj2ast raises
  'required field missing'. The crash needs no deep nesting: each tree here has a handful of nodes.
  Replacing one element by None in every list field of a tree that uses all of them gives SIGSEGV for
  Try.handlers, TryStar.handlers, MatchSequence.patterns, MatchOr.patterns, MatchMapping.patterns,
  MatchMapping.keys, MatchClass.patterns, MatchClass.kwd_patterns, MatchClass.kwd_attrs,
  FunctionDef.type_params and Global.names. MatchMapping.keys dies in validate_pattern at key->kind,
  kwd_attrs in validate_name, Global.names past the validator.
likelihood: |
  Low in practice: a code generator or AST transformer has to leave a None in one of these lists,
  which is an easy slip for a transformer that returns None from a visitor over handlers. The result
  is a process crash in place of an exception, reachable from pure Python.
maybe_intended: |
  No. The module's stated purpose is to check "the integrity of the given abstract syntax tree
  (potentially constructed manually)". The docs warn of crashes on sufficiently large or complex
  input, which this is not.
reproducer: |
  import subprocess, sys
  code = ("import ast\n"
          "L = dict(lineno=1, col_offset=0, end_lineno=1, end_col_offset=1)\n"
          "compile(ast.Module([ast.Try([ast.Pass(**L)], [None], [], [], **L)], []), 'x', 'exec')\n")
  r = subprocess.run([sys.executable, '-c', code], capture_output=True)
  print(r.returncode)
  if r.returncode < 0:
      print('REPRODUCED pygrammar-check-none-in-list-segfault')
expected: |
  ValueError, as "None disallowed in expression list" for expressions.
promised_by: |
  Python/ast.c header comment; undisputed invariant: no crash on small input.
cause: |
  Python/ast.c, validate_stmt: the handler loops of Try_kind and TryStar_kind use `handler` with no
  NULL check; validate_patterns passes NULL to validate_pattern; validate_type_params skips NULL
  entries rather than rejecting them; validate_pattern reads key->kind for a NULL key in
  MatchMapping and passes a NULL name to validate_name for kwd_attrs; nothing checks Global.names.
possible_fix: |
  Reject NULL in those loops with ValueError, the way validate_stmts and validate_exprs do; better,
  have the generated obj2ast list code in Parser/asdl_c.py reject None for non-optional elements.
tested:
  python3 (3.14.7): REPRODUCED
  main (vendor/cpython-main/python.exe, 3.16.0a1+dev): REPRODUCED
duplicates:
  issues: []
  queries: ["compile ast segfault None keyword", "ast validator None NULL crash arguments",
            "_PyAST_Validate segfault None in list"]
  bugforge: "none"
lean:
  property: PyLean.PyGrammar.Check.ValidateNoNullDeref
  theorem: PyLean.PyGrammar.Check.validateNoNullDeref_refuted
