id: pygrammar-check-trystar-handlers
title: "_PyAST_Validate checks ExceptHandler positions for Try but not for TryStar, and lets a bare except* through to an internal 'Invalid CFG' error"
priority: P4
kind: missing-validation
module: pygrammar
files: [Python/ast.c]
functions: ["validate_stmt"]
summary: |
  validate_stmt has two copies of the handler loop. The Try copy calls VALIDATE_POSITIONS(handler);
  the TryStar copy does not. So compile() of a tree with a handler whose lineno exceeds its
  end_lineno raises "AST node line range (5, 1) is not valid" for Try and passes validation for
  TryStar. Separately, ExceptHandler.type=None is accepted for TryStar although `except*:` has no
  syntax; compile then fails with the internal message "Invalid CFG, stack underflow" from the
  flow graph code rather than a validation error.
likelihood: |
  Low: only hand-built trees reach this, such as code generators and AST transformers.
maybe_intended: |
  The missing check looks like copy drift: the TryStar case was written from the Try case and the
  positions check was added to Try later. Hand-built trees are supported by compile().
reproducer: |
  import ast
  L = dict(lineno=1, col_offset=0, end_lineno=1, end_col_offset=1)
  def tree(cls, ty):
      h = ast.ExceptHandler(ty, None, [ast.Pass(**L)], lineno=5, col_offset=0, end_lineno=1, end_col_offset=0)
      return ast.Module([cls([ast.Pass(**L)], [h], [], [], **L)], [])
  x = ast.Name('x', ast.Load(), **L)
  res = []
  for c in (ast.Try, ast.TryStar):
      try:
          compile(tree(c, x), 'x', 'exec')
          res.append('ok')
      except ValueError as e:
          res.append(str(e))
  print(res)
  if res[0].startswith('AST node line range') and res[1] == 'ok':
      print('REPRODUCED pygrammar-check-trystar-handlers')
expected: |
  The same ValueError for both, and a clear validation error for a typeless except* handler.
promised_by: |
  The implementation disagreeing with itself: Python/ast.c, Try_kind against TryStar_kind.
cause: |
  Python/ast.c, validate_stmt: the handler loop of Try_kind has VALIDATE_POSITIONS(handler); the
  loop of TryStar_kind omits it, and neither case rejects a NULL type for except*.
possible_fix: |
  Add VALIDATE_POSITIONS(handler) to the TryStar loop, and in it raise ValueError when
  handler->v.ExceptHandler.type is NULL.
tested:
  python3 (3.14.7): REPRODUCED
  main (vendor/cpython-main/python.exe, 3.16.0a1+dev): REPRODUCED
