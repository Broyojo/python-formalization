            "python/cpython#111257 (open): unparsing FormattedValue without JoinedStr fails"]
  queries: ["format_spec Constant JoinedStr", "format spec N escape f-string ast",
            "setup_full_format_spec (issues and prs)", "format_spec Constant escape",
            "f-string format spec Constant instead of JoinedStr", "gh api issues/122300 and comments"]
