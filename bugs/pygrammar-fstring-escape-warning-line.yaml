notes: |
  Two further column defects of the same function's -W error path, seen while triaging and not
  modelled (the model does not turn warnings into errors): the column is counted over the
  escape-rewritten buffer, so each non-ASCII character before the escape on its line moves it
  right (x = 'é\d' reports offset 11 for a backslash at 7); and the quote count at :69-86 stops at
  a prefix letter, so b'ab\d' and u'ab\d' are off by the prefix and quote (offset 7 for 9).
