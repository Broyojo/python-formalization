  queries: ["gh issue view 160181 --repo python/cpython", "gh search issues: BytesIO getvalue cached",
            "gh search issues: BytesIO stale", "bugforge README: no io entries"]
  note: |
    Duplicate of gh-160181 (closed 2026-10-23); the fix landed on main after 3.15.2, so 3.15.2
    reproduces. Found independently by the model's sharing state (PyIO/BytesShare.lean).
