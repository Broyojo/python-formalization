id: pyio-bytesio-write-near-maxsize-systemerror
title: "io.BytesIO.write ending exactly at sys.maxsize raises SystemError"
priority: P4
kind: duplicate-already-fixed
module: pyio
files: [Modules/_io/bytesio.c, Objects/bytesobject.c]
functions: ["resize_buffer_lock_held", "resize_unshared_buffer_lock_held", "_PyBytes_ResizeKeepOnError"]
summary: |
  When pos + len(b) is exactly sys.maxsize, resize_buffer_lock_held passes its
  `size > PY_SSIZE_T_MAX` check and computes alloc = size + 1 = 2**63, which is negative as a
  Py_ssize_t, so write raises SystemError instead of OverflowError. The message depends on whether
  the buffer is shared: PyBytes_FromStringAndSize reports the negative size, and
  _PyBytes_ResizeKeepOnError reports a bad internal call. Already fixed on main. On 3.14.7 a failed
  resize also closed the stream and lost its contents; 3.15.2 keeps them, which
  pyio-bytesio-failed-write-keeps-state states.
likelihood: |
  Very low: it needs that exact size.
maybe_intended: |
  No: fixed upstream.
reproducer: |
  import io, sys
  def attempt(pos):
      # bytes(bytearray(...)) so the BytesIO holds the only reference to its buffer
      b = io.BytesIO(bytes(bytearray(b'abc')))
      b.seek(pos)
      try:
          b.write(b'x')
          r = 'ok'
      except Exception as e:
          r = type(e).__name__
      return r, b.closed
  a = attempt(sys.maxsize - 1)
  m = attempt(2 ** 62)
  print('seek(sys.maxsize - 1); write(b"x"):', a)
  print('seek(2**62); write(b"x"):', m)
  if a == ('SystemError', False):
      print('REPRODUCED pyio-bytesio-write-near-maxsize-systemerror')
expected: |
  OverflowError, with the stream still open and its data intact.
observed: |
  python3 3.15.2: seek(sys.maxsize - 1) + write: SystemError, not closed; seek(2**62) + write:
  MemoryError, not closed. REPRODUCED.
  main (python.exe 3.16.0a1+dev heads/main:ef1fce0): OverflowError, not closed; MemoryError, not closed. NOT REPRODUCED (fixed).
promised_by: |
  Invariant: no internal error leaking.
cause: |
  Modules/_io/bytesio.c:181-229 has no check on alloc after the size computation, so
  resize_unshared_buffer_lock_held (:101-116) hands a negative size to _PyBytes_ResizeKeepOnError
  (Objects/bytesobject.c:3423-3426), and unshare_buffer_lock_held (:159-175) to
  PyBytes_FromStringAndSize (:124-129).
possible_fix: |
  Already on main: `if (alloc > PY_SSIZE_T_MAX) goto overflow;`.
duplicates:
