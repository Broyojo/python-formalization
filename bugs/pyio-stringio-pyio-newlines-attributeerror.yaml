  theorem: PyLean.PyIO.stringIONewlinesAttr_refuted
  also_refuted: "PyLean.PyIO.StringIONewlinesTwins (stringIONewlinesTwins_refuted), item (2); PyLean.PyIO.StringIOInitRead (proven) states both twins' newlines before and after the first read"
