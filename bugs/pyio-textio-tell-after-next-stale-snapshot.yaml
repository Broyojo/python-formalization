    - {number: 160811, state: open, relation: "same assert, reached through a stale b2cratio after seek() past a \\r", reason: "different trigger"}
    - {number: 81217, state: open, relation: "iterating disables tell(); the cause of the stale snapshot", reason: "feature discussion, not this wrong result"}
  queries: ["TextIOWrapper tell next flush assertion (unquoted)", "textio tell skip_bytes (unquoted)",
            "TextIOWrapper tell after next snapshot (unquoted)", "bugforge README: no TextIOWrapper entries"]
lean:
  property: PyLean.PyIO.TextCTellAfterNextInRange
  theorem: PyLean.PyIO.textCTellAfterNextInRange_refuted
  model: "PyLean.PyIO.TCm.snapBytes reads the terminating NUL one byte past the snapshot and calls a longer over-read undefined behaviour"
