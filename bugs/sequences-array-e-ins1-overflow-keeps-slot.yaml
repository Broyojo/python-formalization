id: sequences-array-e-ins1-overflow-keeps-slot
title: "array('e').append(65536.0) raises OverflowError but keeps a new item holding uninitialised memory"
priority: P2
kind: duplicate-open-upstream
module: sequences
files: [Modules/arraymodule.c]
functions: ["ins1", "e_setitem", "array_array_append_impl", "array_array_insert_impl", "array_iter_extend"]
summary: |
  ins1 checks a value with setitem(self, -1, v), grows the array, shifts, and stores with
  setitem(self, where, v). Every other setitem validates before its `if (i >= 0)`, so the first
  call catches what the second would refuse. e_setitem, new in 3.15, calls PyFloat_Pack2 inside
  `if (i >= 0)`, and Pack2 is what raises OverflowError for a finite value outside binary16.
  The check passes, the array grows, the store raises, and ins1 returns -1 without undoing
  anything. So a failed append, insert or extend leaves len(a) one larger, and for
  a position at or past the end the new item is whatever realloc left there: a read of
  uninitialised heap memory from Python. On 3.15.2, array('e') followed by a failed append gave
  the item 3.25 (b'\x80B') in our run. An insert before the end leaves the item at that
  position duplicated.
  Lean: ArrayIns1Atomic and ArrayIterExtend are refuted by this input (array('e'), 65536.0);
  ArrayIns1Failure and ArrayIterExtendExact state what happens, for every typecode.
likelihood: |
  Moderate. It needs a float16 array and a value of magnitude 65520 or more, in the range
  where float32 stays finite, and a program that catches the OverflowError and keeps the
  array. The failure path is otherwise silent, and any later read returns the stale bytes.
maybe_intended: |
  No. fromlist restores the size on the same error, and every other typecode leaves the array
  as it was. The slot's contents are not defined by anything.
reproducer: |
  from array import array
  a = array('e', [1.0, 2.0])
  try:
      a.append(65536.0)
      raised = False
  except OverflowError:
      raised = True
  b = array('e', [1.0, 2.0])
  try:
      b.insert(0, 65536.0)
  except OverflowError:
      pass
  print(raised, len(a), list(b))
  if raised and len(a) == 3 and list(b) == [1.0, 1.0, 2.0]:
      print('REPRODUCED sequences-array-e-ins1-overflow-keeps-slot')
expected: |
  OverflowError with the array unchanged, as for 'b', 'h', 'i' and the others.
observed: |
  python3 3.15.2: True 3 [1.0, 1.0, 2.0]. REPRODUCED. On the pod's build, a failed
  array('e').append(1e6) left the slot b'\x80B' on each of five tries in one process, bytes
  the array never held.
  main (python.exe 3.16.0a1+dev heads/main:ef1fce0): identical. REPRODUCED. Its e_setitem
  (Modules/arraymodule.c:585-599) parses a double since gh-156864 and still packs under
  `if (i >= 0)`.
promised_by: |
  No sentence states it. The invariant is that a failed call changes nothing: fromlist's
  documentation says the array is unchanged on a type error, and ins1's first
  setitem(self, -1, v) exists to refuse the value before the array is touched.
cause: |
  Modules/arraymodule.c:636-640 (e_setitem) packs only for i >= 0, and PyFloat_Pack2
  (Objects/floatobject.c:1944-1946, 1973-1974, 1996-1999) is the only range check.
  Modules/arraymodule.c:870 (first setitem), :873 (array_resize) and :888 (second setitem, whose
  failure ins1 passes on with the array already grown).
possible_fix: |
  In e_setitem, pack into a local `unsigned char buf[2]` before CHECK_ARRAY_BOUNDS, return -1 on
  failure, and memcpy to ob_item under `if (i >= 0)`.
