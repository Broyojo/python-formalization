id: sequences-array-extended-slice-empty-deletes
title: "a[i:j:k] = array() with k != 1 deletes the slice instead of raising ValueError like list"
priority: P3
kind: doc-violation
module: sequences
files: [Modules/arraymodule.c, Objects/bytearrayobject.c]
functions: ["array_ass_subscr", "bytearray_ass_subscript_lock_held"]
summary: |
  Assigning an empty array to an extended slice (step other than 1) of an array.array
  silently deletes the selected items:
  a = array('b', [1, 2, 3, 4, 5]); a[::2] = array('b')  ->  array('b', [2, 4]).
  The documented rule (Doc/library/stdtypes.rst note (1): "If k is not equal to 1, t must
  have the same length as the slice it is replacing") and list behave differently:
  l = [1, 2, 3, 4, 5]; l[::2] = []  ->  ValueError: attempt to assign sequence of size 0 to
  extended slice of size 3. A non-empty right-hand side of the wrong length does raise
  ValueError for arrays too (a[::2] = array('b', [9]) -> "attempt to assign array of size 1 to
  extended slice of size 3"), so only the empty case is special. bytearray has the same code
  shape and the same behaviour (b[::2] = b'' deletes).
  Lean: ArraySliceAssignAgree (array slice assignment agrees with list slice assignment up to
  the exception message) is refuted by this input; ArraySliceAssignAgreeNonempty (the same for
  a non-empty right-hand side) and ListSliceAssign (list slice assignment equals the
  language-reference semantics computed with slice.indices, for all int bounds and steps) are
  proven.
likelihood: |
  Low to moderate. Code that computes the replacement and gets an empty result (e.g.
  a[::2] = array('b', filter(...))) silently shrinks the array where a list would raise. No
  test in Lib/test/test_array.py or test_bytes.py covers an empty right-hand side with a step.
maybe_intended: |
  Possibly an old deliberate shortcut: the branch is commented "Delete slice" and shares the
  deletion loop with `del a[i:j:k]`. But it contradicts the documented rule and the list type,
  which the array docs say arrays "behave very much like". A maintainer might fix it (raise
  ValueError when needed == 0 and slicelength != 0 for step != 1, in array and bytearray) or
  decide it is not worth a behaviour change; either way the inconsistency is undocumented.
reproducer: |
  from array import array
  a = array('b', [1, 2, 3, 4, 5])
  a[::2] = array('b')
  l = [1, 2, 3, 4, 5]
  try:
      l[::2] = []
      lr = repr(l)
  except ValueError as e:
      lr = 'ValueError: %s' % e
  try:
      a2 = array('b', [1, 2, 3, 4, 5]); a2[::2] = array('b', [9])
      ar = repr(a2)
  except ValueError as e:
      ar = 'ValueError: %s' % e
  b = bytearray(b'\x01\x02\x03\x04\x05')
  b[::2] = b''
  print('array  a[::2] = array("b")      ->', a)
  print('list   l[::2] = []              ->', lr)
  print('array  a[::2] = array("b", [9]) ->', ar)
  print('bytearray b[::2] = b""          ->', b)
  if list(a) == [2, 4] and lr.startswith('ValueError') and ar.startswith('ValueError'):
      print('REPRODUCED sequences-array-extended-slice-empty-deletes')
expected: |
  ValueError("attempt to assign array of size 0 to extended slice of size 3"), as for any other
  length mismatch and as list does.
observed: |
  python3 3.15.2: array('b', [2, 4]); list raises ValueError; the length-1 array raises
  ValueError; bytearray(b'\x02\x04'). REPRODUCED.
  main (python.exe 3.16.0a1+dev heads/main:ef1fce0): identical. REPRODUCED.
promised_by: |
  Doc/builtins/stdtypes.rst:1528-1546, mutable sequence table row `s[i:j:k] = t` with note (1)
  "If k is not equal to 1, t must have the same length as the slice it is replacing";
  Doc/reference/simple_stmts.rst (slice assignment); Doc/library/array.rst (arrays "behave very
  much like lists").
cause: |
  Modules/arraymodule.c:2902-2930: after the step == 1 case, `else if (needed == 0)`
  runs the deletion loop without comparing needed with slicelength; the length check
  `needed != slicelength` only exists in the final `else` (:2934-2942). Same structure in
  Objects/bytearrayobject.c:879-902. list_ass_subscript_lock_held (Objects/listobject.c:3868-3877)
  checks the length for every extended-slice assignment.
possible_fix: |
  In array_ass_subscr (and bytearray_ass_subscript_lock_held), take the deletion branch only for
  `value == NULL`, or check `needed != slicelength` before it when step != 1.
duplicates:
  issues:
    - {number: 52648, state: closed, relation: "bytearray slice assignment of ints/str (bpo-8401); different bug"}
    - {number: 76469, state: open, relation: "list slice assignment consistency question; different case"}
  queries: ["array extended slice assignment empty", "bytearray extended slice empty", "extended slice assign empty deletes",
            "array slice assignment step ValueError", "attempt to assign array of size", "array extended slice",
            "bytearray extended slice", "extended slice assignment", "bytearray slice assignment",
            "bugforge README: no array/bytearray slice entries"]
lean:
  property: PyLean.Sequences.ArraySliceAssignAgree
  theorem: PyLean.Sequences.arraySliceAssignAgree_refuted
