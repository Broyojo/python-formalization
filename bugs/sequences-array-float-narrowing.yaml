id: sequences-array-float-narrowing
title: "array('e') rounds a double twice (through a C float), so it stores a different half than struct.pack('e'); 'e', 'f' and 'Zf' disagree with struct at the overflow boundary and on signalling NaNs"
priority: P3
kind: twin-mismatch
module: sequences
files: [Modules/arraymodule.c]
functions: ["e_setitem", "f_setitem", "f_getitem", "cf_setitem", "cf_getitem"]
summary: |
  e_setitem parses its value with PyArg_Parse(v, "f;...") (Modules/arraymodule.c:629-630), which
  rounds the double to a C float (Python/getargs.c:922-930), and then calls PyFloat_Pack2 on that
  float promoted back to double (:636-639). Rounding binary64 to binary32 and then to binary16 is
  a double rounding: a double just above a binary16 tie is first rounded onto the tie, and the
  second rounding goes to even. struct.pack('e', x), and a single C conversion to _Float16 (the
  item type Doc/library/array.rst gives), round once.
  For x = 1 + 2**-11 + 2**-40, array('e', [x])[0] is 1.0 and struct.unpack('e',
  struct.pack('e', x))[0] is 1.0009765625, the nearest half. The same double rounding moves the
  overflow boundary: every double in [65519.998046875, 65520) rounds to the float 65520.0, so
  array('e', [65519.999]) raises OverflowError where struct.pack('e', 65519.999) gives 65504.0.
  Past the float range the float conversion gives inf, which PyFloat_Pack2 accepts:
  array('e', [1e300]) stores inf (struct raises OverflowError) - this part, and the same silent
  inf of f_setitem and cf_setitem (array('f', [1e300])), are python/cpython#156864 and #156865,
  fixed on main by gh-156869 after 3.15.2.
  f_getitem and cf_getitem widen with a C (double) cast instead of PyFloat_Unpack4, and f_setitem
  narrows with (float): a signalling NaN loaded with frombytes comes back quiet, so a[i] = a[i]
  changes the bits of an 'f' item 0x7f800001 to 0x7fc00001 (and of an 'e' item 0x7d00 to 0x7f00,
  through the float step of e_setitem), while struct 'f' and PyFloat_Pack4/Unpack4 keep a
  signalling NaN since 3.14. Main fixes the 'e' case but not the 'f'/'Zf' one (see observed).
  Lean (lean/PyLean/Sequences/ArrayFloatProps.lean): ArrayHalfStruct is refuted by
  x = 1 + 2**-11 + 2**-40, ArraySingleStruct by 1e300, ArrayFloatItems by 0x7f800001;
  ArrayFloatRoundTrip states the exact round trip of every e, f, d, Zf and Zd pattern (only
  signalling NaNs of e and f change, by their quiet bit), ArrayFloatConv the conversions.
likelihood: |
  Low to moderate. The double rounding needs a double that is not exactly representable as a
  float and lies within 2**-24 relative of a half tie: about one random double in 2**13 for a
  given half interval, so arrays filled from computed float64 data (numpy interop, sensor data)
  do hit it, and the error is one half ulp. The overflow window is narrow. Signalling NaNs only
  come from frombytes or reinterpretation.
maybe_intended: |
  The double rounding is not intended: it is a side effect of reusing the "f" parser for 'e',
  and main changed e_setitem to parse a double (gh-156869), which removes it. The inf for values
  past the float range was acknowledged as a bug (#156864, #156865). The NaN quieting of 'f' may
  be considered acceptable, as C leaves NaN conversion unspecified, but struct deliberately keeps
  signalling NaNs and array does not.
reproducer: |
  import struct
  from array import array
  x = 1 + 2.0 ** -11 + 2.0 ** -40
  a = array('e', [x]).tobytes()
  s = struct.pack('<e', x)
  try:
      array('e', [65519.999])
      boundary = None
  except OverflowError:
      boundary = struct.unpack('<e', struct.pack('<e', 65519.999))[0]
  f = array('f')
  f.frombytes((0x7f800001).to_bytes(4, 'little'))
  f[0] = f[0]
  snan = f.tobytes().hex()
  print(a.hex(), s.hex(), boundary, snan)
  if a == b'\x00\x3c' and s == b'\x01\x3c' and boundary == 65504.0 and snan == '0100c07f':
      print('REPRODUCED sequences-array-float-narrowing')
expected: |
  array('e', [x]).tobytes() == struct.pack('<e', x) for every float x (one rounding to nearest,
  OverflowError exactly when that rounding overflows), and a[i] = a[i] leaving the item's bits
  unchanged.
observed: |
  python3 3.15.2: 003c 013c 65504.0 0100c07f. REPRODUCED.
  main (python.exe 3.16.0a1+dev ef1fce0): 013c 013c None 0100c07f. NOT REPRODUCED as a whole.
  gh-156869 makes e_setitem parse a double and call PyFloat_Pack2 on it directly, which fixes the
  double rounding, the overflow boundary and the 'e' signalling NaN (an 'e' item 0x7d00 stays
  0x7d00 under a[0] = a[0] on main; it becomes 0x7f00 on 3.15.2). The 'f' and 'Zf' signalling
  NaNs still come back quiet on main (0x7f800001 -> 0x7fc00001), because f_getitem and cf_getitem
  still widen with a C (double) cast (main Modules/arraymodule.c:602-605, 644-650), and that cast
  already quiets the NaN before f_setitem's PyFloat_Pack4 sees it.
promised_by: |
  Doc/library/array.rst:44-45, 74-79: the 'e' item is the C type _Float16 (IEEE 754 binary16), to
  which C converts a double with one rounding; Doc/library/struct.rst:319-323 for the format
  struct shares. Twin: struct.pack('e') and PyFloat_Pack2 on the same double.
cause: |
  Modules/arraymodule.c:629-630 (`float x; PyArg_Parse(v, "f;array item must be float", &x)`)
  then :637 (`PyFloat_Pack2(x, ...)` on the promoted float); :646 (`(double)` in f_getitem),
  :652-659 (`float x` stored as is in f_setitem), :689 and :704-705 (cf_getitem, cf_setitem).
possible_fix: |
  A backport of gh-156869 (parse a double ("d") in e_setitem, f_setitem and cf_setitem and pack
  with PyFloat_Pack2 / PyFloat_Pack4) fixes the double rounding, the overflow boundary, the silent
  inf and the 'e' signalling NaN. It does not fix the 'f'/'Zf' signalling NaN: main still reads
  those items with a (double) cast. That needs f_getitem and cf_getitem to read with
  PyFloat_Unpack4, which keeps a signalling NaN, on main as on 3.15.
