            "array information leak heap (none relevant)",
            "gh search prs: 142882; CHECK_ARRAY_BOUNDS; array ins1 -> PR #158348 (open, gh-158345)",
            "gh issue view / gh api: 152166, 144128, 142883, 142882, 142555, 158345, 157197, 157196; gh pr diff 152167, 158348",
            "bugforge README: no array entry beyond unrelated bytearray/struct ones"]
  note: |
    Differs from bugs/sequences-array-e-ins1-overflow-keeps-slot.yaml, which concerns the same function:
    that record is an e (float16) value that passes the first check and fails the store, so ins1 raises
    after growing the array and leaves one stale slot; no Python code runs in between. This record needs
    no failure at all: the first check runs Python code that changes the array, and ins1 then trusts a
    size it read before. Fixing either one does not fix the other (except PR #158348, which restructures
    ins1 and would remove both).
    The fromlist lead (array_resize(self, old_size) at :1871/:1877 after a callback cleared the array) does
    reproduce, but only when the array reaches 16 items: below that, clear keeps the buffer (:156-161) and
    the restore re-exposes the old items unchanged, which is why array('q', range(10)) kept [0..9]. With
    array('q', range(64)), an item whose __index__ clears the array and raises leaves 64 items of fresh
    memory under PYTHONMALLOC=debug. That is the same function and symptom as open gh-152166 (whose PR
    #152167 still calls array_resize(self, old_size) on its new error path, so it would not fix the
    restore). It now has its own record, bugs/sequences-array-fromlist-restore-stale.yaml (refutation
    ArrayFromListRestore), which notes it may go upstream as a comment on gh-152166.
