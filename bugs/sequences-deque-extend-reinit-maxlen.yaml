id: sequences-deque-extend-reinit-maxlen
title: "deque.extend/extendleft keep applying the old maxlen after the iterator re-initialises the deque, leaving len(d) > d.maxlen for good"
priority: P5
kind: reentrancy
module: sequences
files: [Modules/_collectionsmodule.c]
functions: ["deque_extend_impl", "deque_extendleft_impl"]
summary: |
  deque_extend_impl reads `Py_ssize_t maxlen = deque->maxlen` once on entry and passes that
  local to deque_append_lock_held for every item. An iterator (its __iter__ or __next__)
  may call d.__init__(maxlen=m) on the deque being extended; __init__ clears the deque and
  stores the new bound, but the loop goes on trimming with the old one. Starting from an
  unbounded deque, every later item is kept, so the deque ends up longer than its own
  maxlen: deque([2, 3], maxlen=1) or even deque([1, 2, 3], maxlen=0). The state is
  permanent: append/appendleft trim only one item each (NEEDS_TRIM pops once), so the
  length never comes back below maxlen, d.copy() (which re-applies maxlen) is no longer
  equal to d, and pickling/copy.copy silently drop items. In the other direction, a bounded
  deque re-initialised as unbounded keeps being trimmed to the old bound during that extend:
  deque(maxlen=2) extended by an iterator that calls d.__init__() after its first item
  holds only the last two items with maxlen None. extendleft is the same (:539). Nothing
  notices: unlike iteration, extend has no mutation check.
  Lean: DequeExtendKeepsBound ("for every iterator whose __iter__/__next__ calls each keep
  the deque's invariant len(d) <= maxlen, __init__ included, extend leaves a deque that
  satisfies it") is refuted with the __iter__ form below; DequeExtendRe (the invariant and
  maxlen kept when the calls do not change maxlen, and the exact outcome) is proven.
likelihood: |
  Very low. It needs an iterator that re-initialises the very deque it is being consumed
  into. No memory-safety issue follows: the block structure stays consistent, only the
  documented length bound is broken.
maybe_intended: |
  Possibly tolerated: re-entrant mutation during extend is not checked anywhere, and the
  local copy of maxlen is an optimisation. But the result is a deque that violates its own
  documented invariant permanently (and whose copy differs from it), which is the kind of
  inconsistency the deque code otherwise guards against with its `state` checks. A fix is
  cheap (re-read deque->maxlen in the loop, or pass deque->maxlen as deque_append does),
  so a maintainer could well accept it, at low priority.
reproducer: |
  import copy
  from collections import deque
  d = deque()
  def g():
      yield 1
      d.__init__(maxlen=1)
      yield 2
      yield 3
  d.extend(g())
  r1 = (list(d), d.maxlen)
  d.append(4)
  r2 = (list(d), d.maxlen)
  c = d.copy()
  e = deque()
  class X:
      def __iter__(self):
          e.__init__(maxlen=0)
          return iter([1, 2, 3])
  e.extend(X())
  r3 = (list(e), e.maxlen)
  f = deque()
  def h():
      yield 1
      f.__init__(maxlen=1)
      yield 2
      yield 3
  f.extendleft(h())
  r4 = (list(f), f.maxlen)
  b = deque(maxlen=2)
  def k():
      yield 1
      b.__init__()
      yield 2
      yield 3
      yield 4
  b.extend(k())
  r5 = (list(b), b.maxlen)
  print('extend, __next__ re-inits to maxlen=1 :', r1)
  print('then append(4)                        :', r2)
  print('d.copy() == d                         :', c == d, list(c))
  print('extend, __iter__ re-inits to maxlen=0 :', r3)
  print('extendleft, __next__ re-inits         :', r4)
  print('bounded, __next__ re-inits unbounded  :', r5)
  if (r1 == ([2, 3], 1) and r2 == ([3, 4], 1) and c != d and len(c) == 1
          and r3 == ([1, 2, 3], 0) and r4 == ([3, 2], 1) and r5 == ([3, 4], None)):
      print('REPRODUCED sequences-deque-extend-reinit-maxlen')
expected: |
  Every deque satisfies len(d) <= d.maxlen when maxlen is not None: after the re-init the
  loop should apply the bound the deque now has (deque([3], maxlen=1), deque([], maxlen=0),
  deque([3], maxlen=1) for extendleft), and an unbounded deque should not lose items
  (deque([2, 3, 4])).
observed: |
  python3 3.15.2: deque([2, 3], maxlen=1); after append(4) deque([3, 4], maxlen=1); its copy
  is deque([4], maxlen=1) != d; deque([1, 2, 3], maxlen=0); extendleft gives
  deque([3, 2], maxlen=1); the re-initialised unbounded deque holds [3, 4] (items 2 dropped
  with maxlen None). REPRODUCED.
  main (vendor/cpython-main/python.exe, 3.16.0a1+dev): identical, REPRODUCED; the code is
  unchanged there (Modules/_collectionsmodule.c:484, :539 on main).
promised_by: |
  Doc/library/collections.rst:479-485: "If maxlen is not specified or is None, deques may
  grow to an arbitrary length. Otherwise, the deque is bounded to the specified maximum
  length. Once a bounded length deque is full, when new items are added, a corresponding
  number of items are discarded from the opposite end."
cause: |
  Modules/_collectionsmodule.c:484 `Py_ssize_t maxlen = deque->maxlen;` is read before
  PyObject_GetIter (:497) and the tp_iternext loop (:513-518), which both run Python code;
  :514 passes the stale local to deque_append_lock_held, whose trim (:359,
  NEEDS_TRIM at :338) then compares against it. deque_extendleft_impl does the same
  (:539, :569). deque_init_impl (:1768-1770) updates deque->maxlen and clears the deque in
  between. Once len(d) > maxlen, deque_append_lock_held pops only one item per append, so
  the excess persists.
possible_fix: |
  Pass deque->maxlen (re-read after each tp_iternext call) instead of the local, i.e.
  `deque_append_lock_held(deque, item, deque->maxlen)` at :514 and
  `deque_appendleft_lock_held(deque, item, deque->maxlen)` at :569 (the maxlen == 0
  consume_iterator shortcut can keep using the entry value, or re-check per item).
