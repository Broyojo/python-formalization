  queries: ["deque maxlen MemoryError", "deque imul", "deque repeat maxlen", "deque __imul__ maxlen",
            "deque inplace repeat", "deque multiplication", "deque mul maxlen", "deque_inplace_repeat",
            "deque MemoryError", "bpo-29634", "bugforge README: no deque entries"]
