  queries: ["SimpleQueue get timeout Fraction OverflowError",
            "_PyTime_FromSecondsObject double rounding overflow timeout",
            "SimpleQueue timeout PyTime_t precision",
            "queue SimpleQueue timeout out of range C PyTime_t"]
  bugforge: "not checked (the bugforge list is not available where this was recorded)"
  note: |
    The duplicate is of a record in this repo, not of an upstream issue.
