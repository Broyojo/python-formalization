id: textlibs-struct-bytes-format-nonascii-error
title: "struct: a non-ASCII bytes format raises UnicodeEncodeError from module functions but struct.error from Struct()"
priority: P4
kind: internal-inconsistency
module: textlibs
files: [Modules/_struct.c]
functions: ["cache_struct_converter", "Struct___init___impl", "pack", "calcsize_impl"]
summary: |
  `struct.Struct(b'\xff')` raises struct.error "bad char in struct format", but
  `struct.pack(b'\xff')` and `struct.calcsize(b'\xff')` raise UnicodeEncodeError naming a
  surrogate the caller never wrote. `cache_struct_converter` decodes the bytes with
  surrogateescape for its cache key, then calls `Struct(key)` with that str, which is encoded
  strictly to ASCII.
likelihood: |
  Low. Needs a malformed bytes format, and both paths do reject it.
maybe_intended: |
  Not designed, but harmless: a side effect of using a str cache key. Main replaces both errors
  with ValueError through a feature change (python/cpython#145850, type-feature, 3.15), so main
  is not a fix of a reported bug. A maintainer would most likely not change 3.14 for this.
reproducer: |
  import struct
  try:
      struct.Struct(b'\xff')
  except Exception as e:
      a = type(e).__name__
  try:
      struct.pack(b'\xff')
  except Exception as e:
      b = type(e).__name__
  print(a, b)
  if a == 'error' and b == 'UnicodeEncodeError':
      print('REPRODUCED textlibs-struct-bytes-format-nonascii-error')
expected: |
  `struct.pack(fmt)` and `Struct(fmt).pack()` raise the same exception for the same format.
observed: |
  python3 3.14.7: error / UnicodeEncodeError. REPRODUCED.
  main 3.16.0a1+dev (ef1fce0): ValueError from both. NOT reproduced.
promised_by: |
  invariant: the module functions are documented as equivalent to the Struct methods.
cause: |
  Modules/_struct.c:2518-2520 (surrogateescape key), :2539 (Struct(key)), :1814-1818 (strict
  ASCII encode).
possible_fix: |
  None worth making on 3.14; main already unified the error.
duplicates: |
  No report found. Related: python/cpython#145850 (redesign on main). Not in the bugforge list.
  Queries: gh api search/issues q='repo:python/cpython struct non-ASCII format string'
lean: lean/PyLean/TextLibs/StructProps.lean (ModuleMatchesStruct, moduleMatchesStruct_refuted)
