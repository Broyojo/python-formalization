id: textlibs-struct-native-float-snan
title: "struct: unpack quiets a signalling NaN in some modes and preserves it in others"
priority: P4
kind: internal-inconsistency
module: textlibs
files: [Modules/_struct.c, Objects/floatobject.c]
functions: ["nu_float", "nu_float_complex", "lu_float", "bu_float_complex"]
summary: |
  `nu_float` and `nu_float_complex` convert with a C cast, which quiets a signalling NaN, while
  PyFloat_Unpack4 deliberately preserves one. On 3.14.7, unpacking 0100807f gives
  000000200000f87f with `f` and 000000200000f07f with `<f`, although native and little-endian differ
  only in alignment on this build. `F` and `<F` quiet while `>F` preserves, and
  `pack('f', unpack('f', b))` changes the bytes while the `<f` round trip does not.
likelihood: |
  Very low. Needs a signalling NaN in binary data, and only its quiet bit changes.
maybe_intended: |
  Unclear. PyFloat_Unpack4's comment ("return sNaN double if x was sNaN float") shows that
  preserving it is deliberate there, and #130317 and #141042 fixed the same class of problem for
  half floats. Main changed where the split falls rather than removing it, so byte order now
  changes the result. A NaN-focused maintainer may care; most would not treat this as urgent.
reproducer: |
  import struct
  sn = bytes.fromhex('0100807f')
  bits = lambda x: struct.pack('<d', x).hex()
  native_c = bits(struct.unpack('F', sn + sn)[0].real)
  big_c = bits(struct.unpack('>F', sn[::-1] * 2)[0].real)
  native_f = bits(struct.unpack('f', sn)[0])
  little_f = bits(struct.unpack('<f', sn)[0])
  print(native_f, little_f, native_c, big_c)
  if native_c != big_c:
      print('REPRODUCED textlibs-struct-native-float-snan')
expected: |
  Every mode either preserves a signalling NaN or quiets it, the same way.
observed: |
  python3 3.14.7: f 000000200000f87f, <f 000000200000f07f, F 000000200000f87f, >F 000000200000f07f.
  REPRODUCED.
  main 3.16.0a1+dev (ef1fce0): f and <f both 000000200000f87f, >f 000000200000f07f, F
  000000200000f87f, >F 000000200000f07f. REPRODUCED through F against >F; `f` against `<f` no longer
  differs.
promised_by: |
  invariant: PyFloat_Unpack4 preserves signalling NaNs on purpose (Objects/floatobject.c:2509-2522).
cause: |
  Modules/_struct.c:482-487 (nu_float casts to double), :498-504 (nu_float_complex), and
  :1537-1540, which keeps `f` out of the native swap but not `F`.
possible_fix: |
  Use PyFloat_Unpack4 in nu_float and nu_float_complex, or decide that NaN signalling is not
  preserved and drop the special case in PyFloat_Unpack4.
duplicates: |
  No report of this exact split. Related: python/cpython#130317, #141042 (half floats, fixed).
  Not in the bugforge list.
  Queries: gh api search/issues q='repo:python/cpython struct unpack signaling NaN float'
lean: lean/PyLean/TextLibs/StructClose.lean (NativeFloatMatchesStd, nativeFloatMatchesStd_refuted, NativeComplexMatchesBig, nativeComplexMatchesBig_refuted)
