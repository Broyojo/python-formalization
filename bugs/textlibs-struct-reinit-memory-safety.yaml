id: textlibs-struct-reinit-memory-safety
title: "Calling Struct.__init__ on a live Struct reaches freed and out-of-bounds memory from pure Python"
priority: P2
kind: memory-safety
module: textlibs
files: [Modules/_struct.c]
functions: ["s_pack_internal", "Struct_pack_impl", "Struct_pack_into_impl", "unpackiter_iternext", "unpackiter_len",
  "Struct_iter_unpack_impl", "prepare_s"]
summary: |
  Struct.__init__ can be called again on a Struct that is in use. prepare_s frees s_codes and replaces
  s_size and s_len (Modules/_struct.c:1786-1791), and no method or iterator guards against it. A
  conversion such as __index__ can do this in the middle of a method, and any code can do it between
  two next() calls of an iterator. This has one root cause and these consequences:
  1. s_pack_internal keeps walking the freed s_codes after the conversion returns (:2342, :2409).
     This use-after-free segfaults with allocator churn on 3.15.2 and on main.
  2. iter_unpack, after a larger format: unpackiter_iternext reads past the buffer, because the only
     bound is an assert (:2245). This returns heap contents as bytes on 3.15.2 and on main.
  3. iter_unpack, after a zero-sized format: unpackiter_len divides by zero (:2220). SIGFPE on
     3.15.2 and on main. next() on such an iterator also never ends.
  4. iter_unpack itself, when the buffer's __buffer__ installs a zero-sized format: the zero test
     (:2291) runs before PyObject_GetBuffer (:2303), and the % at :2307 divides by zero. SIGFPE on
     3.15.2 and on main (python/cpython#158695).
  Struct.pack finishes with the new s_size (:2457), which 3.15.2 refuses for a larger format with
  ValueError "size larger than allocated size", so that path no longer discloses memory. pack_into
  converts the offset before it compares the count (Modules/clinic/_struct.c.h), so an offset can no
  longer install a longer format; a packed value's __index__ still can, which is case 1.
likelihood: |
  Low in ordinary code: re-initialising a Struct in use is unusual, and 3.15.2 warns about
  re-initialisation. It is reachable from pure Python, though, and 2 discloses heap memory.
maybe_intended: |
  No for the memory errors. The FutureWarning shows re-initialisation is on its way out, and a
  maintainer may prefer that to guards. It is only a warning, so the crashes remain until the feature
  is removed. Related reports were never judged on merit:
  python/cpython#158695 was closed with a batch of tracker spam from an automated filer.
reproducer: |
  import struct, subprocess, sys, warnings
  warnings.simplefilter('ignore')
  s = struct.Struct('b')
  it = s.iter_unpack(bytes(8))
  next(it)
  s.__init__('64s')
  leaked = next(it)[0]
  print('read', len(leaked), 'bytes from an 8-byte buffer')
  code = """
  import struct, warnings
  warnings.simplefilter('ignore')
  s = struct.Struct('b')
  it = s.iter_unpack(bytes(8))
  s.__init__('0s')
  it.__length_hint__()
  """
  p = subprocess.run([sys.executable, '-c', code], capture_output=True)
  print('length hint exit status', p.returncode)
  code2 = """
  import struct, warnings
  warnings.simplefilter('ignore')
  s = struct.Struct('b')
  class B:
      def __buffer__(self, flags):
          s.__init__('0s')
          return memoryview(bytes(8))
  s.iter_unpack(B())
  """
  q = subprocess.run([sys.executable, '-c', code2], capture_output=True)
  print('iter_unpack exit status', q.returncode)
  if len(leaked) > 8 and p.returncode < 0 and q.returncode < 0:
      print('REPRODUCED textlibs-struct-reinit-memory-safety')
expected: |
  An exception, or a Struct that cannot be changed while in use. No read outside the buffer, no crash.
observed: |
  python3 3.15.2: 64 bytes read from an 8-byte buffer, length hint exit status -8, iter_unpack exit
  status -8 (SIGFPE). REPRODUCED.
  main 3.16.0a1+dev (ef1fce0): the same. REPRODUCED.
promised_by: |
  The undisputed invariant that Python code does not read freed memory or crash the interpreter.
cause: |
  prepare_s frees s_codes at Modules/_struct.c:1787-1788 with no check that a method or iterator is
  using the object. s_pack_internal holds a pointer into it across e->pack (:2342, :2402, :2409).
  unpackiter_iternext and unpackiter_len read so->s_size afresh (:2245-2249, :2220).
  Struct_iter_unpack_impl tests s_size before the buffer conversion and divides by it after
  (:2291, :2303, :2307).
possible_fix: |
  Refuse __init__ on an initialised Struct, as the FutureWarning announces.
  Failing that: make the iterator keep its own copy of the size, and take a private reference to the
  codes in s_pack_internal.
duplicates: |
  No report of the pack use-after-free or the over-reads. Related, same root cause, different site:
  python/cpython#158695 (closed not planned as bulk filing; division at :2307 through __buffer__), and
  the bugforge entries "Struct reinitialization to a zero-sized format makes an existing iter_unpack
  iterator nonterminating" (not filed) and "struct.Struct.iter_unpack crashes when __buffer__
  reinitializes the Struct to a zero-sized format".
  Queries: gh search issues --repo python/cpython "struct re-initialization use after free";
  "Struct __init__ __index__ crash"; "struct.Struct __init__ reinitialization"; "struct segfault pack
  __index__"; "struct.Struct use-after-free"; "Struct __init__ deprecate re-initialization"; "struct
  pack mutate format during __index__"; gh search prs "Struct re-initialization FutureWarning";
  gh issue view 158695; gh issue view 158748.
lean: lean/PyLean/TextLibs/StructFail.lean (PackNoUnsafe, PackIntoNoUnsafe, IterNoOverRead, IterLenNoCrash),
  lean/PyLean/TextLibs/StructUse.lean (IterUnpackNoCrash)
