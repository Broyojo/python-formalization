id: typeobj-imul-sequence-fallback
title: "x *= seq raises TypeError for instances of Python classes although x * seq works: the sq_repeat fallback in PyNumber_InPlaceMultiply tests tp_as_sequence, which every heap type has"
priority: P3
kind: self-inconsistency
module: typeobj
files: [Objects/abstract.c]
functions: ["PyNumber_InPlaceMultiply"]
summary: |
  `PyNumber_Multiply` repeats a sequence on either side: if the left operand has no
  `sq_repeat`, it uses the right operand's (abstract.c:1173-1178), so `n * seq` works for any
  `n` with `__index__`. `PyNumber_InPlaceMultiply` is meant to do the same, and its comment
  says so ("the right hand operand should not be mutated in this case so sq_inplace_repeat
  is not used"), but it writes the test as `if (mv != NULL) { ... } else if (mw != NULL)`
  (abstract.c:1329, @3.14.7:1336). `mv` is `Py_TYPE(v)->tp_as_sequence`, and `type_new_alloc` sets
  that pointer on every heap type (typeobject.c:4488). So for an instance of any Python
  class, including a subclass of int, the right operand is never consulted:

      class Index:
          def __index__(self): return 2
      Index() * [1]        # [1, 1]
      x = Index(); x *= [1]   # TypeError: unsupported operand type(s) for *=: 'Index' and 'list'

      class I(int): pass
      I(2) * [1]           # [1, 1]
      y = I(2); y *= [1]   # TypeError, while n = 2; n *= [1] gives [1, 1]

  The model mirrors both functions; the Lean proof shows the two fallbacks agree only when
  `tp_as_sequence` is NULL, so every case where they differ is a left operand with that
  struct and no repeat slot.
likelihood: |
  Low to moderate. `n *= [0]` with `n` an int subclass (an enum.IntEnum member, a
  numpy-free counter subclass) or an `__index__` type is legal code that works with plain
  ints and with `*`. Code hitting this gets a clean TypeError, not wrong data.
maybe_intended: |
  Unlikely. The else-if comes from when only static types existed and NULL meant "not a
  sequence"; nothing in the comment or the docs says in-place multiply should treat Python
  classes differently from C ints. `x = x * y` and `x *= y` are documented to fall back to
  each other when `__imul__` is missing (language reference, "Emulating numeric types").
reproducer: |
  class Index:
      def __index__(self):
          return 2
  class I(int):
      pass
  print('Index() * [1] =', Index() * [1])
  print('I(2) * [1] =', I(2) * [1])
  n = 2
  n *= [1]
  print('2 *= [1] ->', n)
  errors = []
  for v in (Index(), I(2)):
      try:
          v *= [1]
      except TypeError as e:
          errors.append(str(e))
  print(errors)
  if (Index() * [1] == [1, 1] and I(2) * [1] == [1, 1] and n == [1, 1]
          and len(errors) == 2 and all("*=" in e for e in errors)):
      print('REPRODUCED typeobj-imul-sequence-fallback')
expected: |
  `x *= seq` gives the same result as `x * seq` when `x` has no `__imul__`, `__mul__` or
  repeat slot, as it does for `n = 2`.
observed: |
  python3 3.14.7: TypeError: unsupported operand type(s) for *=: 'Index' and 'list'. REPRODUCED.
  python3 (3.15.2): REPRODUCED by scripts/check_bugs.py
  main (3.16.0a1+dev, vendor/cpython-main/python.exe): REPRODUCED by scripts/check_bugs.py.
promised_by: |
  The twin PyNumber_Multiply (abstract.c:1166-1182); the comment at abstract.c:1337-1339;
  language reference, Data model, "Emulating numeric types": if __imul__ is not defined, the
  operation falls back to the normal multiplication, as x = x * y.
cause: |
  Objects/abstract.c:1339 and :1346: the `else if (mw != NULL)` branch is reachable only when
  `mv == NULL`. Objects/typeobject.c:4488 makes `mv` non-NULL for every heap type, so a left
  operand with an empty as_sequence struct skips the fallback and falls to binop_type_error
  at :1353.
possible_fix: |
  Test the slot, not the struct:

      if (mv != NULL) { f = mv->sq_inplace_repeat ?: mv->sq_repeat; if (f) return sequence_repeat(f, v, w); }
      if (mw != NULL && mw->sq_repeat) return sequence_repeat(mw->sq_repeat, w, v);
