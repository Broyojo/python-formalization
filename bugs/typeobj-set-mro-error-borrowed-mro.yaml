  searched_again: "2026-11-04; word searches found #159098 (getattr, different path) and #132835 (closed: NULL in mro_hierarchy), neither this one"
lean: |
  Not refuted in Lean: the model passes the remaining lists by value and hashes classes by
  identity (a stated scope limit), so it cannot express the borrowed tuple. SetMroErrorMessage
  (lean/PyLean/TypeObj/MroSpec2.lean) states the message when the lookups do not re-enter, and
  names this record.
