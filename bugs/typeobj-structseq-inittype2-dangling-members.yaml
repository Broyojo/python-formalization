    - {number: 77923, state: closed, relation: "PyStructSequence_InitType on uninitialised memory (bpo-33742), closed as not a bug; a different defect"}
  queries: ["PyStructSequence_InitType2", "PyStructSequence_InitType", "InitType2 members free",
            "structseq static type use after free", "PyStructSequence_InitType error"]
  bugforge: "no match for structseq or PyStructSequence"
