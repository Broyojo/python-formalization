id: typeobj-structseq-newtype-nseq-past-fields
title: "PyStructSequence_NewType and PyStructSequence_InitType2 do not validate their desc: n_in_sequence = #fields + 4 (InitType2: + 1 to + 4) reads past the field array, unnamed hidden fields make __reduce__ and the constructor read tp_members[-1], and 2^29 hidden fields wrap NewType's tp_basicsize"
priority: P4
kind: validation-order
module: typeobj
files: [Objects/structseq.c, Objects/typeobject.c]
functions: ["_PyStructSequence_NewType", "PyStructSequence_NewType", "PyStructSequence_InitType2", "initialize_static_fields", "count_members", "initialize_members", "structseq_reduce", "structseq_new_impl"]
summary: |
  `_PyStructSequence_NewType` (structseq.c:744-793) checks nothing about the desc it is given.
  Three consequences, all from C (or ctypes), all one cause:

  1. `n_in_sequence` is never compared with the number of fields `count_members` found. It
     computes `spec.basicsize = (int)(sizeof(PyStructSequence) + (hidden - 1) *
     sizeof(PyObject *))` with `hidden = n_members - n_in_sequence` (:774-775), and
     `initialize_structseq_dict` reads `desc->fields[i]` for every `i < n_in_sequence`
     (:510-520). A too-large `n_in_sequence` is rejected only as a side effect of
     `PyType_FromSpecWithBases`'s handling of that basicsize:
       - `hidden = -1, -2, -3`: basicsize 24, 16, 8: TypeError (Objects/typeobject.c:5207-5212);
       - `hidden <= -5`: a negative basicsize means "extend the base": SystemError (:5629-5643);
       - `hidden = -4`: basicsize 0 means "inherit" (:5645-5648), the type is built, and the
         `__match_args__` loop reads `fields[n]` (the terminator, whose NULL name goes to
         `PyUnicode_FromString`) and past it: a crash.
  2. Unnamed fields are "only allowed for indices < n_visible_fields" (comment at :23-24), but an
     unnamed hidden field is accepted. `structseq_reduce` (:369) and the constructor's dict loop
     (:242) index `tp_members[i - n_unnamed_fields]`, which for fields `x`, unnamed, unnamed and
     `n_in_sequence = 1` is `tp_members[-1]`: on 3.15.2 `__reduce__` returns the dict
     `{'m.T': None, 'x': None}`, the key `'m.T'` read from the memory before the array.
  3. The `(int)` cast at :775 wraps: with 2^29 hidden fields, `40 + (2^29 - 1) * 8` is `2^32 + 32`,
     cast to 32, so the type has `n_fields = 2^29` and `tp_basicsize = 32`, and `get_real_size`
     (:55-62) counts none of its hidden fields. (The reproducer maps one 2 MB page of unnamed
     fields 4096 times, so the 8 GB desc costs 2 MB.)

  4. The static twin `PyStructSequence_InitType2` (:672-704) computes the same basicsize in
     `Py_ssize_t` (`initialize_static_fields`, :581-582), and `PyType_Ready` of a static type has
     no "too small for base" check (that is in `PyType_FromMetaclass`, Objects/typeobject.c:5781);
     it only refuses `tp_dictoffset + tp_basicsize <= 0` (:9571-9577). So `n_in_sequence` =
     #fields + 1 .. + 4 all reach the `__match_args__` loop and crash, where NewType refuses + 1 ..
     + 3 with TypeError; #fields + 5 and above give SystemError "tp_dictoffset that is too small".

  The Lean model refutes `NewTypeInBounds` (case 1, one field, `n_in_sequence = 5`),
  `ReduceInBoundsBuilt` (case 2), `NewTypeBasicsizeExact` (case 3) and `StaticTwinAll` (case 4,
  one field, `n_in_sequence = 2`). `NewTypeOutcomes` proves the refusals listed in case 1 and that
  every valid desc is accepted; `StaticTwin` that on valid descs the two twins agree.
likelihood: |
  Very low: a C extension has to pass a desc that is wrong (too large `n_in_sequence`, unnamed
  hidden fields) or absurd (2^29 fields). All three are reachable through ctypes.
maybe_intended: |
  Largely. The docs say only "Number of fields visible to the Python side", and the unnamed-field
  rule lives in a source comment; C API functions often do not validate such input. But the
  function does reject every other too-large `n_in_sequence` with an exception, so a crash for
  exactly one value, and a silently wrong layout, are not a deliberate design.
reproducer: |
  import subprocess, sys
  HELPER = (
      "import ctypes, sys\n"
      "api = ctypes.pythonapi\n"
      "class Field(ctypes.Structure):\n"
      "    _fields_ = [('name', ctypes.c_void_p), ('doc', ctypes.c_char_p)]\n"
      "class Desc(ctypes.Structure):\n"
      "    _fields_ = [('name', ctypes.c_char_p), ('doc', ctypes.c_char_p),\n"
      "                ('fields', ctypes.c_void_p), ('n_in_sequence', ctypes.c_int)]\n"
      "api.PyStructSequence_NewType.restype = ctypes.py_object\n"
      "api.PyStructSequence_NewType.argtypes = [ctypes.POINTER(Desc)]\n"
      "UNNAMED = ctypes.c_void_p.in_dll(api, 'PyStructSequence_UnnamedField').value\n"
      "keep = []\n"
      "def mk(names, nseq):\n"
      "    arr = (Field * (len(names) + 1))()\n"
      "    for i, nm in enumerate(names):\n"
      "        if nm is None:\n"
      "            arr[i].name = UNNAMED\n"
      "        else:\n"
      "            b = ctypes.create_string_buffer(nm); keep.append(b)\n"
      "            arr[i].name = ctypes.cast(b, ctypes.c_void_p).value\n"
      "    arr[len(names)].name = None\n"
      "    d = Desc(b'm.T', None, ctypes.cast(arr, ctypes.c_void_p).value, nseq); keep.append((arr, d))\n"
      "    return api.PyStructSequence_NewType(ctypes.byref(d))\n")
  NSEQ = HELPER + (
      "try:\n"
      "    mk([b'a'], int(sys.argv[1]))\n"
      "    print('built')\n"
      "except Exception as e:\n"
      "    print(type(e).__name__)\n")
  out = {}
  for nseq in (2, 3, 4, 5, 6, 9):
      r = subprocess.run([sys.executable, "-I", "-c", NSEQ, str(nseq)], capture_output=True, text=True, timeout=60)
      out[nseq] = r.stdout.strip() if r.returncode == 0 else f"crash {r.returncode}"
      print(f"1 field, n_in_sequence = {nseq}: {out[nseq]}")
  case1 = (out[2] == out[3] == out[4] == "TypeError" and out[5].startswith("crash")
           and out[6] == out[9] == "SystemError")
  HIDDEN = HELPER + (
      "T = mk([b'x', None, None], 1)\n"
      "print(sorted(T((1,)).__reduce__()[1][1]))\n")
  r = subprocess.run([sys.executable, "-I", "-c", HIDDEN], capture_output=True, text=True, timeout=60)
  print("fields x, unnamed, unnamed, n_in_sequence = 1: __reduce__ dict keys", r.stdout.strip() or f"crash {r.returncode}")
  case2 = r.returncode != 0 or r.stdout.strip() != "[]"
  WIDE = (
      "import ctypes, mmap, os\n"
      "libc = ctypes.CDLL(None, use_errno=True)\n"
      "libc.mmap.restype = ctypes.c_void_p\n"
      "libc.mmap.argtypes = [ctypes.c_void_p, ctypes.c_size_t, ctypes.c_int, ctypes.c_int, ctypes.c_int, ctypes.c_long]\n"
      "api = ctypes.pythonapi\n"
      "UNNAMED = ctypes.c_void_p.in_dll(api, 'PyStructSequence_UnnamedField').value\n"
      "CHUNK = 2 * 1024 * 1024\n"
      "N = 2 ** 29\n"
      "chunks = N * 16 // CHUNK\n"
      "fd = os.memfd_create('fields'); os.ftruncate(fd, CHUNK)\n"
      "m = mmap.mmap(fd, CHUNK); m.write(bytes((ctypes.c_void_p * 2)(UNNAMED, None)) * (CHUNK // 16))\n"
      "fd2 = os.memfd_create('end'); os.ftruncate(fd2, CHUNK)\n"
      "base = libc.mmap(None, (chunks + 1) * CHUNK, 0, 0x22, -1, 0)\n"
      "for i in range(chunks + 1):\n"
      "    r = libc.mmap(base + i * CHUNK, CHUNK, 1, 0x11, fd if i < chunks else fd2, 0)\n"
      "    assert r == base + i * CHUNK\n"
      "class Desc(ctypes.Structure):\n"
      "    _fields_ = [('name', ctypes.c_char_p), ('doc', ctypes.c_char_p),\n"
      "                ('fields', ctypes.c_void_p), ('n_in_sequence', ctypes.c_int)]\n"
      "api.PyStructSequence_NewType.restype = ctypes.py_object\n"
      "api.PyStructSequence_NewType.argtypes = [ctypes.POINTER(Desc)]\n"
      "d = Desc(b'm.Wide', None, base, 0)\n"
      "T = api.PyStructSequence_NewType(ctypes.byref(d))\n"
      "print(T.n_fields, T.n_sequence_fields, T.__basicsize__)\n")
  r = subprocess.run([sys.executable, "-I", "-c", WIDE], capture_output=True, text=True, timeout=120)
  print("2^29 unnamed fields, n_in_sequence = 0: n_fields, n_sequence_fields, __basicsize__ =", r.stdout.strip() or r.stderr.strip()[-200:])
  case3 = r.stdout.split() == [str(2 ** 29), "0", "32"]
  STATIC = HELPER + (
      "arr = (Field * 2)()\n"
      "b = ctypes.create_string_buffer(b'a'); keep.append(b)\n"
      "arr[0].name = ctypes.cast(b, ctypes.c_void_p).value\n"
      "d = Desc(b'm.T', None, ctypes.cast(arr, ctypes.c_void_p).value, int(sys.argv[1]))\n"
      "api.PyStructSequence_InitType2.restype = ctypes.c_int\n"
      "api.PyStructSequence_InitType2.argtypes = [ctypes.c_void_p, ctypes.POINTER(Desc)]\n"
      "buf = ctypes.create_string_buffer(type.__basicsize__ + 64)\n"
      "try:\n"
      "    api.PyStructSequence_InitType2(ctypes.addressof(buf), ctypes.byref(d))\n"
      "    print('built', flush=True)\n"
      "except Exception as e:\n"
      "    print(type(e).__name__, flush=True)\n"
      "import os; os._exit(0)\n")
  sout = {}
  for nseq in (1, 2, 6):
      r = subprocess.run([sys.executable, "-I", "-c", STATIC, str(nseq)], capture_output=True, text=True, timeout=60)
      sout[nseq] = r.stdout.strip() if r.returncode == 0 else f"crash {r.returncode}"
      print(f"InitType2, 1 field, n_in_sequence = {nseq}: {sout[nseq]}")
  case4 = sout[1] == "built" and sout[2].startswith("crash") and sout[6] == "SystemError"
  if case1 and case2 and case3 and case4:
      print("REPRODUCED typeobj-structseq-newtype-nseq-past-fields")
expected: |
  A desc with `n_in_sequence` outside `0 .. #fields`, or an unnamed field past `n_in_sequence`,
  is refused with an exception before anything reads it; a type built has
  `tp_basicsize = 32 + 8 * hidden` or is refused.
observed: |
  python3 (3.15.2): n_in_sequence 2-4 TypeError, 5 crash (SIGSEGV), 6 and 9 SystemError (InitType2:
  1 builds, 2 crashes, 6 SystemError); the
  unnamed-hidden type's `__reduce__` dict has keys ['m.T', 'x']; the wide type has n_fields
  536870912 and __basicsize__ 32. REPRODUCED by scripts/check_bugs.py.
  main (3.16.0a1+dev, vendor/cpython-main/python.exe): the same, REPRODUCED.
promised_by: |
  Undisputed invariants: a C API call either fails with an exception or works, and does not
  read outside its input; the layout `tp_basicsize` states is the one the size attributes state.
  The function's own behaviour on the neighbouring `n_in_sequence` values.
cause: |
  Objects/structseq.c:744-775 derives the layout from an unchecked desc; :774-775 casts the
  basicsize to int; :510-520 read `desc->fields[i]` for `i < n_in_sequence`; :369 and :242 index
  `tp_members[i - n_unnamed_fields]`; Objects/typeobject.c:5645-5648 turns basicsize 0 into
  "inherit".
possible_fix: |
  In `_PyStructSequence_NewType` (and `PyStructSequence_InitType2`, which builds the same
  layout), refuse `n_in_sequence < 0 || n_in_sequence > n_members`, an unnamed field at an index
  `>= n_in_sequence`, and a basicsize that does not fit an int, before using any of them.
