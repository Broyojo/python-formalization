id: typeobj-structseq-newtype-nseq-past-fields
title: "PyStructSequence_NewType with n_in_sequence = number of fields + 4 reads past the field array and crashes; +1..+3 and +5.. are refused only by accident of the basicsize arithmetic"
priority: P4
kind: validation-order
module: typeobj
files: [Objects/structseq.c, Objects/typeobject.c]
functions: ["_PyStructSequence_NewType", "PyStructSequence_NewType", "count_members"]
summary: |
  `_PyStructSequence_NewType` never checks `desc->n_in_sequence` against the number of fields
  `count_members` found. It computes `spec.basicsize = (int)(sizeof(PyStructSequence) +
  (hidden - 1) * sizeof(PyObject *))` with `hidden = n_members - n_in_sequence` (:774-775), and
  `initialize_structseq_dict` then reads `desc->fields[i]` for every `i < n_in_sequence`
  (:510-520). An `n_in_sequence` above the field count is rejected only as a side effect of
  `PyType_FromSpecWithBases`'s handling of that basicsize:

    - `hidden = -1, -2, -3`: basicsize 24, 16, 8, below tuple's 32: TypeError from `type_ready`
      (Objects/typeobject.c:5207-5212);
    - `hidden <= -5`: a negative basicsize means "extend the base", which tuple refuses:
      SystemError (Objects/typeobject.c:5629-5643);
    - `hidden = -4`: basicsize 0 means "inherit the base's" (:5645-5648), the type is built, and
      the `__match_args__` loop reads `fields[n]` (the terminator, whose NULL name goes to
      `PyUnicode_FromString`) and past it: a crash.

  The Lean model refutes `NewTypeInBounds` with one field and `n_in_sequence = 5`.
likelihood: |
  Very low: a C extension has to pass an `n_in_sequence` larger than its field list, which is a
  programming error. It is reachable through ctypes.
maybe_intended: |
  Largely. The docs say only "Number of fields visible to the Python side", which implies it is at
  most the number of fields; C API functions often do not validate such input. But the function
  does reject every other too-large value with an exception, so a crash for exactly one value is
  not a deliberate design.
reproducer: |
  import subprocess, sys
  HELPER = (
      "import ctypes, sys\n"
      "api = ctypes.pythonapi\n"
      "class Field(ctypes.Structure):\n"
      "    _fields_ = [('name', ctypes.c_char_p), ('doc', ctypes.c_char_p)]\n"
      "class Desc(ctypes.Structure):\n"
      "    _fields_ = [('name', ctypes.c_char_p), ('doc', ctypes.c_char_p),\n"
      "                ('fields', ctypes.POINTER(Field)), ('n_in_sequence', ctypes.c_int)]\n"
      "api.PyStructSequence_NewType.restype = ctypes.py_object\n"
      "api.PyStructSequence_NewType.argtypes = [ctypes.POINTER(Desc)]\n"
      "fields = (Field * 2)()\n"
      "fields[0].name = b'a'\n"
      "fields[1].name = None\n"
      "d = Desc(b'm.T', None, fields, int(sys.argv[1]))\n"
      "try:\n"
      "    api.PyStructSequence_NewType(ctypes.byref(d))\n"
      "    print('built')\n"
      "except Exception as e:\n"
      "    print(type(e).__name__)\n")
  out = {}
  for nseq in (2, 3, 4, 5, 6, 9):
      r = subprocess.run([sys.executable, "-I", "-c", HELPER, str(nseq)], capture_output=True, text=True, timeout=60)
      out[nseq] = r.stdout.strip() if r.returncode == 0 else f"crash {r.returncode}"
      print(f"1 field, n_in_sequence = {nseq}: {out[nseq]}")
  if (out[2] == out[3] == out[4] == "TypeError" and out[5].startswith("crash")
          and out[6] == out[9] == "SystemError"):
      print("REPRODUCED typeobj-structseq-newtype-nseq-past-fields")
expected: |
  Every `n_in_sequence` larger than the number of fields (or negative) raises the same
  exception before anything reads the field array.
observed: |
  python3 (3.15.2): n_in_sequence 2-4 TypeError, 5 crash (SIGSEGV), 6 and 9 SystemError.
  REPRODUCED by scripts/check_bugs.py.
  main (3.16.0a1+dev, vendor/cpython-main/python.exe): the same, REPRODUCED.
promised_by: |
  Undisputed invariant: a C API call either fails with an exception or works; and the function's
  own behaviour on the neighbouring values.
cause: |
  Objects/structseq.c:774-775 derives the basicsize from an unchecked `n_in_sequence`; :510-520
  read `desc->fields[i]` for `i < n_in_sequence`; Objects/typeobject.c:5645-5648 turns the
  resulting basicsize 0 into "inherit".
possible_fix: |
  Check `0 <= desc->n_in_sequence <= n_members` in `_PyStructSequence_NewType` (and in
  `PyStructSequence_InitType2`, which computes the same layout) before using it.
duplicates:
  issues: []
  queries: ["PyStructSequence_NewType n_in_sequence", "n_in_sequence crash", "PyStructSequence_NewType crash",
            "n_in_sequence", "structseq", "PyStructSequence"]
  bugforge: "no match for structseq or PyStructSequence"
lean:
  property: PyLean.TypeObj.StructSeq.NewTypeInBounds
  theorem: PyLean.TypeObj.StructSeq.newTypeInBounds_refuted
