id: unicodeobj-format-grouping-width-loop
title: "format(1, '0<huge>,') spins in an uninterruptible loop proportional to the width before it can raise MemoryError"
priority: P4
kind: hang
module: unicode_formatter
files: [Objects/unicodeobject.c, Objects/unicode_formatter.c]
functions: ["_PyUnicode_InsertThousandsGrouping", "calc_number_widths"]
summary: |
  With zero padding and a thousands separator, calc_number_widths asks
  _PyUnicode_InsertThousandsGrouping for the padded size before anything is allocated. That
  function has no arithmetic shortcut: it walks group by group until `min_width` is used up, so
  it runs width/4 iterations with no signal check. format(1, '0' + '9' * 18 + ',') would need
  about 2.5e17 iterations; without the comma the same width raises MemoryError at once. The time
  is lost before the allocation that was going to fail anyway, and Ctrl-C has no effect.
likelihood: |
  Low. It needs an attacker- or user-controlled format spec with a very large width, zero
  padding and ','. Services that format with user-supplied specs are the exposure.
maybe_intended: |
  Not designed, but an unusual input. A maintainer may treat a user-controlled format spec as
  already unsafe, since width alone can request a large allocation.
reproducer: |
  import subprocess, sys
  width = 10 ** 15
  fast = subprocess.run([sys.executable, "-c",
      "try:\n    format(1, '0%d')\nexcept MemoryError:\n    print('MemoryError')" % width],
      capture_output=True, text=True, timeout=30)
  try:
      subprocess.run([sys.executable, "-c", "format(1, '0%d,')" % width],
                     capture_output=True, text=True, timeout=5)
      spun = False
  except subprocess.TimeoutExpired:
      spun = True
  print("without comma:", fast.stdout.strip(), "| with comma still running after 5s:", spun)
  if "MemoryError" in fast.stdout and spun:
      print("REPRODUCED unicodeobj-format-grouping-width-loop")
expected: |
  MemoryError or OverflowError straight away, as without the comma.
observed: |
  The call with ',' runs on, using one core, for the width/4 iterations.
tested: "REPRODUCED on python3 3.15.2 and on main (3.16.0a1+dev) by scripts/check_bugs.py"
promised_by: |
  Invariant: no hang. calc_number_widths and the format with no separator handle the same width at once.
cause: |
  Objects/unicode_formatter.c:196-223, the `while` loop of _PyUnicode_InsertThousandsGrouping, called
  with writer == NULL from Objects/unicode_formatter.c:852-855 with n_min_width near the width.
possible_fix: |
  Check the padded size against PY_SSIZE_T_MAX, or compute the count in closed form when `grouping`
  repeats, before entering the loop.
lean: |
  No Lean statement. The model has no allocator and no KeyboardInterrupt, so "refused before work
  that grows with the width" cannot be stated in it. An earlier refutation (groupLoopLinear_refuted,
  "the rounds of the grouping loop are bounded by the digits") was withdrawn: CPython never promises
  that bound, and a zero-padded grouped field of width 40 legitimately needs about 13 rounds. What
  the loop does write is pinned by groupingPlacement_proven (lean/PyLean/UnicodeObj/FormatGroupDoc.lean,
  registry id unicodeobj-format-group-digits): the digits zero padded to min_width and grouped from
  the right; the defect is only that the counting call does this work, one round per group of the
  requested width, before an allocation that cannot succeed, with no size or signal check.
duplicates:
  issues: []
  queries: ["format width comma hang", "thousands separator width slow", "InsertThousandsGrouping",
            "format huge width MemoryError", "format zero padding comma"]
  bugforge: "no match in vendor/bugforge-results/README.md"
